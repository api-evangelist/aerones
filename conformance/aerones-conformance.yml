domain_standards:
  note: >-
    Aerones' market is wind-turbine operations and maintenance. The domain data standards
    that exist in this sector - IEC 61400-25 (SCADA communications for wind power plants),
    IEC 61400-5 (blades), and the IEA Wind Task 43 WRA Data Model / Wind Energy Ontology -
    are for SCADA telemetry and resource assessment, not for the blade-service work-order
    and anomaly domain this API actually covers. Nothing in the contract declares any of
    them, and no vocabulary, ontology URI or standard identifier appears in the 1,377
    schemas. Recorded as absent, not as a failing: the reward-only rule applies.
  declared: []
  probed_for:
  - id: iec-61400-25
    found: false
  - id: iea-wind-task-43-wra-data-model
    found: false
  - id: ogc-api
    found: false
    note: >-
      Geospatial concepts exist (customer locations, coordinates, point clouds) but no
      OGC conformance class, GetCapabilities surface or /conformance endpoint is served.
