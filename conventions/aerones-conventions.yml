idempotency:
  supported: partial
  coverage: partial
  mechanism: per-operation semantics
  header: null
  note: >-
    There is no Idempotency-Key header and no replay-protection mechanism of any kind.
    Instead, seven individual write operations state in their own description that they
    are idempotent - a merge that skips existing rows, a cancel that is a no-op when
    already terminal, a draft-create that returns the existing draft. Everything else on
    the write surface (roughly 480 POST/PUT/PATCH/DELETE operations) has no replay
    protection, so a retried request creates a duplicate. This is scope-limited
    idempotency in the sense of roadmap#243, not a Stripe-shaped contract.
