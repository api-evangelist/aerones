- aid: aerones-operations-hub-graphql
  name: Aerones Operations Hub GraphQL API
  description: 'The GraphQL surface of the Aerones Operations Hub, served at /graphql
    with anonymous introspection enabled and the full SDL published as text/plain at
    /api/graphql-schema. 1,524 types, 339 Query fields, 325 Mutation fields and 4
    Subscription fields (workorderChanged, projectWorkorderChanged, myPendingScopeCommitmentsChanged,
    notificationReceived). Built on strawberry-django — field-level authorization is
    expressed with a @hasPerm directive carried in the published schema.'
  humanURL: https://operations.aerones.com/api/graphql-schema
