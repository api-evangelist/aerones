aid: aerones
name: Aerones
description: Aerones is a Latvian robotics company that performs wind turbine blade inspection, cleaning,
  coating, leading-edge repair and lightning-protection testing with cable-suspended robots and autonomous
  drones, operating onshore and offshore for owners and OEMs including NextEra, GE, Vestas, Enel and Siemens
  Gamesa. Its software side is the Operations Hub — a Django Ninja backend behind portal.aerones.com that
  publishes an unauthenticated OpenAPI 3.1.0 description (760 paths, 1,114 operations, 1,377 schemas)
  alongside a companion GraphQL schema (339 queries, 325 mutations, 4 subscriptions), covering turbines,
  blades, anomalies, robot sets, work orders, dispatch, projects, inspections and accounting. Authentication
  is Keycloak OIDC on sso.aerones.com (realm "aerones", client "operations-hub"). The contract is public;
  the data behind it is customer- and staff-gated, and Aerones publishes no developer program, SDKs, pricing
  or partner API documentation.
image: https://aerones.com/wp-content/uploads/2022/07/LPS_DJI_194_dng_43324928_0_2022516142538_photo_original.DNG-1-copy-e1658346007934.jpg
