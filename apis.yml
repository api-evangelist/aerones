apis:
- aid: aerones-operations-hub
  name: Aerones Operations Hub API
  description: 'The REST surface of the Aerones Operations Hub, described by a publicly
    served OpenAPI 3.1.0 document (760 paths / 1,114 operations / 1,377 component
    schemas) generated by Django Ninja. It covers the wind-service operating model
    end to end: customers, turbines and turbine models, blades and cross-sections,
    anomalies and AI anomaly detection, robot sets, resources and certificates, projects,
    commercial offers, dispatch boards and work orders, technician reporting, inspections
    (point clouds, rosbags, video), planning, and accounting integrations with NetSuite.
    The description is anonymous; every data operation requires a bearer token or the
    opshub session cookie.'
  humanURL: https://operations.aerones.com/api/docs
  image: https://aerones.com/wp-content/uploads/2022/07/LPS_DJI_194_dng_43324928_0_2022516142538_photo_original.DNG-1-copy-e1658346007934.jpg
