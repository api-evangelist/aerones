note: >-
  The Operations Hub OpenAPI declares no oauth2 securityScheme, so there is nothing to
  derive from the spec - derive-oauth-scopes.py reported zero oauth2 schemes. The scopes
  below are the scopes_supported list read verbatim off the Keycloak realm's OIDC
  discovery document, which is served anonymously. They are Keycloak's standard OIDC and
  built-in client scopes, not an Aerones-authored permission model: no per-resource scope
  (read:turbines and the like) is published anywhere. Field-level authorization on the
  GraphQL surface is expressed instead with a @hasPerm(permissions: [PermDefinition!]!)
  directive carried in the published SDL; the permission strings themselves are not
  enumerated in the schema.
