openapi: 3.2.0
info:
  title: Operations Hub Projects.service Orders API
  version: 0.1.1
  description: ''
servers: []
tags:
- name: projects.service-orders
paths:
  /api/projects/{project_id}/service-orders/generate:
    post:
      operationId: projects_api_service_orders_generate_service_orders
      summary: ⚠️ Generate service orders
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOrderGenerateResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: '⚠️ Internal OpsHub UI endpoint. Not intended for external consumption.


        Create ServiceOrderHeader, ServiceOrderLine, and Workorder records

        from the provided scope items.


        The generation logic:

        1. Groups ServiceOrderHeaders by (project_id, location_id) - reuses existing

        2. Creates one ServiceOrderLine per scope item (1:1 relationship)

        3. Creates Workorders based on ServiceItem and ProjectScopeItem configuration


        Scope items that already have a live (non-cancelled) SOL are refused unless

        ``confirm_duplicates`` is set; without it the response returns

        ``requires_confirmation`` plus the offending scope items so the UI can prompt.


        Each scope item can specify optional service items to include,

        which will generate optional workorders.'
      tags:
      - projects.service-orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceOrderGenerateRequest'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/service-order-lines/{line_id}/workorders/generate:
    post:
      operationId: projects_api_service_orders_generate_line_workorders
      summary: ⚠️ Generate line workorders
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: integer
        required: true
      - in: path
        name: line_id
        schema:
          title: Line Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateLineWorkordersResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: '⚠️ Internal OpsHub UI endpoint. Not intended for external consumption.


        Generate additional workorders for an existing ServiceOrderLine.


        This endpoint allows adding additional workorders to a line after initial generation.

        Duplicates are allowed - calling this endpoint multiple times with the same

        service_item_ids will create additional workorders.


        Component selection is derived from the line''s project_scope_item:

        - If scope_item.turbine_component_id is set: only that specific component

        - If scope_item.component_type_id is set: all components of that type

        - Otherwise: all components matching the service_item''s component type


        Args:

        project_id: The core.Project ID

        line_id: The ServiceOrderLine ID

        body: Request with service_item_ids to generate workorders for


        Returns:

        GenerateLineWorkordersResponse with list of created workorder IDs


        Errors:

        404: Line not found or doesn''t belong to project

        400: Validation error (wrong service, invalid component scope, etc.)'
      tags:
      - projects.service-orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateLineWorkordersRequest'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/service-orders/generation-data:
    get:
      operationId: projects_api_service_orders_get_service_order_generation_data
      summary: ⚠️ Get service order generation data
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: integer
        required: true
      - in: query
        name: page
        schema:
          default: 1
          title: Page
          type: integer
        required: false
      - in: query
        name: page_size
        schema:
          default: 50
          title: Page Size
          type: integer
        required: false
      - in: query
        name: location_id
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Location Id
        required: false
      - in: query
        name: service_id
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Service Id
        required: false
      - in: query
        name: search
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Search
        required: false
      - in: query
        name: generation_status
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Generation Status
        required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOrderGenerationDataResponse'
      description: '⚠️ Internal OpsHub UI endpoint. Not intended for external consumption.


        Get data for service order generation UI with pagination and filtering.


        The optional ``search`` parameter narrows the result list by an icontains

        match against either ``turbine.name`` or ``turbine_component.serial_number``

        (OR semantics). Whitespace-only values are treated as no search.


        ``generation_status`` filters scope items by whether they already have a live

        (non-cancelled) SOL: ``generated`` keeps only those that do, ``not_generated``

        only those that don''t. Omitted/other values apply no filter.'
      tags:
      - projects.service-orders
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/service-orders:
    get:
      operationId: projects_api_service_orders_list_service_orders
      summary: ⚠️ List service orders
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: integer
        required: true
      - in: query
        name: page
        schema:
          default: 1
          title: Page
          type: integer
        required: false
      - in: query
        name: page_size
        schema:
          default: 25
          title: Page Size
          type: integer
        required: false
      - in: query
        name: location
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Location
        required: false
      - in: query
        name: status
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
        required: false
      - in: query
        name: service_code
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Service Code
        required: false
      - in: query
        name: search
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Search
        required: false
      - in: query
        name: scope_change_request_id
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Scope Change Request Id
        required: false
      - in: query
        name: original_sol_id
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Original Sol Id
        required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ProjectServiceOrderListItem'
                title: Response
                type: array
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: '⚠️ Internal OpsHub UI endpoint. Not intended for external consumption.


        List service orders for a project with server-side pagination and filtering.'
      tags:
      - projects.service-orders
      security:
      - APIKeyAuth: []
      - CookieAuth: []
    delete:
      operationId: projects_api_service_orders_delete_all_service_orders
      summary: ⚠️ Delete all service orders
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOrderDeleteResponse'
      description: '⚠️ Internal OpsHub UI endpoint. Not intended for external consumption.


        Delete all service orders for a project.'
      tags:
      - projects.service-orders
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/service-orders/summary:
    get:
      operationId: projects_api_service_orders_get_service_order_summary
      summary: ⚠️ Get service order summary
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOrderSummaryResponse'
      description: '⚠️ Internal OpsHub UI endpoint. Not intended for external consumption.


        Get summary data for service orders page.'
      tags:
      - projects.service-orders
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/service-orders/lines/{line_id}:
    get:
      operationId: projects_api_service_orders_get_service_order_line
      summary: ⚠️ Get service order line detail
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: integer
        required: true
      - in: path
        name: line_id
        schema:
          title: Line Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOrderLineDetail'
      description: '⚠️ Internal OpsHub UI endpoint. Not intended for external consumption.


        Get service order line detail, with the customer custom fields and values

        the caller may see.'
      tags:
      - projects.service-orders
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/service-orders/lines/{line_id}/customer-custom-field-values:
    put:
      operationId: projects_api_service_orders_replace_service_order_line_customer_custom_field_values
      summary: ⚠️ Replace the customer custom field values on a service order line
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: integer
        required: true
      - in: path
        name: line_id
        schema:
          title: Line Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CustomerCustomValueResponse'
                title: Response
                type: array
      description: '⚠️ Internal OpsHub UI endpoint. Not intended for external consumption.


        Store the full set of custom field values on the line and return what is

        now stored. A refused value writes nothing.'
      tags:
      - projects.service-orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceOrderLineCustomerCustomFieldValuesReplace'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/service-orders/lines/{line_id}/warranty-work:
    post:
      operationId: projects_api_service_orders_create_warranty_work
      summary: ⚠️ Create warranty-work SOL from this line
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: integer
        required: true
      - in: path
        name: line_id
        schema:
          title: Line Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateWarrantyWorkResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: '⚠️ Internal OpsHub UI endpoint. Not intended for external consumption.


        Create a warranty-work SOL from this service order line. The warranty

        sibling project is get-or-created on demand. The SOL mirrors the original;

        the caller may pick the target service, opt in optional service items, and

        narrow workorders to a subset of turbine components (component_overrides).'
      tags:
      - projects.service-orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWarrantyWorkRequest'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/service-orders/lines/{line_id}/workorders:
    get:
      operationId: projects_api_service_orders_get_service_order_line_workorders
      summary: ⚠️ Get service order line workorders
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: integer
        required: true
      - in: path
        name: line_id
        schema:
          title: Line Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ServiceOrderLineWorkorder'
                title: Response
                type: array
      description: '⚠️ Internal OpsHub UI endpoint. Not intended for external consumption.


        Get workorders for a service order line.'
      tags:
      - projects.service-orders
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/service-orders/lines/{line_id}/workorders/{workorder_id}:
    get:
      operationId: projects_api_service_orders_get_workorder_detail
      summary: ⚠️ Get workorder detail
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: integer
        required: true
      - in: path
        name: line_id
        schema:
          title: Line Id
          type: integer
        required: true
      - in: path
        name: workorder_id
        schema:
          title: Workorder Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkorderDetail'
      description: '⚠️ Internal OpsHub UI endpoint. Not intended for external consumption.


        Get workorder detail.'
      tags:
      - projects.service-orders
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/service-orders/lines/{line_id}/workorders/{workorder_id}/activities:
    get:
      operationId: projects_api_service_orders_get_workorder_activities
      summary: ⚠️ Get workorder activities
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: integer
        required: true
      - in: path
        name: line_id
        schema:
          title: Line Id
          type: integer
        required: true
      - in: path
        name: workorder_id
        schema:
          title: Workorder Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/WorkorderActivityDetail'
                title: Response
                type: array
      description: '⚠️ Internal OpsHub UI endpoint. Not intended for external consumption.


        Get activities for a workorder.'
      tags:
      - projects.service-orders
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/service-orders/lines/{line_id}/workorders/{workorder_id}/available-activities:
    get:
      operationId: projects_api_service_orders_get_available_activities
      summary: ⚠️ Get available activities
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: integer
        required: true
      - in: path
        name: line_id
        schema:
          title: Line Id
          type: integer
        required: true
      - in: path
        name: workorder_id
        schema:
          title: Workorder Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AvailableActivity'
                title: Response
                type: array
      description: '⚠️ Internal OpsHub UI endpoint. Not intended for external consumption.


        Get available activities for a workorder.'
      tags:
      - projects.service-orders
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/service-orders/lines/{line_id}/unplanned-service-items:
    get:
      operationId: projects_api_service_orders_get_unplanned_service_items
      summary: ⚠️ Get unplanned service items
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: integer
        required: true
      - in: path
        name: line_id
        schema:
          title: Line Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/UnplannedServiceItem'
                title: Response
                type: array
      description: '⚠️ Internal OpsHub UI endpoint. Not intended for external consumption.


        Get unplanned service items for a service order line.'
      tags:
      - projects.service-orders
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/service-orders/workorders/{workorder_id}:
    delete:
      operationId: projects_api_service_orders_delete_unplanned_workorder
      summary: ⚠️ Delete unplanned workorder
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: integer
        required: true
      - in: path
        name: workorder_id
        schema:
          title: Workorder Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteWorkorderResponse'
      description: '⚠️ Internal OpsHub UI endpoint. Not intended for external consumption.


        Soft-delete an unplanned workorder that hasn''t been started (Workorder

        inherits SoftDeleteMixinDeletedAt, so this sets deleted_at rather than

        removing the row).


        NOTE: The admin UI no longer offers delete. Prefer the cancel endpoint

        (POST /dispatch/v1/workorders/{id}/cancel) — soft delete hides the row

        from default queries; cancel keeps it visible with a recorded reason and

        actor.'
      tags:
      - projects.service-orders
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/service-orders/workorders/{workorder_id}/status-changes:
    get:
      operationId: projects_api_service_orders_list_status_changes
      summary: List workorder status change log
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: integer
        required: true
      - in: path
        name: workorder_id
        schema:
          title: Workorder Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/StatusChangeLogEntry'
                title: Response
                type: array
      description: List all status change log entries for a workorder.
      tags:
      - projects.service-orders
      security:
      - APIKeyAuth: []
      - CookieAuth: []
    post:
      operationId: projects_api_service_orders_create_status_change
      summary: Create status change log entry
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: integer
        required: true
      - in: path
        name: workorder_id
        schema:
          title: Workorder Id
          type: integer
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusChangeLogEntry'
      description: Create a new status change log entry.
      tags:
      - projects.service-orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStatusChangeLogRequest'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/service-orders/workorders/{workorder_id}/status-changes/{entry_id}:
    delete:
      operationId: projects_api_service_orders_delete_status_change
      summary: Delete status change log entry
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: integer
        required: true
      - in: path
        name: workorder_id
        schema:
          title: Workorder Id
          type: integer
        required: true
      - in: path
        name: entry_id
        schema:
          title: Entry Id
          type: integer
        required: true
      responses:
        '204':
          description: No Content
      description: Delete a status change log entry.
      tags:
      - projects.service-orders
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/service-orders/lines/{line_id}/status-changes:
    get:
      operationId: projects_api_service_orders_list_sol_status_changes
      summary: List SOL status change logs
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: integer
        required: true
      - in: path
        name: line_id
        schema:
          title: Line Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SolStatusChangeLogGroup'
                title: Response
                type: array
      description: List all status change log entries for all workorders in a service order line.
      tags:
      - projects.service-orders
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/service-orders/lines/{line_id}/line-status-changes:
    get:
      operationId: projects_api_service_orders_list_line_status_changes
      summary: List a service order line's own status change log
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: integer
        required: true
      - in: path
        name: line_id
        schema:
          title: Line Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/StatusChangeLogEntry'
                title: Response
                type: array
      description: 'Read-only: the service order line''s OWN status transition log.


        Distinct from the workorder-grouped SOL view above — this returns the

        ServiceOrderLineStatusChangeLog rows for the line itself.'
      tags:
      - projects.service-orders
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/service-orders/lines/{line_id}/status-changes/bulk-create:
    post:
      operationId: projects_api_service_orders_bulk_create_sol_status_changes
      summary: Bulk-create status change log entries
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: integer
        required: true
      - in: path
        name: line_id
        schema:
          title: Line Id
          type: integer
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SolStatusChangeLogGroup'
                title: Response
                type: array
      description: Bulk-create status change log entries for multiple workorders in a SOL.
      tags:
      - projects.service-orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkCreateStatusChangeLogRequest'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/service-orders/lines/{line_id}/status-changes/bulk-delete:
    post:
      operationId: projects_api_service_orders_bulk_delete_sol_status_changes
      summary: Bulk-delete status change log entries
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: integer
        required: true
      - in: path
        name: line_id
        schema:
          title: Line Id
          type: integer
        required: true
      responses:
        '204':
          description: No Content
      description: Bulk soft-delete status change log entries for workorders in a SOL.
      tags:
      - projects.service-orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkDeleteStatusChangeLogRequest'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
components:
  schemas:
    ServiceOrderLineScopeChangeLinkedSol:
      additionalProperties: false
      description: The counterpart SOL on the other side of a scope change.
      properties:
        id:
          description: Linked ServiceOrderLine ID
          title: Id
          type: integer
        number:
          anyOf:
