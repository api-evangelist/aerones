            type: integer
          title: Service Order Ids
          type: array
        service_order_line_ids:
          default: []
          description: Created ServiceOrderLine IDs
          items:
            type: integer
          title: Service Order Line Ids
          type: array
        workorder_ids:
          default: []
          description: Created Workorder IDs
          items:
            type: integer
          title: Workorder Ids
          type: array
        results:
          default: []
          description: Per-scope-item results showing parent-child relationships
          items:
            $ref: '#/components/schemas/ScopeItemGenerationResult'
          title: Results
          type: array
        requires_confirmation:
          default: false
          description: True when generation was refused because some scope items already have a live SOL and confirm_duplicates was not set. Nothing was created; resend with confirm_duplicates=true to proceed.
          title: Requires Confirmation
          type: boolean
        duplicate_scope_items:
          default: []
          description: Requested scope items that already have a live SOL
          items:
            $ref: '#/components/schemas/DuplicateScopeItem'
          title: Duplicate Scope Items
          type: array
      title: ServiceOrderGenerateResponse
      type: object
    DeleteWorkorderResponse:
      additionalProperties: false
      description: Response from deleting an unplanned workorder.
      properties:
        success:
          description: Whether deletion succeeded
          title: Success
          type: boolean
        error:
          anyOf:
          - type: string
          - type: 'null'
          description: Error message if failed
          title: Error
      required:
      - success
      title: DeleteWorkorderResponse
      type: object
    UnplannedServiceItem:
      additionalProperties: false
      description: Unplanned service item that doesn't have a workorder yet.
      properties:
        id:
          description: ServiceItem ID
          title: Id
          type: integer
        name:
          description: Service item code/name
          title: Name
          type: string
        type:
          anyOf:
          - type: string
          - type: 'null'
          description: WO type that this service item generates
          title: Type
        activities_total:
          description: Number of activities the template will generate
          title: Activities Total
          type: integer
        is_optional:
          description: Whether item is optional
          title: Is Optional
          type: boolean
        component_id:
          anyOf:
          - type: integer
          - type: 'null'
          description: ComponentType ID this service item is scoped to (null for turbine-level items). Used by the UI to decide whether to show a per-component picker before generation.
          title: Component Id
        component_name:
          anyOf:
          - type: string
          - type: 'null'
          description: Display name of the component type, when set
          title: Component Name
      required:
      - id
      - name
      - activities_total
      - is_optional
      title: UnplannedServiceItem
      type: object
    ScopeItemGenerationResult:
      additionalProperties: false
      description: Result for a single scope item in service order generation.
      properties:
        scope_item_id:
          description: The ProjectScopeItem ID from the request
          title: Scope Item Id
          type: integer
        service_order_id:
          description: The ServiceOrderHeader ID (new or reused)
          title: Service Order Id
          type: integer
        service_order_line_id:
          description: The created ServiceOrderLine ID
          title: Service Order Line Id
          type: integer
        workorder_ids:
          default: []
          description: Created Workorder IDs for this scope item
          items:
            type: integer
          title: Workorder Ids
          type: array
      required:
      - scope_item_id
      - service_order_id
      - service_order_line_id
      title: ScopeItemGenerationResult
      type: object
    CustomerCustomFieldOption:
      additionalProperties: false
