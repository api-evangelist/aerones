openapi: 3.2.0
info:
  title: Operations Hub Core.services.pricing Units API
  version: 0.1.1
  description: ''
servers: []
tags:
- name: core.services.pricing-units
paths:
  /api/core/v1/services/{service_id}/pricing-units:
    get:
      operationId: list_service_pricing_units
      summary: List Pricing Units for Service
      parameters:
      - in: path
        name: service_id
        schema:
          title: Service Id
          type: integer
        required: true
      - in: query
        name: search
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Search by name (case-insensitive)
          title: Search
        required: false
        description: Search by name (case-insensitive)
      - in: query
        name: sort
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Sort by field (prefix with - for descending)
          title: Sort
        required: false
        description: Sort by field (prefix with - for descending)
      - in: query
        name: paginate
        schema:
          default: true
          description: Enable pagination (false returns all results)
          title: Paginate
          type: boolean
        required: false
        description: Enable pagination (false returns all results)
      - in: query
        name: page
        schema:
          default: 1
          description: Page number
          minimum: 1
          title: Page
          type: integer
        required: false
        description: Page number
      - in: query
        name: page_size
        schema:
          default: 50
          description: Number of items per page
          maximum: 1000
          minimum: 1
          title: Page Size
          type: integer
        required: false
        description: Number of items per page
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ServicePricingUnitResponse'
                title: Response
                type: array
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: List all child items for a parent with pagination, search, and sorting.
      tags:
      - core.services.pricing-units
      security:
      - APIKeyAuth: []
      - CookieAuth: []
components:
  schemas:
    ErrorCode:
      description: Error codes for API errors.
      enum:
      - validation
      - server
      - auth
      - unknown
      - external
      - generic
      title: ErrorCode
      type: string
    ServicePricingUnitResponse:
      additionalProperties: false
      description: Schema for ServicePricingUnit response.
      properties:
        updated_at:
          description: Last update timestamp
          format: date-time
          title: Updated At
          type: string
        id:
          description: ServicePricingUnit ID
          title: Id
          type: integer
        is_default:
          description: Whether this is the default pricing unit
          title: Is Default
          type: boolean
        service:
          $ref: '#/components/schemas/ServiceObject'
          description: Service information
        pricing_unit:
          $ref: '#/components/schemas/PricingUnitNestedResponse'
          description: Pricing unit information
      required:
      - updated_at
      - id
      - is_default
      - service
      - pricing_unit
      title: ServicePricingUnitResponse
      type: object
    ServiceObject:
      additionalProperties: false
      description: Nested service object for responses (no timestamps).
      properties:
        id:
          title: Id
          type: integer
        code:
          title: Code
          type: string
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        is_service:
          description: Whether this is a service (vs addon/material/support)
          title: Is Service
          type: boolean
      required:
      - id
      - code
      - is_service
      title: ServiceObject
      type: object
    Error:
      additionalProperties: false
      description: Error response schema.
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          title: Message
          type: string
      required:
      - code
      - message
      title: Error
      type: object
    PricingUnitNestedResponse:
      additionalProperties: false
      description: Nested response for pricing unit in service response (no timestamps in nested objects).
      properties:
        id:
          title: Id
          type: integer
        name:
          title: Name
          type: string
        netsuite_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Netsuite Id
      required:
      - id
      - name
      title: PricingUnitNestedResponse
      type: object
  securitySchemes:
    APIKeyAuth:
      type: http
      scheme: bearer
    CookieAuth:
      type: apiKey
      in: cookie
      name: opshub_prod_sessionid
    AuthBearer:
      type: http
      scheme: bearer
