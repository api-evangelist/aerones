        service_activity_description:
          anyOf:
          - type: string
          - type: 'null'
          description: Service activity description (300 char limit)
          title: Service Activity Description
        service_activity_id:
          anyOf:
          - type: integer
          - type: 'null'
          description: 'Idempotency ID for auto-synced idle charges (auto-created charges only): a Platform service activity ID or a core.Delay ID, depending on source'
          title: Service Activity Id
        delay_ids:
          description: Delay IDs to link to this charge (local only, not sent to NS)
          items:
            type: integer
          title: Delay Ids
          type: array
        corrects_charge_id:
          anyOf:
          - type: integer
          - type: 'null'
