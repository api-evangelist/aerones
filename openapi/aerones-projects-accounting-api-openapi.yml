openapi: 3.2.0
info:
  title: Operations Hub Projects.accounting API
  version: 0.1.1
  description: ''
servers: []
tags:
- name: projects.accounting
paths:
  /api/projects/{project_id}/sales-orders:
    get:
      operationId: accounting_api_get_sales_orders
      summary: Get Sales Orders
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SalesOrder'
                title: Response
                type: array
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Retrieve all sales orders for a given project.
      tags:
      - projects.accounting
      security:
      - APIKeyAuth: []
      - CookieAuth: []
    post:
      operationId: accounting_api_create_sales_order
      summary: Create Sales Order
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrder'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Create sales order for given project
      tags:
      - projects.accounting
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/sales-orders/legacy:
    post:
      operationId: accounting_api_create_sales_order_old
      summary: Create Sales Order Old
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrder'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Legacy sales order create endpoint (kept for testing).
      tags:
      - projects.accounting
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesOrderPOST'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/sales-orders/create-background:
    post:
      operationId: accounting_api_create_sales_order_in_background
      summary: Create Sales Order In Background
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageWithSuccess'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Create sales order in background for given project.
      tags:
      - projects.accounting
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/sales-orders/status:
    get:
      operationId: accounting_api_get_sales_order_status
      summary: Get Sales Order Status
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CombinedSalesOrderStatus'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'Get combined sales order creation and sync status for a project.


        Returns creation status and sync status (if sales order exists).'
      tags:
      - projects.accounting
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/sales-orders/{sales_order_id}:
    delete:
      operationId: accounting_api_delete_sales_order
      summary: Delete Sales Order
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: sales_order_id
        schema:
          title: Sales Order Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Delete sales order for given project
      tags:
      - projects.accounting
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/sales-orders/{sales_order_id}/line-items:
    get:
      operationId: accounting_api_get_sales_order_line_items
      summary: Get Sales Order Line Items
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: sales_order_id
        schema:
          title: Sales Order Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SalesOrderLineItem'
                title: Response
                type: array
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Retrieve all line items for a specific sales order.
      tags:
      - projects.accounting
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/sales-orders/{sales_order_id}/line-items/summary:
    get:
      operationId: accounting_api_get_sales_order_line_items_summary
      summary: Get Sales Order Line Items Summary
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: sales_order_id
        schema:
          title: Sales Order Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ServiceRate'
                title: Response
                type: array
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Retrieve summary of all line items for a specific sales order.
      tags:
      - projects.accounting
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/sales-orders/{sales_order_id}/line-items/tree:
    get:
      operationId: accounting_api_get_sales_order_line_items_tree
      summary: Get Sales Order Line Items Tree
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: sales_order_id
        schema:
          title: Sales Order Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SalesOrderLineItemTLNode'
                title: Response
                type: array
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Retrieve all line items in tree structure, i.e. blades as child nodes of turbines.
      tags:
      - projects.accounting
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/sales-orders/{sales_order_id}/charges:
    get:
      operationId: accounting_api_get_charges
      summary: Get Charges
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: sales_order_id
        schema:
          title: Sales Order Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Charge'
                title: Response
                type: array
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Return list of charges by sales order.
      tags:
      - projects.accounting
      security:
      - APIKeyAuth: []
      - CookieAuth: []
    patch:
      operationId: accounting_api_update_charges_bulk
      summary: Update Charges Bulk
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: sales_order_id
        schema:
          title: Sales Order Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Charge'
                title: Response
                type: array
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'Update multiple charges in bulk.


        Only charges with status DRAFT can be updated.'
      tags:
      - projects.accounting
      requestBody:
        content:
          application/json:
            schema:
              items:
                $ref: '#/components/schemas/ChargeBulkPATCHItem'
              title: Body
              type: array
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
    delete:
      operationId: accounting_api_delete_charges_bulk
      summary: Delete Charges Bulk
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: sales_order_id
        schema:
          title: Sales Order Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'Delete multiple charges in bulk.


        Only charges with status DRAFT can be deleted.'
      tags:
      - projects.accounting
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChargeBulkDELETE'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/email-sends:
    get:
      operationId: accounting_api_get_email_sends
      summary: Get Email Sends
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/EmailSendLogResponse'
                title: Response
                type: array
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Return a project's sent-email history, most recent first.
      tags:
      - projects.accounting
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/sales-orders/{sales_order_id}/charges/summary:
    get:
      operationId: accounting_api_get_charges_summary
      summary: Get Charges Summary
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: sales_order_id
        schema:
          title: Sales Order Id
          type: integer
        required: true
      - in: query
        name: date_from
        schema:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          title: Date From
        required: false
      - in: query
        name: date_to
        schema:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          title: Date To
        required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargeSummary'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Return pre-aggregated charge totals from local DB, optionally filtered by date range.
      tags:
      - projects.accounting
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/sales-orders/{sales_order_id}/line-items/{line_item_id}/charges:
    post:
      operationId: accounting_api_create_charge
      summary: Create Charge
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: sales_order_id
        schema:
          title: Sales Order Id
          type: integer
        required: true
      - in: path
        name: line_item_id
        schema:
          title: Line Item Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Charge'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Create a charge.
      tags:
      - projects.accounting
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChargePOST'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/sales-orders/{sales_order_id}/line-items/{line_item_id}/charges/{charge_id}:
    patch:
      operationId: accounting_api_update_charge
      summary: Update Charge
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: sales_order_id
        schema:
          title: Sales Order Id
          type: integer
        required: true
      - in: path
        name: line_item_id
        schema:
          title: Line Item Id
          type: integer
        required: true
      - in: path
        name: charge_id
        schema:
          title: Charge Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Charge'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Update a charge.
      tags:
      - projects.accounting
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChargePATCH'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
    delete:
      operationId: accounting_api_delete_charge
      summary: Delete Charge
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: sales_order_id
        schema:
          title: Sales Order Id
          type: integer
        required: true
      - in: path
        name: line_item_id
        schema:
          title: Line Item Id
          type: integer
        required: true
      - in: path
        name: charge_id
        schema:
          title: Charge Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Delete a charge.
      tags:
      - projects.accounting
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/sales-orders/{sales_order_id}/charges/bulk-approve:
    post:
      operationId: accounting_api_bulk_approve_charges
      summary: Bulk Approve Charges
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: sales_order_id
        schema:
          title: Sales Order Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargeBulkApproveResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - projects.accounting
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChargeBulkApprove'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/sales-orders/{sales_order_id}/invoices:
    get:
      operationId: accounting_api_get_invoices
      summary: Get Invoices
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: sales_order_id
        schema:
          title: Sales Order Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AccountingInvoice'
                title: Response
                type: array
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Get all invoices for a sales order.
      tags:
      - projects.accounting
      security:
      - APIKeyAuth: []
      - CookieAuth: []
    post:
      operationId: accounting_api_create_invoice
      summary: Create Invoice
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: sales_order_id
        schema:
          title: Sales Order Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateInvoiceResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Create invoice for given sales order.
      tags:
      - projects.accounting
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSalesOrderInvoicePOST'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/sales-orders/{sales_order_id}/invoices/create-background:
    post:
      operationId: accounting_api_create_invoice_in_background
      summary: Create Invoice In Background
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: sales_order_id
        schema:
          title: Sales Order Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageWithSuccess'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Create invoice in background for given sales order.
      tags:
      - projects.accounting
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSalesOrderInvoicePOST'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/sales-orders/{sales_order_id}/diff-asset-names:
    get:
      operationId: accounting_api_get_sales_order_diff_asset_names
      summary: Get Sales Order Diff Asset Names
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: sales_order_id
        schema:
          title: Sales Order Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                additionalProperties:
                  $ref: '#/components/schemas/PatchStrValue'
                title: Response
                type: object
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Get Sales Order diff asset names.
      tags:
      - projects.accounting
      security:
      - APIKeyAuth: []
      - CookieAuth: []
    post:
      operationId: accounting_api_create_sales_order_diff_asset_names_patch
      summary: Create Sales Order Diff Asset Names Patch
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: sales_order_id
        schema:
          title: Sales Order Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetPatchGET'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Create Sales Order diff asset names patch.
      tags:
      - projects.accounting
      security:
      - APIKeyAuth: []
      - CookieAuth: []
    patch:
      operationId: accounting_api_apply_sales_order_diff_asset_names_patch
      summary: Apply Sales Order Diff Asset Names Patch
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: sales_order_id
        schema:
          title: Sales Order Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Apply Sales Order diff asset names patch.
      tags:
      - projects.accounting
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetPatchPATCH'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/sales-orders/{sales_order_id}/idle-hour-time-windows:
    get:
      operationId: accounting_api_get_idle_hour_time_windows
      summary: Get Idle Hour Time Windows
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: sales_order_id
        schema:
          title: Sales Order Id
          type: integer
        required: true
      - in: query
        name: charge_date
        schema:
          format: date
          title: Charge Date
          type: string
        required: true
      - in: query
        name: robot_set_id
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Robot Set Id
        required: false
      - in: query
        name: robot_set_name
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Robot Set Name
        required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdleHourTimeWindowsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Build idle-hour delay windows for a charge date and robot set.
      tags:
      - projects.accounting
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/sales-orders/{sales_order_id}/sync-offer:
    post:
      operationId: accounting_api_sync_offer_line_items
      summary: Sync Offer Line Items
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: sales_order_id
        schema:
          title: Sales Order Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageWithSuccess'
        '400':
          description: Bad Request
          content:
            application/json:
