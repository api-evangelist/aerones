components:
  schemas:
    TeamWorkloadSuggestedCharge:
      additionalProperties: false
      description: Schema for suggested charge candidate with prefill details.
      properties:
        label:
          description: Suggested charge label displayed in UI
          title: Label
          type: string
        service_id:
          anyOf:
          - type: integer
          - type: 'null'
          description: NetSuite ID for service
          title: Service Id
        service_name:
          anyOf:
          - type: string
          - type: 'null'
          description: Service name
          title: Service Name
        service_unit_type_id:
          anyOf:
          - type: integer
          - type: 'null'
          description: NetSuite ID for service unit type
          title: Service Unit Type Id
        service_unit_type_name:
          anyOf:
          - type: string
          - type: 'null'
          description: Service unit type name
          title: Service Unit Type Name
        rate:
          anyOf:
          - type: number
          - type: 'null'
          description: Suggested service rate
          title: Rate
        quantity:
          anyOf:
          - type: number
          - type: 'null'
          description: Suggested quantity — direct work hours for -RAT services, otherwise unset (frontend falls back to 1)
          title: Quantity
        primary_asset_id:
          anyOf:
          - type: integer
          - type: 'null'
          description: Preferred asset ID for charge prefill
          title: Primary Asset Id
        assets:
          description: Asset options related to the suggested service
          items:
            $ref: '#/components/schemas/TeamWorkloadSuggestedChargeAsset'
          title: Assets
          type: array
      required:
      - label
      title: TeamWorkloadSuggestedCharge
      type: object
    ErrorCode:
      description: Error codes for API errors.
      enum:
      - validation
      - server
      - auth
      - unknown
      - external
      - generic
      title: ErrorCode
      type: string
    SuggestionDecisionSchema:
      additionalProperties: false
      description: Schema for suggestion decision response.
      properties:
        id:
          title: Id
          type: integer
        project_id:
          format: uuid
          title: Project Id
          type: string
        date:
          format: date
          title: Date
          type: string
        set_name:
          title: Set Name
          type: string
        label:
          title: Label
          type: string
        asset_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Asset Id
        decision:
          title: Decision
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        created_by_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Created By Name
      required:
      - id
      - project_id
      - date
      - set_name
      - label
      - decision
      - created_at
      title: SuggestionDecisionSchema
      type: object
    TeamWorkloadSetStatus:
      additionalProperties: false
      description: Schema for set workload status details.
      properties:
        set_name:
          title: Set Name
          type: string
        robot_set_id:
          anyOf:
          - type: integer
          - type: 'null'
          description: OpsHub core.RobotSet id, for routes keyed by the local id.
          title: Robot Set Id
        ns_robot_set_id:
          anyOf:
          - type: integer
          - type: 'null'
          description: NetSuite id of the robot set. Lets the client join charges to this set by id instead of reconciling the two systems' set names.
          title: Ns Robot Set Id
        workorder_service_codes:
          description: Service codes from workorders for the day
          items:
            type: string
          title: Workorder Service Codes
          type: array
        direct_minutes:
          description: Direct work minutes for the set
          title: Direct Minutes
          type: number
        total_delay_minutes:
          description: Total delay minutes for the set
          title: Total Delay Minutes
          type: number
