      additionalProperties: false
      description: 'One service rate row per service for the OPS_HUB sidebar.


        A service can be priced by several CO lines (one per asset). Those lines are

        collapsed into a single row: ``co_item_ids`` holds every contributing CO line

        and ``rate`` is only set when they all agree on one price — otherwise it is

        ``None`` and the real rate is picked per asset in the charge-creation modal.'
      properties:
        service_id:
          title: Service Id
          type: integer
        service_code:
          title: Service Code
          type: string
        service_name:
          title: Service Name
          type: string
        service_netsuite_id:
          anyOf:
          - type: integer
          - type: 'null'
          description: NetSuite item id of the service — lets the frontend address the NS line item when it falls back to the legacy charge flow for services without scope items (EXTRA, MOB, ACC, ...)
          title: Service Netsuite Id
        rate:
          anyOf:
          - type: number
          - type: 'null'
          description: Unit rate when every CO line for this service shares one price; None when they differ — the rate then comes from the asset's own CO line, chosen in the charge-creation modal
          title: Rate
        has_scope_items:
          default: false
          title: Has Scope Items
          type: boolean
        has_linked_scope_items:
          default: false
          title: Has Linked Scope Items
          type: boolean
        co_item_ids:
          description: Every CO line item ID priced under this service — the modal resolves assets across all of them
          items:
            type: integer
          title: Co Item Ids
          type: array
      required:
      - service_id
      - service_code
      - service_name
      - co_item_ids
      title: ServiceRateItem
      type: object
