          - items: {}
            type: array
          - type: 'null'
          title: Required Qualifications
        status:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
        stage:
          anyOf:
          - type: string
          - type: 'null'
          title: Stage
        original_sol_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Original Sol Id
        billable:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Billable
      title: ServiceOrderLineInput
      type: object
    ServiceItemActivityAttachment:
      additionalProperties: false
      description: 'File (image or video) attached to a service-item-activity instruction.


        Mirrors the GraphQL `ServiceItemActivityAttachment` type. `url` is

        an authenticated proxy URL through `/api/files/{id}/download` — the

        underlying GCS bucket stays private and the URL itself does not

        expire.'
      properties:
        id:
          title: Id
          type: integer
        caption:
          anyOf:
          - type: string
          - type: 'null'
          title: Caption
        sort_order:
          anyOf:
          - type: integer
          - type: 'null'
          title: Sort Order
        file_name:
          title: File Name
          type: string
        file_type:
          title: File Type
          type: string
        url:
          anyOf:
          - type: string
          - type: 'null'
          title: Url
      required:
      - id
      - file_name
      - file_type
      title: ServiceItemActivityAttachment
      type: object
