    UserResponse:
      additionalProperties: false
      description: Schema for user list response.
      properties:
        updated_at:
          description: Last update timestamp
          format: date-time
          title: Updated At
          type: string
        id:
          description: User ID
          title: Id
          type: integer
        first_name:
          anyOf:
          - type: string
          - type: 'null'
          description: User first name
          title: First Name
        last_name:
          anyOf:
          - type: string
          - type: 'null'
          description: User last name
          title: Last Name
        email:
          anyOf:
          - type: string
          - type: 'null'
          description: User email
          title: Email
        phone:
          anyOf:
          - type: string
          - type: 'null'
          description: User phone number
          title: Phone
        roles:
          description: Role names
          items:
            type: string
          title: Roles
          type: array
        customers:
          description: Assigned customers
          items:
            $ref: '#/components/schemas/UserCustomerObject'
          title: Customers
          type: array
      required:
      - updated_at
      - id
      title: UserResponse
      type: object
    ErrorCode:
      description: Error codes for API errors.
      enum:
      - validation
      - server
      - auth
      - unknown
      - external
      - generic
      title: ErrorCode
      type: string
    Error:
      additionalProperties: false
      description: Error response schema.
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          title: Message
          type: string
      required:
      - code
      - message
      title: Error
      type: object
