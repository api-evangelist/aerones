    AnomalySchema:
      additionalProperties: false
      properties:
        id:
          title: Id
          type: integer
        blade_id:
          title: Blade Id
          type: integer
        severity:
          enum:
          - 0
          - 1
          - 2
          - 3
          - 4
          - 5
          title: Severity
          type: integer
        width:
          anyOf:
          - type: integer
          - type: 'null'
          description: Anomaly width in millimetres, rounded half up to a whole millimetre.
          title: Width
        max_distance:
          anyOf:
          - type: integer
          - type: 'null'
          description: Anomaly length in millimetres (labelled Length in Ops Hub), rounded half up to a whole millimetre.
          title: Max Distance
        placement:
          enum:
          - INTERNAL
          - EXTERNAL
          title: Placement
          type: string
        side:
          anyOf:
          - type: string
          - type: 'null'
          title: Side
        rib:
          anyOf:
          - type: string
          - type: 'null'
          title: Rib
        distance_to_root:
          description: Root-based distance, except that it carries the hub-centre distance (root + the turbine model's center_to_root_offset) when that offset is configured (OH-4169). Prefer `distance_to_hub` for a value that is unambiguously hub-based.
          title: Distance To Root
          type: number
        distance_to_hub:
          anyOf:
          - type: number
          - type: 'null'
          description: 'Distance from the rotor/hub centre in metres, rounded to millimetres: distance_to_root + (the turbine model''s rotor_radius - the blade model''s length) + the blade model''s blade_root. Omitted when any of those is unconfigured; never a root-based number.'
          title: Distance To Hub
        files:
          anyOf:
          - items:
              $ref: '#/components/schemas/AnomalyFileSchema'
            type: array
          - type: 'null'
          description: List of files associated with the anomaly
          title: Files
        coordinates:
          anyOf:
          - items:
              items:
                type: integer
              type: array
            type: array
          - type: 'null'
          description: 'List of coordinates representing the anomaly''s location on the blade. Format: [[x1, y1], [x2, y2], ...]'
          title: Coordinates
        anomaly_major_component_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Anomaly Major Component Id
        anomaly_major_component_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Anomaly Major Component Name
        anomaly_component_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Anomaly Component Id
        anomaly_component_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Anomaly Component Name
        anomaly_sub_component_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Anomaly Sub Component Id
        anomaly_sub_component_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Anomaly Sub Component Name
        anomaly_type_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Anomaly Type Id
        anomaly_type_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Anomaly Type Name
        anomaly_sub_type_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Anomaly Sub Type Id
        anomaly_sub_type_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Anomaly Sub Type Name
        anomaly_material_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Anomaly Material Id
        anomaly_material_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Anomaly Material Name
        root_cause_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Root Cause Id
        root_cause_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Root Cause Name
        cim_case_number:
          title: Cim Case Number
          type: integer
        registered_by:
          $ref: '#/components/schemas/AnomalyRegisteredByType'
          description: 'Who registered the anomaly: AERONES (operator), AI or CUSTOMER'
        ai_status:
          anyOf:
          - $ref: '#/components/schemas/AnomalyAIStatus'
          - type: 'null'
          description: Reviewer state of the linked AI detection; null when the anomaly has no AI record
      required:
      - id
      - blade_id
      - severity
      - width
      - max_distance
      - placement
      - side
      - rib
      - distance_to_root
      - anomaly_major_component_id
      - anomaly_major_component_name
      - anomaly_component_id
      - anomaly_component_name
      - anomaly_sub_component_id
      - anomaly_sub_component_name
      - anomaly_type_id
      - anomaly_type_name
      - anomaly_sub_type_id
      - anomaly_sub_type_name
      - anomaly_material_id
      - anomaly_material_name
      - root_cause_id
      - root_cause_name
      - cim_case_number
      - registered_by
      title: AnomalySchema
      type: object
