        status:
          title: Status
          type: string
        from_date:
          title: From Date
          type: string
        to_date:
          title: To Date
          type: string
        accept_report:
          anyOf:
          - $ref: '#/components/schemas/VehicleFleetAssignmentReportResponse'
          - type: 'null'
        return_report:
          anyOf:
          - $ref: '#/components/schemas/VehicleFleetAssignmentReportResponse'
          - type: 'null'
        notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Notes
        current_odometer_at_accept:
          anyOf:
          - type: integer
          - type: 'null'
          title: Current Odometer At Accept
        current_odometer_at_return:
          anyOf:
          - type: integer
          - type: 'null'
          title: Current Odometer At Return
        accepted_at:
