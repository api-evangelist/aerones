          type: integer
        is_archived:
          default: false
          title: Is Archived
          type: boolean
        updated_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Updated At
        navirec:
          anyOf:
          - $ref: '#/components/schemas/NavirecLiveState'
          - type: 'null'
      required:
      - id
      - license_plate
      - make
      - model
      - type
      - location_id
      - vehicle_source
      - telematics_provider
      title: VehicleResponse
      type: object
    NavirecLiveState:
      additionalProperties: false
      description: Live tracking snapshot for a vehicle, joined from Navirec by plate.
      properties:
        status:
          description: 'Derived status: ACTIVE (ignition on), PARKED (ignition off but reported ≤10min ago), OFFLINE (no recent report).'
          title: Status
          type: string
        is_active:
          description: Convenience flag — true when status is ACTIVE or PARKED.
          title: Is Active
          type: boolean
        ignition:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Ignition
        speed_kmh:
          anyOf:
          - type: integer
          - type: 'null'
          title: Speed Kmh
        last_seen:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Last Seen
        latitude:
          anyOf:
          - type: number
          - type: 'null'
          title: Latitude
        longitude:
          anyOf:
          - type: number
          - type: 'null'
          title: Longitude
        vehicle_uuid:
          anyOf:
          - type: string
          - type: 'null'
          title: Vehicle Uuid
      required:
      - status
      - is_active
      title: NavirecLiveState
      type: object
