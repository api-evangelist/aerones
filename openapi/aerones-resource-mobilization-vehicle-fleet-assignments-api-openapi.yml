openapi: 3.2.0
info:
  title: Operations Hub Resource Mobilization.vehicle Fleet…
  version: 0.1.1
  description: ''
servers: []
tags:
- name: resource-mobilization.vehicle-fleet-assignments
paths:
  /api/resource-mobilization/v1/vehicle-fleet-assignments/discrepancies:
    get:
      operationId: resource_mobilization_endpoints_vehicle_fleet_assignments_list_discrepancies
      summary: List Discrepancies
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleFleetAssignmentDiscrepancies'
      tags:
      - resource-mobilization.vehicle-fleet-assignments
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/resource-mobilization/v1/vehicle-fleet-assignments:
    get:
      operationId: resource_mobilization_endpoints_vehicle_fleet_assignments_list_assignments
      summary: List Assignments
      parameters:
      - in: query
        name: search
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Search by vehicle license plate or assignee name
          title: Search
        required: false
        description: Search by vehicle license plate or assignee name
      - in: query
        name: sort
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Sort by field (prefix with - for descending)
          title: Sort
        required: false
        description: Sort by field (prefix with - for descending)
      - in: query
        name: status
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by status
          title: Status
        required: false
        description: Filter by status
      - in: query
        name: vehicle_id
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Filter by vehicle ID
          title: Vehicle Id
        required: false
        description: Filter by vehicle ID
      - in: query
        name: assignee_user_id
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Filter by assignee user ID
          title: Assignee User Id
        required: false
        description: Filter by assignee user ID
      - in: query
        name: project_id
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Filter by project ID
          title: Project Id
        required: false
        description: Filter by project ID
      - in: query
        name: paginate
        schema:
          default: true
          description: Enable pagination (false returns all results)
          title: Paginate
          type: boolean
        required: false
        description: Enable pagination (false returns all results)
      - in: query
        name: page
        schema:
          default: 1
          description: Page number
          minimum: 1
          title: Page
          type: integer
        required: false
        description: Page number
      - in: query
        name: page_size
        schema:
          default: 50
          description: Number of items per page
          maximum: 1000
          minimum: 1
          title: Page Size
          type: integer
        required: false
        description: Number of items per page
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/VehicleFleetAssignmentResponse'
                title: Response
                type: array
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - resource-mobilization.vehicle-fleet-assignments
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/resource-mobilization/v1/vehicle-fleet-assignments/plan:
    post:
      operationId: resource_mobilization_endpoints_vehicle_fleet_assignments_plan_assignment
      summary: Plan Assignment
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleFleetAssignmentResponse'
      tags:
      - resource-mobilization.vehicle-fleet-assignments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleFleetPlanSchema'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/resource-mobilization/v1/vehicle-fleet-assignments/accept:
    post:
      operationId: resource_mobilization_endpoints_vehicle_fleet_assignments_accept_vehicle
      summary: Accept Vehicle
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleFleetAssignmentResponse'
      tags:
      - resource-mobilization.vehicle-fleet-assignments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleFleetAcceptSchema'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/resource-mobilization/v1/vehicle-fleet-assignments/user-projects:
    get:
      operationId: resource_mobilization_endpoints_vehicle_fleet_assignments_get_user_projects
      summary: Get User Projects
      parameters:
      - in: query
        name: user_id
        schema:
          title: User Id
          type: integer
        required: true
      - in: query
        name: from_date
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: From Date
        required: true
      - in: query
        name: to_date
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: To Date
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/UserProjectOverlap'
                title: Response
                type: array
      tags:
      - resource-mobilization.vehicle-fleet-assignments
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/resource-mobilization/v1/vehicle-fleet-assignments/planner-status:
    post:
      operationId: resource_mobilization_endpoints_vehicle_fleet_assignments_planner_status
      summary: Planner Status
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlannerStatusResponse'
      description: 'Per-request planner status for the fleet queue (batch).


        Lets the requests list flag which fleet requests match the technician''s

        planner roster without a round-trip per row.'
      tags:
      - resource-mobilization.vehicle-fleet-assignments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlannerStatusRequest'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/resource-mobilization/v1/vehicle-fleet-assignments/{id}:
    get:
      operationId: resource_mobilization_endpoints_vehicle_fleet_assignments_get_assignment
      summary: Get Assignment
      parameters:
      - in: path
        name: id
        schema:
          title: Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleFleetAssignmentResponse'
      tags:
      - resource-mobilization.vehicle-fleet-assignments
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/resource-mobilization/v1/vehicle-fleet-assignments/{id}/accept:
    post:
      operationId: resource_mobilization_endpoints_vehicle_fleet_assignments_accept_planned_assignment
      summary: Accept Planned Assignment
      parameters:
      - in: path
        name: id
        schema:
          title: Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleFleetAssignmentResponse'
      tags:
      - resource-mobilization.vehicle-fleet-assignments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleFleetAcceptPlannedSchema'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/resource-mobilization/v1/vehicle-fleet-assignments/{id}/update:
    post:
      operationId: resource_mobilization_endpoints_vehicle_fleet_assignments_update_assignment
      summary: Update Assignment
      parameters:
      - in: path
        name: id
        schema:
          title: Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleFleetAssignmentResponse'
      tags:
      - resource-mobilization.vehicle-fleet-assignments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleFleetUpdateSchema'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/resource-mobilization/v1/vehicle-fleet-assignments/{id}/return:
    post:
      operationId: resource_mobilization_endpoints_vehicle_fleet_assignments_return_vehicle
      summary: Return Vehicle
      parameters:
      - in: path
        name: id
        schema:
          title: Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleFleetAssignmentResponse'
      tags:
      - resource-mobilization.vehicle-fleet-assignments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleFleetReturnSchema'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/resource-mobilization/v1/vehicle-fleet-assignments/{id}/cancel:
    post:
      operationId: resource_mobilization_endpoints_vehicle_fleet_assignments_cancel_assignment
      summary: Cancel Assignment
      parameters:
      - in: path
        name: id
        schema:
          title: Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleFleetAssignmentResponse'
      tags:
      - resource-mobilization.vehicle-fleet-assignments
      security:
      - APIKeyAuth: []
      - CookieAuth: []
components:
