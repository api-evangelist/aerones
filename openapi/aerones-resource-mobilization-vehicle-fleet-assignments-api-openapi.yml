        project_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Project Code
        from_date:
          anyOf:
          - type: string
          - type: 'null'
          title: From Date
        to_date:
          anyOf:
          - type: string
          - type: 'null'
          title: To Date
      required:
      - key
      title: PlannerStatusItemInput
      type: object
    ErrorCode:
      description: Error codes for API errors.
      enum:
      - validation
      - server
      - auth
      - unknown
      - external
      - generic
      title: ErrorCode
      type: string
    VehicleFleetAssignmentResponse:
