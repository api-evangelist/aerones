          - type: string
          - type: 'null'
          title: From Date
        to_date:
          anyOf:
          - type: string
          - type: 'null'
          title: To Date
        odometer:
          maximum: 2147483647
          minimum: 0
          title: Odometer
          type: integer
        possession:
          title: Possession
          type: object
        safety:
          title: Safety
          type: object
        photos:
          default: []
          items: {}
          title: Photos
          type: array
        reported_date:
          anyOf:
          - type: string
          - type: 'null'
          title: Reported Date
        notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Notes
