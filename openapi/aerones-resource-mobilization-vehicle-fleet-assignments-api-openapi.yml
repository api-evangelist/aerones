          - format: date-time
            type: string
          - type: 'null'
          title: Accepted At
        returned_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Returned At
        created_at:
          format: date-time
          title: Created At
          type: string
        updated_at:
          format: date-time
          title: Updated At
          type: string
        navirec:
          anyOf:
          - $ref: '#/components/schemas/NavirecLiveState'
          - type: 'null'
      required:
      - id
      - vehicle
      - status
      - from_date
      - to_date
      - created_at
      - updated_at
      title: VehicleFleetAssignmentResponse
      type: object
    FocalxInspectionResponse:
      additionalProperties: false
      properties:
        id:
          title: Id
          type: integer
        focalx_inspection_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Focalx Inspection Id
        status:
          title: Status
          type: string
        result_data:
          anyOf:
          - type: object
          - type: 'null'
          title: Result Data
        error_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Message
        created_at:
          format: date-time
          title: Created At
          type: string
        completed_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Completed At
      required:
      - id
      - status
      - created_at
      title: FocalxInspectionResponse
      type: object
    VehicleResponse:
      additionalProperties: false
      properties:
        id:
          title: Id
          type: integer
        license_plate:
          title: License Plate
          type: string
        make:
          title: Make
          type: string
        model:
          title: Model
          type: string
        type:
          title: Type
          type: string
        country_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Country Id
        location_id:
          title: Location Id
          type: integer
        vehicle_source:
          title: Vehicle Source
          type: string
        telematics_provider:
          title: Telematics Provider
          type: string
        telematics_device_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Telematics Device Id
        rental_company:
          anyOf:
          - type: string
          - type: 'null'
          title: Rental Company
        rental_agreement_no:
          anyOf:
          - type: string
          - type: 'null'
          title: Rental Agreement No
        inspection_to:
          anyOf:
          - type: string
          - type: 'null'
