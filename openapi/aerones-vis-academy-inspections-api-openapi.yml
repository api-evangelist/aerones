    AcademySourceKind:
      description: 'Which VIS media table an academy row points at.


        A kind plus an id instead of the generic ``content_type`` pair

        ``core.anomaly`` uses: ``django_content_type`` primary keys are assigned per

        database, so a stored one does not survive a dump restored into another

        environment, and an academy row never needs to be polymorphic beyond these

        six tables.


        ``AcademyPhotoState`` uses the five photo members only; a video file carries

        no per-photo review state, and neither does a manual photo (rotation and sort

        order only). ``MANUAL_PHOTO`` never appears on a submission: a manual photo

        cannot carry anomalies.'
