openapi: 3.2.0
info:
  title: Operations Hub Vis Academy.inspections API
  version: 0.1.1
  description: ''
servers: []
tags:
- name: vis-academy.inspections
paths:
  /api/vis-academy/v1/inspections/mine/:
    get:
      operationId: vis_academy_api_get_my_academy_inspections
      summary: List the training copies assigned to the caller
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AcademyInspectionSchema'
                title: Response
                type: array
      description: 'The requesting trainee''s own copies, newest first.


        Filtered on ``assigned_to``, not the data-tools "list all" queryset: a

        trainee must see only what was assigned to them.'
      tags:
      - vis-academy.inspections
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/vis-academy/v1/inspections/{academy_inspection_id}/:
    get:
      operationId: vis_academy_api_get_academy_inspection
      summary: Open a training inspection
      parameters:
      - in: path
        name: academy_inspection_id
        schema:
          title: Academy Inspection Id
          type: integer
        required: true
      - in: query
        name: component_name
        schema:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: Filter by component name (exact match).
          title: Component Name
        required: false
        description: Filter by component name (exact match).
      - in: query
        name: component_id
        schema:
          anyOf:
          - items:
              type: integer
            type: array
          - type: 'null'
          description: Filter by turbine component id (exact match).
          title: Component Id
        required: false
        description: Filter by turbine component id (exact match).
      - in: query
        name: section_name
        schema:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: Filter sections by name (exact match).
          title: Section Name
        required: false
        description: Filter sections by name (exact match).
      - in: query
        name: return_sections
        schema:
          default: true
          description: Include component sections in the response.
          title: Return Sections
          type: boolean
        required: false
        description: Include component sections in the response.
      - in: query
        name: return_data
        schema:
          default: true
          description: Include all media data.
          title: Return Data
          type: boolean
        required: false
        description: Include all media data.
      - in: query
        name: return_urls
        schema:
          default: true
          description: Include signed URLs for media data.
          title: Return Urls
          type: boolean
        required: false
        description: Include signed URLs for media data.
      - in: query
        name: root_photo_ordering
        schema:
          examples:
            No ordering:
              description: No specific ordering applied, default order is used.
              value: ''
            Ordering by specific fields:
              description: Fields can be prefixed with '-' for descending order.
              value: distance,name,file_name,angle
          title: Root Photo Ordering
          type: string
        required: false
        examples:
          No ordering:
            description: No specific ordering applied, default order is used.
            value: ''
          Ordering by specific fields:
            description: Fields can be prefixed with '-' for descending order.
            value: distance,name,file_name,angle
      - in: query
        name: poi_photo_ordering
        schema:
          examples:
            No ordering:
              description: No specific ordering applied, default order is used.
              value: ''
            Ordering by specific fields:
              description: Fields can be prefixed with '-' for descending order.
              value: distance,name,file_name,angle
          title: Poi Photo Ordering
          type: string
        required: false
        examples:
          No ordering:
            description: No specific ordering applied, default order is used.
            value: ''
          Ordering by specific fields:
            description: Fields can be prefixed with '-' for descending order.
            value: distance,name,file_name,angle
      - in: query
        name: external_photo_ordering
        schema:
          examples:
            No ordering:
              description: No specific ordering applied, default order is used.
              value: ''
            Ordering by specific fields:
              description: Fields can be prefixed with '-' for descending order.
              value: name,file_name
          title: External Photo Ordering
          type: string
        required: false
        examples:
          No ordering:
            description: No specific ordering applied, default order is used.
            value: ''
          Ordering by specific fields:
            description: Fields can be prefixed with '-' for descending order.
            value: name,file_name
      - in: query
        name: ler_photo_ordering
        schema:
          examples:
            No ordering:
              description: No specific ordering applied, default order is used.
              value: ''
            Ordering by specific fields:
              description: Fields can be prefixed with '-' for descending order.
              value: name,file_name
          title: Ler Photo Ordering
          type: string
        required: false
        examples:
          No ordering:
            description: No specific ordering applied, default order is used.
            value: ''
          Ordering by specific fields:
            description: Fields can be prefixed with '-' for descending order.
            value: name,file_name
      - in: query
        name: manual_photo_ordering
        schema:
          examples:
            No ordering:
              description: No specific ordering applied, default order is used.
              value: ''
            Ordering by specific fields:
              description: Fields can be prefixed with '-' for descending order.
              value: name,file_name
          title: Manual Photo Ordering
          type: string
        required: false
        examples:
          No ordering:
            description: No specific ordering applied, default order is used.
            value: ''
          Ordering by specific fields:
            description: Fields can be prefixed with '-' for descending order.
            value: name,file_name
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademyInspectionDataSchema'
      description: The source inspection with this trainee's progress and photo edits applied.
      tags:
      - vis-academy.inspections
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/vis-academy/v1/inspections/{academy_inspection_id}/presets:
    get:
      operationId: vis_academy_api_get_academy_presets
      summary: The finding form's prefill grid for a training copy
      parameters:
      - in: path
        name: academy_inspection_id
        schema:
          title: Academy Inspection Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademyPresetsSchema'
      description: Whatever the source inspection prefills from, read through the copy.
      tags:
      - vis-academy.inspections
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/vis-academy/v1/inspections/{academy_inspection_id}/authorize-media:
    post:
      operationId: vis_academy_api_authorize_academy_media
      summary: Set the CDN cookies for a training inspection
      parameters:
      - in: path
        name: academy_inspection_id
        schema:
          title: Academy Inspection Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
      description: Grant the trainee the source inspection's media for the usual window.
      tags:
      - vis-academy.inspections
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/vis-academy/v1/inspections/{academy_inspection_id}/sections/{source_section_id}/:
    patch:
      operationId: vis_academy_api_patch_academy_section
      summary: Record progress through a section
      parameters:
      - in: path
        name: academy_inspection_id
        schema:
          title: Academy Inspection Id
          type: integer
        required: true
      - in: path
        name: source_section_id
        schema:
          title: Source Section Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
      description: Mark a section's status on the training copy, not on the real section.
      tags:
      - vis-academy.inspections
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SectionStatusSchema'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/vis-academy/v1/inspections/{academy_inspection_id}/photos/{photo_kind}/{photo_id}/:
    patch:
      operationId: vis_academy_api_patch_academy_photo
      summary: Record a photo edit on a training inspection
      parameters:
      - in: path
        name: academy_inspection_id
        schema:
          title: Academy Inspection Id
          type: integer
        required: true
      - in: path
        name: photo_kind
        schema:
          title: Photo Kind
          type: string
        required: true
      - in: path
        name: photo_id
        schema:
          title: Photo Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
      description: Store review status, rotation or ordering without touching the real photo.
      tags:
      - vis-academy.inspections
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhotoStateSchema'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/vis-academy/v1/inspections/{academy_inspection_id}/submissions/:
    get:
      operationId: vis_academy_api_get_academy_submissions
      summary: List a trainee's findings and their AI queue
      parameters:
      - in: path
        name: academy_inspection_id
        schema:
          title: Academy Inspection Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SubmissionSchema'
                title: Response
                type: array
      description: 'This attempt''s rows only.


        Retired attempts stay in the table for grading but are never served here:

        the previous trainee''s findings are the answer to the same exercise.'
      tags:
      - vis-academy.inspections
      security:
      - APIKeyAuth: []
      - CookieAuth: []
    post:
      operationId: vis_academy_api_post_academy_submission
      summary: Register a finding on a training inspection
      parameters:
      - in: path
        name: academy_inspection_id
        schema:
          title: Academy Inspection Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionSchema'
      description: Record one finding the trainee made. Never reaches ``core.anomaly``.
      tags:
      - vis-academy.inspections
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionWriteSchema'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/vis-academy/v1/inspections/{academy_inspection_id}/submissions/{submission_id}/:
    patch:
      operationId: vis_academy_api_patch_academy_submission
      summary: Edit a finding, or record an AI verdict
      parameters:
      - in: path
        name: academy_inspection_id
        schema:
          title: Academy Inspection Id
          type: integer
        required: true
      - in: path
        name: submission_id
        schema:
          title: Submission Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionSchema'
      description: Reviewing the AI queue is a ``ai_status`` update on a seeded row.
      tags:
      - vis-academy.inspections
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionWriteSchema'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
    delete:
      operationId: vis_academy_api_delete_academy_submission
      summary: Retire a finding on a training inspection
      parameters:
      - in: path
        name: academy_inspection_id
        schema:
          title: Academy Inspection Id
          type: integer
        required: true
      - in: path
        name: submission_id
        schema:
          title: Submission Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
      description: Soft, so a reviewer still sees what the trainee tried.
      tags:
      - vis-academy.inspections
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/vis-academy/v1/inspections/{academy_inspection_id}/submissions/{submission_id}/files/:
    get:
      operationId: vis_academy_api_get_academy_submission_files
      summary: The AI-review images behind one copied finding
      parameters:
      - in: path
        name: academy_inspection_id
        schema:
          title: Academy Inspection Id
          type: integer
        required: true
      - in: path
        name: submission_id
        schema:
          title: Submission Id
          type: integer
        required: true
      - in: query
        name: sort
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Sort field
          title: Sort
        required: false
        description: Sort field
      - in: query
        name: type
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by file type
          title: Type
        required: false
        description: Filter by file type
      - in: query
        name: paginate
        schema:
          default: true
          description: Enable pagination (false returns all results)
          title: Paginate
          type: boolean
        required: false
        description: Enable pagination (false returns all results)
      - in: query
        name: page
        schema:
          default: 1
          description: Page number
          minimum: 1
          title: Page
          type: integer
        required: false
        description: Page number
      - in: query
        name: page_size
        schema:
          default: 50
          description: Number of items per page
          maximum: 1000
          minimum: 1
          title: Page Size
          type: integer
        required: false
        description: Number of items per page
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/FileResponse'
                title: Response
                type: array
      description: Read a copied AI finding's images through the source anomaly, RLS-scoped.
      tags:
      - vis-academy.inspections
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/vis-academy/v1/inspections/{academy_inspection_id}/report/state:
    get:
      operationId: vis_academy_api_get_academy_report_state
      summary: Latest completed + in-progress report for this attempt
      parameters:
      - in: path
        name: academy_inspection_id
        schema:
          title: Academy Inspection Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademyReportStateResponse'
      description: State the Final Report modal needs on open, for a training copy.
      tags:
      - vis-academy.inspections
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/vis-academy/v1/inspections/{academy_inspection_id}/report/start:
    post:
      operationId: vis_academy_api_start_academy_report
      summary: Kick off async report generation for a training copy
      parameters:
      - in: path
        name: academy_inspection_id
        schema:
          title: Academy Inspection Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademyReportStartResponse'
      description: Generate a final report for this trainee's own copy, same engine as the real one.
      tags:
      - vis-academy.inspections
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcademyReportRequest'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/vis-academy/v1/inspections/{academy_inspection_id}/report/{generation_id}/status:
    get:
      operationId: vis_academy_api_academy_report_status
      summary: Poll an in-flight training-report generation
      parameters:
      - in: path
        name: academy_inspection_id
        schema:
          title: Academy Inspection Id
          type: integer
        required: true
      - in: path
        name: generation_id
        schema:
          title: Generation Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademyReportStatusResponse'
      description: Poll the status of an in-flight training-report generation.
      tags:
      - vis-academy.inspections
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/vis-academy/v1/inspections/{academy_inspection_id}/report/{generation_id}/download:
    get:
      operationId: vis_academy_api_download_academy_report
      summary: Download the stored PDF for a training-report generation
      parameters:
      - in: path
        name: academy_inspection_id
        schema:
          title: Academy Inspection Id
          type: integer
        required: true
      - in: path
        name: generation_id
        schema:
          title: Generation Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
      description: Download the stored PDF for a generation. Always serves our own copy.
      tags:
      - vis-academy.inspections
      security:
      - APIKeyAuth: []
      - CookieAuth: []
components:
  schemas:
    SectionStatusSchema:
      additionalProperties: false
      description: A trainee's progress through one section.
      properties:
        status:
          $ref: '#/components/schemas/InspectionItemStatus'
      required:
      - status
      title: SectionStatusSchema
      type: object
    AcademyReportStateResponse:
      additionalProperties: false
      description: 'State the Final Report modal needs on open, for a training copy.


        Scoped to the copy''s current attempt: a reset must not resurface a prior

        attempt''s report as if it belonged to the fresh one.'
      properties:
        latest_completed:
          anyOf:
          - $ref: '#/components/schemas/AcademyReportGenerationSummary'
          - type: 'null'
        in_progress:
          anyOf:
          - $ref: '#/components/schemas/AcademyReportGenerationSummary'
          - type: 'null'
      title: AcademyReportStateResponse
      type: object
    PhotoStateSchema:
      additionalProperties: false
      description: 'What a trainee changed about one photo. Omitted keys stay unchanged.


        ``status`` stays a plain string here because the vocabulary depends on the

        photo kind in the path — external and LER photos have their own review

        enums, and root and POI photos have no review flow at all.

        ``handlers.inspection.set_photo_state`` validates it against the kind.'
      properties:
        status:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
        rotation:
          anyOf:
          - type: integer
          - type: 'null'
          title: Rotation
        sort_order:
          anyOf:
          - type: integer
          - type: 'null'
          title: Sort Order
      title: PhotoStateSchema
      type: object
    ComponentSchema:
      properties:
        id:
          title: Id
          type: integer
        name:
          title: Name
          type: string
        turbine_component:
          anyOf:
          - $ref: '#/components/schemas/TurbineComponentResponse'
          - type: 'null'
        sections:
          anyOf:
          - items:
              $ref: '#/components/schemas/SectionSchema'
            type: array
          - type: 'null'
          title: Sections
      required:
      - id
      - name
      title: ComponentSchema
      type: object
    SectionRunSchema:
      properties:
        run_index:
          title: Run Index
          type: integer
        section_id:
          title: Section Id
          type: integer
      required:
      - run_index
      - section_id
      title: SectionRunSchema
      type: object
    ImageSide:
      description: Sides from which photos can be taken.
      enum:
      - L
      - R
      - T
      title: ImageSide
      type: string
    LERPhotoTileSchema:
      properties:
        url:
          anyOf:
          - type: string
          - type: 'null'
          title: Url
        id:
          title: Id
          type: integer
        x:
          title: X
          type: integer
        y:
          title: Y
          type: integer
      required:
      - id
      - x
      - y
      title: LERPhotoTileSchema
      type: object
    ComponentTypeObject:
      additionalProperties: false
      description: Nested component type object for responses.
      properties:
        id:
          title: Id
          type: integer
        name:
          title: Name
          type: string
        field_list:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Field List
      required:
      - id
      - name
      title: ComponentTypeObject
      type: object
    AnomalyStatus:
      description: Status for anomalies.
      enum:
      - NEW
      - REPAIR
      - INSPECT
      - MONITOR
      - ACTIVE
      - RESOLVED
      - ARCHIVED
      - TEMPORARY_REPAIR
      - NOT_ASSIGNED
      - NO_ACTION
      title: AnomalyStatus
      type: string
    AcademyInspectionDataSchema:
      description: 'A training copy as its trainee opens it: the source tree plus their overrides.


        ``components`` and everything under it is the source inspection''s, so this

        stays the VIS inspection shape. ``academy`` says which copy and which

        attempt is being read, and ``source`` carries the service-order-line values

        the viewer would otherwise query.'
      properties:
        id:
          title: Id
          type: integer
        service_order_line_id:
          title: Service Order Line Id
          type: integer
        components:
          anyOf:
          - items:
              $ref: '#/components/schemas/ComponentSchema'
            type: array
          - type: 'null'
          title: Components
        manual_photos:
          anyOf:
          - items:
              $ref: '#/components/schemas/ManualPhotoSchema'
            type: array
          - type: 'null'
          title: Manual Photos
        academy:
          $ref: '#/components/schemas/AcademyInspectionSchema'
        source:
          $ref: '#/components/schemas/AcademySourceSchema'
      required:
      - id
      - service_order_line_id
      - academy
      - source
      title: AcademyInspectionDataSchema
      type: object
    VideoFileBlobSchema:
      properties:
        url:
          anyOf:
          - type: string
          - type: 'null'
          title: Url
        id:
          title: Id
          type: integer
        kind:
          $ref: '#/components/schemas/VideoFileBlobKind'
      required:
      - id
      - kind
      title: VideoFileBlobSchema
      type: object
    LERPhotoRunSchema:
      properties:
        id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Id
        run_index:
          title: Run Index
          type: integer
        status:
          $ref: '#/components/schemas/LERInspectionStatus'
        photos:
          items:
            $ref: '#/components/schemas/LERPhotoSchema'
          title: Photos
          type: array
      required:
      - run_index
      - status
      - photos
      title: LERPhotoRunSchema
      type: object
    ManualPhotoSchema:
      description: 'A manual drone photo, attached to the inspection itself.


        No review status and no distance vector: those belong to external photos.'
      properties:
        name:
          title: Name
          type: string
        rotation:
          title: Rotation
          type: integer
        sort_order:
          anyOf:
          - type: integer
          - type: 'null'
          title: Sort Order
        distance:
          anyOf:
          - type: number
          - type: 'null'
          title: Distance
        side:
          anyOf:
          - $ref: '#/components/schemas/ImageSide'
          - type: 'null'
        index:
          anyOf:
          - type: integer
          - type: 'null'
          title: Index
        angle:
          anyOf:
          - type: integer
          - type: 'null'
          title: Angle
        orientation:
          anyOf:
          - $ref: '#/components/schemas/ImageOrientation'
          - type: 'null'
        normalized_angle:
          anyOf:
          - type: integer
          - type: 'null'
          title: Normalized Angle
        url:
          anyOf:
          - type: string
          - type: 'null'
          title: Url
        id:
          title: Id
          type: integer
        pixel_distance:
          anyOf:
          - type: number
          - type: 'null'
          title: Pixel Distance
        cdn_base_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Cdn Base Url
        tiles:
          anyOf:
          - items:
              $ref: '#/components/schemas/ExternalPhotoTileSchema'
            type: array
          - type: 'null'
          title: Tiles
        thumbnail:
          anyOf:
          - $ref: '#/components/schemas/ExternalPhotoThumbnailSchema'
          - type: 'null'
        lowres:
          anyOf:
          - $ref: '#/components/schemas/ExternalPhotoLowResSchema'
          - type: 'null'
        distance_to_centre:
          anyOf:
          - type: number
          - type: 'null'
          title: Distance To Centre
      required:
      - name
      - rotation
      - id
