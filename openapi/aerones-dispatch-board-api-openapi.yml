    BacklogCounts:
      additionalProperties: false
      description: 'Facet counts for the sidebar filter chips.


        Each facet is counted over the search + assignment scope BEFORE that

        facet''s own filter is applied (standard faceting), matching how the board

        previously derived counts client-side.


        ``logged_unplanned`` counts real work logged with no formal dispatch

        (DISP-4368) -- those workorders are already part of the unassigned scope

        above, indistinguishable by status from any other untouched backlog row,

        so this facet is what makes them findable rather than buried among

        hundreds of genuinely untouched ones.'
      properties:
