openapi: 3.2.0
info:
  title: Operations Hub Dispatch.board API
  version: 0.1.1
  description: ''
servers: []
tags:
- name: dispatch.board
paths:
  /api/dispatch/v1/projects/{project_id}/dispatch/board-data:
    get:
      operationId: get_board_data_v1
      summary: Get dispatching board data
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: integer
        required: true
      - in: query
        name: since
        schema:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          title: Since
        required: false
      - in: query
        name: until
        schema:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          title: Until
        required: false
      - in: query
        name: include_backlog
        schema:
          default: true
          title: Include Backlog
          type: boolean
        required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardDataResponse'
      description: 'Return all data needed for the dispatching board.


        Aggregates:

        - Project resource sets with their members

        - All project workorders (service + admin) with resource assignments

        - Service order lines grouped for the panel


        When both ``since`` and ``until`` are supplied, the workorders list is

        filtered to a date window — useful for the dispatching console where

        only the relevant working set should be returned. The five filter

        clauses are: scheduled in window, mandatory in window,

        assigned-but-unscheduled, due-dated backlog within

        ``dispatch.managers.board_reads.BACKLOG_HORIZON_DAYS``, and unassigned

        WOs from PLANNING/EXECUTION projects (regardless of due date). Without

        the params, the legacy behaviour is preserved (returns all non-cancelled

        workorders).


        The windowed result also folds in real work that was logged but never

        formally dispatched (DISP-4368, see

        ``dispatch.managers.logged_unplanned._get_logged_unplanned_workorders``)

        -- those rows carry ``is_logged_unplanned=True`` with a planned window

        derived from the actual logged activity times, and are dropped entirely

        if that derived window clashes with a genuinely planned entry for one of

        the same resources.'
      tags:
      - dispatch.board
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/dispatch/v1/projects/{project_id}/dispatch/board-turbines:
    get:
      operationId: get_board_turbines_v1
      summary: Get per-turbine status rollup for the dispatching board
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardTurbinesResponse'
      description: 'Per-turbine status + activity-group completion for the whole project,

        regardless of the board''s date window (see

        ``dispatch.managers.board_reads._get_project_turbines``).


        Kept on its own query, decoupled from ``board-data``''s per-mutation

        refetch cycle, since this scan covers every non-cancelled workorder in

        the project and dominates payload size.'
      tags:
      - dispatch.board
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/dispatch/v1/projects/{project_id}/dispatch/backlog:
    get:
      operationId: get_backlog_v1
      summary: Server-filtered, paginated work-order list for the dispatch sidebar
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: integer
        required: true
      - in: query
        name: q
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Q
        required: false
      - in: query
        name: assignment
        schema:
          default: open
          title: Assignment
          type: string
        required: false
      - in: query
        name: statuses
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Statuses
        required: false
      - in: query
        name: kinds
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Kinds
        required: false
      - in: query
        name: service_codes
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Service Codes
        required: false
      - in: query
        name: turbine_ids
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Turbine Ids
        required: false
      - in: query
        name: logged_unplanned
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Logged Unplanned
        required: false
      - in: query
        name: page
        schema:
          default: 1
          title: Page
          type: integer
        required: false
      - in: query
        name: page_size
        schema:
          default: 300
          title: Page Size
          type: integer
        required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BacklogPageResponse'
      description: 'Sidebar work-order list with server-side filtering and pagination.


        A large project can hold thousands of unassigned workorders — shipping

        them all inside ``board-data`` made the board slow and the browser

        unstable, so the sidebar reads this endpoint instead (and ``board-data``

        is called with ``include_backlog=false``).


        Filters: ``q`` full-text-ish search (name, description, service code,

        turbine name, SO number); ``assignment`` open|unassigned|assigned, where

        ``assigned`` means an active resource-set link EXISTS, ``unassigned`` means

        none does, and ``open`` (the default, what the sidebar shows) is

        unassigned work PLUS any ``IN_PROGRESS`` workorder regardless of its team

        link -- running work that was dispatched earlier still has to be found

        and moved to the next day when it does not finish, and it normally still

        carries its team; ``statuses``/``kinds``/``service_codes`` as

        comma-separated lists; ``logged_unplanned`` narrows to (``true``) or

        excludes (``false``) real work logged with no formal dispatch (DISP-4368)

        -- these rows are already part of the unassigned scope and otherwise

        indistinguishable by status from any untouched backlog WO, so this is

        what makes them findable across a project''s full backlog rather than only

        on whichever board day/week they happen to be scrolled to. ``counts`` in

        the response carries facet totals for the filter chips, each computed

        before its own facet filter (standard faceting), over the search +

        assignment scope.


        See ``dispatch.managers.backlog._get_backlog_sync`` for the query shape:

        the assignment counts come from one query (grouping on a ``has_team``

        annotation rather than filtering `base` twice), and the three facet

        breakdowns (statuses/kinds/services) come from one grouped query across

        all three dimensions at once, summed per dimension in Python.'
      tags:
      - dispatch.board
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/dispatch/v1/projects/{project_id}/dispatch/board-weather:
    get:
      operationId: get_board_weather_v1
      summary: Get dispatching board weather
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: integer
        required: true
      - in: query
        name: date
        schema:
          format: date
          title: Date
          type: string
        required: true
      - in: query
        name: project_location_id
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Project Location Id
        required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardWeatherResponse'
      description: 'Hourly weather forecast for a project location on ``date``.


        The whole UTC day, read from the ``weather_forecast`` cache (kept warm by the scheduled Gust sync). On a

        cache miss for an in-horizon day, the location''s bucket is backfilled from

        Gust on the fly (one query) and re-read. Fail-soft: returns

        ``available=false`` with no hours when the location has no coordinates or no

        forecast is available, so the board always renders.'
      tags:
      - dispatch.board
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/dispatch/v1/coverage:
    get:
      operationId: dispatch_coverage_v1
      summary: Per-project resource-set coverage by day
      parameters:
      - in: query
        name: since
        schema:
          format: date
          title: Since
          type: string
        required: true
      - in: query
        name: until
        schema:
          format: date
          title: Until
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ProjectCoverageResponse'
                title: Response
                type: array
      description: 'For each project active in the window, return the total active resource

        sets and the per-day count of resource sets with at least one workorder

        planned to start on that day. Coverage % is computed client-side.'
      tags:
      - dispatch.board
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/dispatch/v1/adoption:
    get:
      operationId: dispatch_adoption_v1
      summary: Teams x dates table of what the board dispatched (OH-4167)
      parameters:
      - in: query
        name: since
        schema:
          format: date
          title: Since
          type: string
        required: true
      - in: query
        name: until
        schema:
          format: date
          title: Until
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdoptionTableResponse'
      tags:
      - dispatch.board
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/dispatch/v1/supervisor-options:
    get:
      operationId: list_supervisor_options_v1
      summary: List BTO supervisors and the core projects they supervise
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SupervisorOption'
                title: Response
                type: array
      description: 'Supervisors exist only on BTO rosters (``team_members`` entries with

        role "Supervisor") — there is no core-project supervisor field yet

        (OH-2774).'
      tags:
      - dispatch.board
      security:
      - APIKeyAuth: []
      - CookieAuth: []
