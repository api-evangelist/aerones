        `daily_filled` is a list of {date, filled} entries — list-of-objects rather

        than a date-keyed dict so the axios camel/snake interceptor on the

        frontend doesn''t strip dashes from the date keys.

        Coverage % per day = filled / total_resource_sets.'
      properties:
