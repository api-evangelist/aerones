        ``status`` / ``duration_minutes`` drive the card''s activity strip (a

        proportional coloured segment per activity). ``custom_fields`` is the raw

        activity custom-fields JSON and rides along for ADMIN workorders only — the

        board popover extracts image attachments from it to show photo evidence.

        ``start_datetime`` / ``end_datetime`` / ``resource_ids`` (FEAT-4909) let the

        frontend group a multi-day workorder''s activities by the day each one was

        actually worked, independent of the workorder''s own planned window.'
      properties:
