components:
  schemas:
    BacklogPageResponse:
      additionalProperties: false
      description: One page of the server-filtered sidebar work-order list.
      properties:
        items:
          items:
            $ref: '#/components/schemas/BoardWorkorderResponse'
          title: Items
          type: array
        service_order_lines:
          items:
            $ref: '#/components/schemas/ServiceOrderLineGroup'
          title: Service Order Lines
          type: array
        total_count:
          title: Total Count
          type: integer
        counts:
          $ref: '#/components/schemas/BacklogCounts'
      required:
      - items
      - service_order_lines
      - total_count
      - counts
      title: BacklogPageResponse
      type: object
    SupervisorOption:
      additionalProperties: false
      description: A BTO supervisor and the core projects they supervise (DISP-2905).
      properties:
        name:
          title: Name
          type: string
        project_ids:
          items:
            type: integer
          title: Project Ids
          type: array
      required:
      - name
      - project_ids
      title: SupervisorOption
      type: object
    PendingScopeCommitmentResponse:
      additionalProperties: false
      description: One PENDING scope-dispatch commitment (DISP-3249) -- no SOL/Workorder yet.
      properties:
        id:
          title: Id
          type: integer
        service_id:
          title: Service Id
          type: integer
        service_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Service Code
        location_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Location Id
        location_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Location Name
        component_type_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Component Type Id
        project_resource_set_id:
          title: Project Resource Set Id
          type: integer
        planned_start_datetime:
          format: date-time
          title: Planned Start Datetime
          type: string
        planned_end_datetime:
          format: date-time
          title: Planned End Datetime
          type: string
      required:
      - id
      - service_id
      - project_resource_set_id
      - planned_start_datetime
      - planned_end_datetime
      title: PendingScopeCommitmentResponse
      type: object
    WorkorderResourceResponse:
      additionalProperties: false
      description: A resource assigned to a workorder.
      properties:
        resource_id:
          title: Resource Id
          type: integer
        resource_name:
          title: Resource Name
          type: string
        is_lead:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Lead
      required:
      - resource_id
      - resource_name
      title: WorkorderResourceResponse
      type: object
    AdoptionPerson:
      additionalProperties: false
      properties:
        id:
          title: Id
          type: integer
        first_name:
          title: First Name
          type: string
        last_name:
          title: Last Name
          type: string
        email:
          anyOf:
          - type: string
          - type: 'null'
          title: Email
      required:
      - id
      - first_name
      - last_name
      title: AdoptionPerson
      type: object
    BoardWeatherResponse:
      additionalProperties: false
      description: 'Hourly weather for the dispatching day-Gantt.


        ``available`` is False (with an empty ``hours`` list) when the project''s

        primary location has no coordinates or the forecast cache has no data for

        that day — the board renders regardless.'
      properties:
        available:
          title: Available
          type: boolean
        location_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Location Id
        location_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Location Name
        latitude:
          anyOf:
          - type: number
          - type: 'null'
          title: Latitude
        longitude:
          anyOf:
          - type: number
          - type: 'null'
          title: Longitude
        hours:
          items:
            $ref: '#/components/schemas/WeatherHourResponse'
          title: Hours
          type: array
      required:
      - available
      - hours
      title: BoardWeatherResponse
      type: object
    BoardWorkorderResponse:
      additionalProperties: false
      description: 'A workorder for the dispatching board. ``actual_start_datetime`` is

        the earliest non-cancelled activity''s own start_datetime -- null until

        the team actually starts work, distinct from the length carried by

        ``estimated_duration_minutes``. Lets the board flag a planned-vs-actual

        start discrepancy.'
      properties:
        id:
          title: Id
          type: integer
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        description:
          anyOf:
          - type: string
