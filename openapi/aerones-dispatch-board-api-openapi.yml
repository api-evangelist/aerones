    BoardTurbineResponse:
      additionalProperties: false
      description: 'A project-scope turbine (WTG) with its combined status.


        ``status`` is a rollup of the turbine''s non-cancelled workorders across the

        whole project (any date), independent of the board''s date window:

        ``NO_WORK`` (no non-cancelled workorders), ``NOT_STARTED``, ``IN_PROGRESS``

        (any WO in progress), or ``COMPLETED`` (all WOs completed).


        ``activity_groups`` breaks that rollup down per activity group (ServiceItem

        phase) so the board can show which groups are done: each entry carries the

        completed vs total non-cancelled ``WorkorderActivity`` count for that group

        on this turbine, across the whole project.'
      properties:
        id:
          title: Id
          type: integer
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        status:
          title: Status
          type: string
        activity_groups:
          default: []
          items:
            $ref: '#/components/schemas/BoardTurbineActivityGroupResponse'
          title: Activity Groups
          type: array
      required:
      - id
      - status
      title: BoardTurbineResponse
      type: object
