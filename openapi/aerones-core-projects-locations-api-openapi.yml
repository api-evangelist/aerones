openapi: 3.2.0
info:
  title: Operations Hub Core.projects.locations API
  version: 0.1.1
  description: ''
servers: []
tags:
- name: core.projects.locations
paths:
  /api/core/v1/projects/{project_id}/locations:
    get:
      operationId: list_project_locations
      summary: List Project Locations
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: query
        name: search
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Search by name (case-insensitive)
          title: Search
        required: false
        description: Search by name (case-insensitive)
      - in: query
        name: sort
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Sort by field (prefix with - for descending)
          title: Sort
        required: false
        description: Sort by field (prefix with - for descending)
      - in: query
        name: paginate
        schema:
          default: true
          description: Enable pagination (false returns all results)
          title: Paginate
          type: boolean
        required: false
        description: Enable pagination (false returns all results)
      - in: query
        name: page
        schema:
          default: 1
          description: Page number
          minimum: 1
          title: Page
          type: integer
        required: false
        description: Page number
      - in: query
        name: page_size
        schema:
          default: 50
          description: Number of items per page
          maximum: 1000
          minimum: 1
          title: Page Size
          type: integer
        required: false
        description: Number of items per page
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ProjectLocationResponse'
                title: Response
                type: array
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: List all locations for a project.
      tags:
      - core.projects.locations
      security:
      - APIKeyAuth: []
      - CookieAuth: []
    post:
      operationId: create_project_locations
      summary: Bulk Assign Locations to Project
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ProjectLocationResponse'
                title: Response
                type: array
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'Bulk assign locations to project with legacy system sync.


        Creates records in:

        - core.project_location (new system)

        - projects.Site (legacy system)

        - projects_project_sites (legacy junction)


        All within a single atomic transaction.'
      tags:
      - core.projects.locations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectLocationBulkCreate'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/core/v1/projects/{project_id}/locations/service-coverage:
    get:
      operationId: list_project_location_service_coverage
      summary: Per project location, the service ids offered or scoped there
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ProjectLocationServicesResponse'
                title: Response
                type: array
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'Service coverage per site: the union of approved-offer + scope services

        at each of the project''s locations. Not paginated — bounded by site count.

        Defined before the ``/{location_id}`` routes so ``service-coverage`` isn''t

        swallowed as a location id.'
      tags:
      - core.projects.locations
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/core/v1/projects/{project_id}/locations/{location_id}/pre-job:
    get:
      operationId: get_project_location_pre_job
      summary: Get pre-job composite for a project location
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: location_id
        schema:
          title: Location Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreJobSiteCompositeResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'Pre-job payload for one site.


        ``location_id`` is ``ProjectLocation.id`` (not ``Location.id``).'
      tags:
      - core.projects.locations
      security:
      - APIKeyAuth: []
      - CookieAuth: []
    put:
      operationId: update_project_location_pre_job
      summary: Update pre-job composite for a project location
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: location_id
        schema:
          title: Location Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreJobSiteCompositeResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'Partial update for pre-job sections on one site.


        ``location_id`` is ``ProjectLocation.id`` (not ``Location.id``).'
      tags:
      - core.projects.locations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreJobSiteCompositeUpdate'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/core/v1/projects/{project_id}/pre-job/prefill-source-projects:
    get:
      operationId: list_pre_job_prefill_source_projects
      summary: List candidate source projects for pre-job prefill
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: query
        name: target_project_location_id
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Target Project Location Id
        required: false
      - in: query
        name: paginate
        schema:
          default: true
          description: Enable pagination (false returns all results)
          title: Paginate
          type: boolean
        required: false
        description: Enable pagination (false returns all results)
      - in: query
        name: page
        schema:
          default: 1
          description: Page number
          minimum: 1
          title: Page
          type: integer
        required: false
        description: Page number
      - in: query
        name: page_size
        schema:
          default: 50
          description: Number of items per page
          maximum: 1000
          minimum: 1
          title: Page Size
          type: integer
        required: false
        description: Number of items per page
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PreJobPrefillSourceProject'
                title: Response
                type: array
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'Return every other active project as a prefill source candidate.


        When ``target_project_location_id`` is supplied, projects sharing the target

        site''s ``core.Location`` are sorted to the top (affordance only — any project

        is allowed as a source) and enriched with the shared site''s services and

        pre-job completion percentage. Standard ``Total-Count``/``Page``/``Page-Size``

        headers; pass ``paginate=false`` to disable. Rows carry computed fields, so

        the manager returns the pre-sliced ``items``/``total_count`` dict shape and

        the pagination inputs are re-read here from the query string (the decorator

        consumes them itself and slices only querysets).


        Internal users only — client portal (PWT) callers must not see cross-project

        prefill candidates.'
      tags:
      - core.projects.locations
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/core/v1/projects/{project_id}/pre-job/prefill-source-sites:
    get:
      operationId: list_pre_job_prefill_source_sites
      summary: List sites on a source project for the prefill picker
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: query
        name: paginate
        schema:
          default: true
          description: Enable pagination (false returns all results)
          title: Paginate
          type: boolean
        required: false
        description: Enable pagination (false returns all results)
      - in: query
        name: page
        schema:
          default: 1
          description: Page number
          minimum: 1
          title: Page
          type: integer
        required: false
        description: Page number
      - in: query
        name: page_size
        schema:
          default: 50
          description: Number of items per page
          maximum: 1000
          minimum: 1
          title: Page Size
          type: integer
        required: false
        description: Number of items per page
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PreJobPrefillSourceSite'
                title: Response
                type: array
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Return the active sites on the requested source project.
      tags:
      - core.projects.locations
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/core/v1/projects/{project_id}/locations/{location_id}:
    get:
      operationId: get_project_location
      summary: Get Project Location
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: location_id
        schema:
          title: Location Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectLocationResponse'
      description: Get a specific project location.
      tags:
      - core.projects.locations
      security:
      - APIKeyAuth: []
      - CookieAuth: []
    patch:
      operationId: update_project_location
      summary: Update Project Location
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: location_id
        schema:
          title: Location Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectLocationResponse'
      description: Update project location metadata (contact, additional_information).
      tags:
      - core.projects.locations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectLocationUpdate'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
    delete:
      operationId: delete_project_location
      summary: Remove Location from Project
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: location_id
        schema:
          title: Location Id
          type: integer
        required: true
      - in: query
        name: delete_pre_job_answers
        schema:
          default: false
          title: Delete Pre Job Answers
          type: boolean
        required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
      description: 'Soft-delete project location and corresponding legacy Site.


        `delete_pre_job_answers=true` cascade soft-deletes the site''s pre-job

        answers (site-owned questionnaire data) instead of letting them block the

        deletion. Used by the UI after warning the user. Other references (offer

        items, resource sets, requests) still block.'
      tags:
      - core.projects.locations
      security:
      - APIKeyAuth: []
      - CookieAuth: []
components:
  schemas:
    PreJobSiteCompositeContactItem:
      additionalProperties: false
      description: 'One contact row in a composite PUT (upsert: set id to update, omit to create).'
      properties:
        id:
          anyOf:
          - type: integer
          - type: 'null'
          description: Existing CustomerContact id; omit for a new row
          title: Id
        name:
          anyOf:
          - minLength: 1
            type: string
          - type: 'null'
          description: Contact name
          title: Name
        title:
          anyOf:
          - type: string
          - type: 'null'
          description: Title / role shown as `role` in pre-job read payloads
          title: Title
        department:
          anyOf:
          - type: string
          - type: 'null'
          description: Department
          title: Department
        email:
          anyOf:
          - type: string
          - type: 'null'
          description: Email
          title: Email
        phone:
          anyOf:
          - type: string
          - type: 'null'
          description: Phone
          title: Phone
        is_primary:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Primary flag
          title: Is Primary
        additional_info:
          anyOf:
          - type: string
          - type: 'null'
          description: Extra notes
          title: Additional Info
        is_qhse:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Mark this contact as the QHSE contact (manages a QHSE_CONTACT ProjectContact row)
          title: Is Qhse
      title: PreJobSiteCompositeContactItem
      type: object
    ErrorCode:
      description: Error codes for API errors.
      enum:
      - validation
      - server
      - auth
      - unknown
      - external
      - generic
      title: ErrorCode
      type: string
    PreJobPrefillSourceProject:
      additionalProperties: false
      description: Another project usable as a pre-job prefill source. Paginated list row.
      properties:
        id:
          description: Core project id
          title: Id
          type: integer
        code:
          description: Project code
          title: Code
          type: string
        shares_target_location:
          default: false
          description: True when this project has an active site at the same core.Location as the target pre-job site (sorted to the top as an affordance).
          title: Shares Target Location
          type: boolean
        site_services:
          description: Services this project owes at the shared site per its latest APPROVED offer. Empty unless shares_target_location is true.
          items:
            $ref: '#/components/schemas/PreJobPrefillSourceSiteService'
          title: Site Services
          type: array
        site_pre_job_percentage:
          anyOf:
          - type: integer
          - type: 'null'
          description: Pre-job completion (0-100) of this project's site at the shared location — site-scoped buckets only, billing excluded. Null unless shares_target_location is true.
          title: Site Pre Job Percentage
      required:
      - id
      - code
      title: PreJobPrefillSourceProject
      type: object
    PreJobSiteFileObject:
      additionalProperties: false
      description: File link within a site response.
      properties:
        id:
          title: Id
          type: integer
        file_id:
          title: File Id
          type: integer
        additional_information:
          anyOf:
          - type: object
          - type: 'null'
          title: Additional Information
      required:
      - id
      - file_id
      title: PreJobSiteFileObject
      type: object
    PreJobSiteCompositeFileLinkPatch:
      additionalProperties: false
      description: File link upsert for pre-job instructions (FileEntityLink).
      properties:
        id:
          anyOf:
          - type: integer
          - type: 'null'
          description: Existing FileEntityLink id when updating
          title: Id
        file_id:
          description: Linked file ID
          title: File Id
          type: integer
        additional_information:
          anyOf:
          - type: object
          - type: 'null'
          description: Optional JSON metadata on the link
          title: Additional Information
      required:
      - file_id
      title: PreJobSiteCompositeFileLinkPatch
      type: object
    PreJobSiteCompositeCustomerLocationObject:
      additionalProperties: false
      description: CustomerLocation slice returned by the per-location pre-job composite GET.
      properties:
        id:
          description: Customer location ID
          title: Id
          type: integer
        customer_id:
          description: Customer ID
          title: Customer Id
          type: integer
        location_id:
          description: Core location ID
          title: Location Id
          type: integer
        metadata:
          anyOf:
          - type: object
          - type: 'null'
          description: Per customer–location JSON (e.g. access, schedule, certifications flags)
          title: Metadata
        relationship_id:
          anyOf:
          - type: integer
          - type: 'null'
          description: Relationship type ID when set
          title: Relationship Id
      required:
      - id
      - customer_id
      - location_id
      title: PreJobSiteCompositeCustomerLocationObject
      type: object
    ProjectLocationResponse:
      additionalProperties: false
      description: Schema for ProjectLocation response.
      properties:
        updated_at:
          description: Last update timestamp
          format: date-time
          title: Updated At
          type: string
        id:
          description: Project location ID
          title: Id
          type: integer
        project_id:
          description: Project ID
          title: Project Id
          type: integer
        location:
          $ref: '#/components/schemas/LocationObjectExpanded'
          description: Expanded location information with full details
        project_contact_id:
          anyOf:
          - type: integer
          - type: 'null'
          description: Project contact ID
          title: Project Contact Id
        om_building_customer_address_id:
          anyOf:
          - type: integer
          - type: 'null'
          description: 'Pre-job O&M building: optional FK to ``CustomerAddress`` (``OM_BUILDING``); null when not linked'
          title: Om Building Customer Address Id
        contact:
          anyOf:
          - $ref: '#/components/schemas/CustomerContactObject'
          - type: 'null'
          description: Customer contact information
        additional_information:
          anyOf:
          - type: object
          - type: 'null'
          description: Additional information as JSON
          title: Additional Information
      required:
      - updated_at
      - id
      - project_id
      - location
      title: ProjectLocationResponse
      type: object
    PreJobSiteLocationObject:
      additionalProperties: false
      description: Location details within a pre-job site response.
      properties:
        id:
          title: Id
          type: integer
        name:
          title: Name
          type: string
        type:
          anyOf:
          - type: string
          - type: 'null'
          title: Type
        address:
          anyOf:
          - type: string
          - type: 'null'
          description: Formatted address from address components
          title: Address
        state_region:
          anyOf:
          - type: string
          - type: 'null'
          description: State or region
          title: State Region
        country:
          anyOf:
          - $ref: '#/components/schemas/CountryObject'
          - type: 'null'
        timezone:
          anyOf:
          - $ref: '#/components/schemas/TimezoneObject'
          - type: 'null'
        latitude:
          anyOf:
          - type: number
          - type: 'null'
          title: Latitude
        longitude:
          anyOf:
          - type: number
          - type: 'null'
          title: Longitude
        custom_fields:
          anyOf:
          - type: object
          - type: 'null'
          title: Custom Fields
        certificates:
          description: Location certificates [{id, name, is_mandatory}]
          items:
            type: object
          title: Certificates
          type: array
      required:
      - id
      - name
      title: PreJobSiteLocationObject
      type: object
    PreJobSuggestedCertificationObject:
      additionalProperties: false
      description: One certificate auto-assigned to a site by the certificate mapping rules.
      properties:
        id:
          description: Certificate ID
          title: Id
          type: integer
        name:
          description: Certificate name
          title: Name
          type: string
        comment:
          anyOf:
          - type: string
          - type: 'null'
          description: Condition note from the matching rule
          title: Comment
      required:
      - id
      - name
      title: PreJobSuggestedCertificationObject
      type: object
    Error:
      additionalProperties: false
      description: Error response schema.
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          title: Message
          type: string
      required:
      - code
      - message
      title: Error
      type: object
    PreJobSiteCompositeUpdate:
      additionalProperties: false
      description: Partial update body for PUT .../locations/{id}/pre-job (all sections optional).
      properties:
        location_custom_fields:
          anyOf:
          - type: object
          - type: 'null'
          description: Patch for Location.custom_fields; keys must be a subset of the pre-job allow-list (see OpenAPI / terrain and regulations fields).
          title: Location Custom Fields
        customer_location_metadata:
          anyOf:
          - type: object
          - type: 'null'
          description: Patch for CustomerLocation.metadata (access, schedule, certification flags).
          title: Customer Location Metadata
        additional_information:
          anyOf:
          - type: object
          - type: 'null'
          description: Replace ProjectLocation.additional_information
          title: Additional Information
        contacts:
          anyOf:
          - items:
              $ref: '#/components/schemas/PreJobSiteCompositeContactItem'
            type: array
          - type: 'null'
          description: Desired CustomerContact rows for this customer_location (sync semantics in handler)
          title: Contacts
        om_building:
          anyOf:
          - $ref: '#/components/schemas/PreJobSiteCompositeOMBuildingPatch'
          - type: 'null'
          description: Upsert O&M building for this project location, or JSON ``null`` to clear the link (``ProjectLocation.om_building_customer_address`` only; does not delete the ``CustomerAddress`` row)
        file_links:
          anyOf:
          - items:
              $ref: '#/components/schemas/PreJobSiteCompositeFileLinkPatch'
            type: array
          - type: 'null'
          description: Upsert pre-job file links on the customer location
          title: File Links
        remove_file_link_ids:
          anyOf:
          - items:
              type: integer
            type: array
          - type: 'null'
          description: FileEntityLink ids to remove
          title: Remove File Link Ids
        attach_to_project_fallback:
          default: false
          description: If true, enable project-level file-link fallback behavior defined by the handler (including operations when CustomerLocation context is unavailable)
          title: Attach To Project Fallback
          type: boolean
      title: PreJobSiteCompositeUpdate
      type: object
    PreJobPrefillSourceSiteService:
      additionalProperties: false
      description: One service the source project has at the shared site (chip in the picker).
      properties:
        id:
          description: Service id
          title: Id
          type: integer
        code:
          description: Service code
          title: Code
          type: string
        description:
          anyOf:
          - type: string
          - type: 'null'
          description: Service display name
          title: Description
      required:
      - id
      - code
      title: PreJobPrefillSourceSiteService
      type: object
    PreJobSiteOMBuildingObject:
      additionalProperties: false
      description: O&M building address in the pre-job sites response.
      properties:
        id:
          title: Id
          type: integer
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        address_line1:
          title: Address Line1
          type: string
        address_line2:
          anyOf:
          - type: string
          - type: 'null'
          title: Address Line2
        city:
          anyOf:
          - type: string
          - type: 'null'
          title: City
        state_region:
          anyOf:
          - type: string
          - type: 'null'
          title: State Region
        postal_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Postal Code
        country:
          anyOf:
          - $ref: '#/components/schemas/CountryObject'
          - type: 'null'
        timezone:
          anyOf:
          - $ref: '#/components/schemas/TimezoneObject'
          - type: 'null'
        additional_info:
          anyOf:
          - type: string
          - type: 'null'
          title: Additional Info
      required:
      - id
      - address_line1
      title: PreJobSiteOMBuildingObject
      type: object
    CountryObject:
      additionalProperties: false
      description: Nested country object for responses (no timestamps in nested objects).
      properties:
        id:
          description: Country ID
          title: Id
          type: integer
        code:
          description: Country code (ISO 3166-1 alpha-2)
          title: Code
          type: string
        name:
          description: Country name
          title: Name
          type: string
      required:
      - id
      - code
      - name
      title: CountryObject
      type: object
    PreJobPrefillSourceSite:
      additionalProperties: false
      description: One site on a source project, surfaced to the prefill picker. Paginated list row.
      properties:
        id:
          description: ProjectLocation id (use for pre-job composite GET)
          title: Id
          type: integer
        location_id:
          description: Underlying core.Location id
          title: Location Id
          type: integer
        name:
