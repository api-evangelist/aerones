    PreJobSiteCompositeResponse:
      additionalProperties: false
      description: 'Full pre-job payload for one project location (GET .../locations/{id}/pre-job).


        `location_id` in the route is ProjectLocation.id. Includes the CustomerLocation

        row when the requesting customer is linked to the underlying Location.


        ``updated_at`` is the ``ProjectLocation`` row timestamp (same entity as

        ``project_location_id``).'
      properties:
        updated_at:
          description: Last update timestamp
          format: date-time
          title: Updated At
          type: string
        project_location_id:
          title: Project Location Id
          type: integer
        location:
          $ref: '#/components/schemas/PreJobSiteLocationObject'
        customer_location:
          anyOf:
          - $ref: '#/components/schemas/PreJobSiteCompositeCustomerLocationObject'
          - type: 'null'
          description: Customer–location link for this site, if it exists
        contact:
          anyOf:
          - $ref: '#/components/schemas/PreJobSiteContactObject'
          - type: 'null'
          description: Primary contact from ProjectContact
        customer_contacts:
          description: Contacts linked to the customer-location relationship
          items:
            $ref: '#/components/schemas/PreJobSiteContactObject'
          title: Customer Contacts
          type: array
        pre_job_answers:
          items:
            $ref: '#/components/schemas/PreJobSiteAnswerObject'
          title: Pre Job Answers
          type: array
        files:
          items:
            $ref: '#/components/schemas/PreJobSiteFileObject'
          title: Files
          type: array
        additional_information:
          anyOf:
          - type: object
          - type: 'null'
          description: ProjectLocation.additional_information (JSON)
          title: Additional Information
        om_building_address:
          anyOf:
          - $ref: '#/components/schemas/PreJobSiteOMBuildingObject'
          - type: 'null'
          description: O&M building for this project location when ``ProjectLocation.om_building_customer_address`` is set (same customer, type ``OM_BUILDING``). Omitted or null when no address is linked for this site.
        required_certifications:
          description: Per-project required certifications. Primary source is ``CustomerLocation.metadata.required_certifications``; falls back to legacy ``projects.Site.required_certifications`` (matched by site name) when the metadata entry is missing. Mirrors the list endpoint's field for uniform consumption.
          items:
            type: string
          title: Required Certifications
          type: array
        other_certification_details:
          default: ''
          description: Free-text certification details. Primary source is ``CustomerLocation.metadata.other_certification_details``; falls back to legacy ``projects.Site.other_certification_details`` when the metadata entry is missing. Mirrors the list endpoint's field for uniform consumption.
          title: Other Certification Details
          type: string
        suggested_certifications:
          description: Certificates auto-assigned to this site by the certificate mapping rules (``core.certificate_requirement_rule``), resolved from the site's region and its scope-item services. Not removable on the pre-job form.
          items:
            $ref: '#/components/schemas/PreJobSuggestedCertificationObject'
          title: Suggested Certifications
          type: array
      required:
      - updated_at
      - project_location_id
      - location
      title: PreJobSiteCompositeResponse
      type: object
