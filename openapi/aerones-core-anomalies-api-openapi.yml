          anyOf:
          - type: integer
          - type: 'null'
          description: Filter by anomaly component ID
          title: Anomaly Component Id
        required: false
        description: Filter by anomaly component ID
      - in: query
        name: anomaly_type_id
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Filter by anomaly type ID
          title: Anomaly Type Id
        required: false
        description: Filter by anomaly type ID
      - in: query
        name: service_code
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Service code context. Omit for general/cross-service views (all mappings returned). When a non-LER- code is supplied, mappings to LER QC deviation types are excluded. When a LER- code is supplied, all mappings are returned.
          title: Service Code
        required: false
        description: Service code context. Omit for general/cross-service views (all mappings returned). When a non-LER- code is supplied, mappings to LER QC deviation types are excluded. When a LER- code is supplied, all mappings are returned.
      - in: query
        name: paginate
        schema:
          default: true
          description: Enable pagination (false returns all results)
          title: Paginate
          type: boolean
        required: false
        description: Enable pagination (false returns all results)
      - in: query
