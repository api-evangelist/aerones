          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/FileResponse'
                title: Response
                type: array
      description: 'Accepts a JSON object `{"files": [...], "additional_information": {...}}`. Each file includes base64-encoded data; `additional_information` is optional JSON metadata stored on each file link. A legacy bare array `[...]` is still accepted (no metadata).'
