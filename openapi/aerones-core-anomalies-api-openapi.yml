        required: false
        description: Filter by inspection type
      - in: query
        name: service_code
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Service code context. Omit for general/cross-service views (all types returned). When a non-LER- code is supplied, LER QC deviation types are excluded. When a LER- code is supplied, all types are returned.
          title: Service Code
        required: false
        description: Service code context. Omit for general/cross-service views (all types returned). When a non-LER- code is supplied, LER QC deviation types are excluded. When a LER- code is supplied, all types are returned.
      - in: query
        name: paginate
        schema:
          default: true
          description: Enable pagination (false returns all results)
          title: Paginate
          type: boolean
        required: false
        description: Enable pagination (false returns all results)
      - in: query
        name: page
        schema:
          default: 1
          description: Page number
          minimum: 1
          title: Page
          type: integer
        required: false
        description: Page number
      - in: query
        name: page_size
        schema:
          default: 50
          description: Number of items per page
          maximum: 1000
          minimum: 1
          title: Page Size
          type: integer
        required: false
        description: Number of items per page
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AnomalyTypeResponse'
                title: Response
                type: array
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'List anomaly types, filtered by service code context.


        No ``service_code`` → all types returned (general / cross-service view).

        ``service_code`` starts with ``LER-`` → all types returned.

        ``service_code`` present but not ``LER-`` → LER QC deviation types excluded.'
      tags:
      - core.anomalies
      security:
      - APIKeyAuth: []
      - CookieAuth: []
