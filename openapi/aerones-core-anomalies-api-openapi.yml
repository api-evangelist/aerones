                title: Response
                type: array
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'List anomaly component-type mappings, filtered by service code context.


        No ``service_code`` -> all mappings returned (used by unscoped filter views).

        ``service_code`` starts with ``LER-`` -> all mappings returned.

        ``service_code`` present but not ``LER-`` -> mappings to LER QC deviation types

        excluded (used by the component-driven cascade when creating an anomaly).'
      tags:
      - core.anomalies
      security:
      - APIKeyAuth: []
      - CookieAuth: []
