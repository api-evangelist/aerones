openapi: 3.2.0
info:
  title: Operations Hub Projects.bto API
  version: 0.1.1
  description: ''
servers: []
tags:
- name: projects.bto
paths:
  /api/projects/{project_id}/bto:
    get:
      operationId: projects_api_bto_get_project_bto_overview
      summary: Get Project Bto Overview
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectBTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Return basic BTO overview data assembled via manager layer.
      tags:
      - projects.bto
      security:
      - APIKeyAuth: []
      - CookieAuth: []
components:
  schemas:
    ErrorCode:
      description: Error codes for API errors.
      enum:
      - validation
      - server
      - auth
      - unknown
      - external
      - generic
      title: ErrorCode
      type: string
    Error:
      additionalProperties: false
      description: Error response schema.
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          title: Message
          type: string
      required:
      - code
      - message
      title: Error
      type: object
    ProjectBTO:
      additionalProperties: false
      description: Minimal BTO overview response schema, sourced entirely from Core.
      properties:
        project_code:
          anyOf:
          - type: string
          - type: 'null'
          description: core.Project.code
          title: Project Code
        customer:
          anyOf:
          - type: string
          - type: 'null'
          description: core.Project.requesting_customer.display_name
          title: Customer
        project_description:
          anyOf:
          - type: string
          - type: 'null'
          description: core.Project.description
          title: Project Description
        total_units:
          description: Distinct turbines + blade components in core.ProjectScopeItem
          title: Total Units
          type: integer
        units:
          description: Distinct turbines in core.ProjectScopeItem
          title: Units
          type: integer
        project_planned_start_date:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          description: MIN(start_date) across all of the project's planned deployments (core.ProjectPlannedResourceSetItem)
          title: Project Planned Start Date
        project_planned_end_date:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          description: MAX(end_date) across all of the project's planned deployments (core.ProjectPlannedResourceSetItem)
          title: Project Planned End Date
        project_managers:
          anyOf:
          - type: string
          - type: 'null'
          description: core.Project.project_manager full name
          title: Project Managers
        sales_account_executives:
          anyOf:
          - type: string
          - type: 'null'
          description: core.Project.salesperson full name
          title: Sales Account Executives
        junior_project_manager:
          anyOf:
          - type: string
          - type: 'null'
          description: No Core source; no longer populated
          title: Junior Project Manager
        customer_email_reports:
          anyOf:
          - type: string
          - type: 'null'
          description: Comma-separated report-recipient emails from core.ProjectContact (REPORT_RECEPIENT role)
          title: Customer Email Reports
      required:
      - total_units
      - units
      title: ProjectBTO
      type: object
  securitySchemes:
    APIKeyAuth:
      type: http
      scheme: bearer
    CookieAuth:
      type: apiKey
      in: cookie
      name: opshub_prod_sessionid
    AuthBearer:
      type: http
      scheme: bearer
