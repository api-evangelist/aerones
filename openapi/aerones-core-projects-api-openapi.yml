          - type: string
          - type: 'null'
          description: 'Potential project end date: the latest end_date across the project''s planned resource sets (MAX over ProjectPlannedResourceSet items). Distinct from planned_end_date (Wrike). Null when the project has no planned set with an end date.'
          title: Potential End Date
        lps_standard:
          anyOf:
          - $ref: '#/components/schemas/StandardObject'
          - type: 'null'
          description: Selected LPS report template/standard (passed to the reporting engine as lps_standard_id). Null when not yet picked or for non-LPS projects.
        scope_change_auto_accept_enabled:
          default: false
          description: When true, scope change requests on this project are auto-approved and finalized immediately on creation (legacy behaviour). When false, requests enter the QC → Sales → PM approval flow.
          title: Scope Change Auto Accept Enabled
          type: boolean
        location_summary:
          $ref: '#/components/schemas/ProjectLocationSummary'
          description: Linked sites summary; primary follows ascending project_location id
        billing_currency:
          anyOf:
          - type: string
          - type: 'null'
          description: Currency code from the project's billing record (e.g. EUR, USD).
          title: Billing Currency
        warranty_counterpart_project:
          anyOf:
          - $ref: '#/components/schemas/WarrantyCounterpartProjectObject'
          - type: 'null'
          description: 'The project on the other side of the warranty relationship: the source project (on a WARRANTY project) or the warranty project (on a REGULAR project). Null when there is no linkage.'
      required:
      - updated_at
      - id
      - code
      - type
      - location_summary
      title: ProjectResponse
      type: object
    CurrencyIdCodeObject:
      additionalProperties: false
      description: Nested currency object with only id and code (no timestamps).
      properties:
        id:
          title: Id
          type: integer
        code:
          title: Code
          type: string
      required:
      - id
      - code
      title: CurrencyIdCodeObject
      type: object
  securitySchemes:
    APIKeyAuth:
      type: http
      scheme: bearer
    CookieAuth:
      type: apiKey
      in: cookie
      name: opshub_prod_sessionid
    AuthBearer:
      type: http
      scheme: bearer
