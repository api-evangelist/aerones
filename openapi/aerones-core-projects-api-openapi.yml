openapi: 3.2.0
info:
  title: Operations Hub Core.projects API
  version: 0.1.1
  description: ''
servers: []
tags:
- name: core.projects
paths:
  /api/core/v1/projects:
    get:
      operationId: core_endpoints_projects_list_projects
      summary: List Projects
      parameters:
      - in: query
        name: search
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Case-insensitive match on project code or names of linked locations (active project–location links only). SOL-number lookup lives in GET /core/v1/projects/search. Each project is returned at most once.
          title: Search
        required: false
        description: Case-insensitive match on project code or names of linked locations (active project–location links only). SOL-number lookup lives in GET /core/v1/projects/search. Each project is returned at most once.
      - in: query
        name: sort
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Sort by field (prefix with - for descending)
          title: Sort
        required: false
        description: Sort by field (prefix with - for descending)
      - in: query
        name: requesting_customer_id
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Filter by requesting customer ID (ignored when requesting_customer_ids is set)
          title: Requesting Customer Id
        required: false
        description: Filter by requesting customer ID (ignored when requesting_customer_ids is set)
      - in: query
        name: billing_customer_id
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Filter by billing customer ID (ignored when billing_customer_ids is set)
          title: Billing Customer Id
        required: false
        description: Filter by billing customer ID (ignored when billing_customer_ids is set)
      - in: query
        name: vendor_id
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Filter by vendor ID (ignored when vendor_ids is set)
          title: Vendor Id
        required: false
        description: Filter by vendor ID (ignored when vendor_ids is set)
      - in: query
        name: country_id
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Filter by country ID (ignored when country_ids is set)
          title: Country Id
        required: false
        description: Filter by country ID (ignored when country_ids is set)
      - in: query
        name: status_id
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Filter by status ID (ignored when status_ids is set)
          title: Status Id
        required: false
        description: Filter by status ID (ignored when status_ids is set)
      - in: query
        name: project_manager_id
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Filter by project manager ID (ignored when project_manager_ids is set)
          title: Project Manager Id
        required: false
        description: Filter by project manager ID (ignored when project_manager_ids is set)
      - in: query
        name: salesperson_id
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Filter by salesperson ID (ignored when salesperson_ids is set)
          title: Salesperson Id
        required: false
        description: Filter by salesperson ID (ignored when salesperson_ids is set)
      - in: query
        name: type
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by project type (REGULAR, WARRANTY, DEMO, RND, ACADEMY, or INTERNAL)
          title: Type
        required: false
        description: Filter by project type (REGULAR, WARRANTY, DEMO, RND, ACADEMY, or INTERNAL)
      - in: query
        name: types
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Comma-separated project types (OR within), e.g. REGULAR,WARRANTY. Empty/omitted = no type filter. When set, type is ignored.
          title: Types
        required: false
        description: Comma-separated project types (OR within), e.g. REGULAR,WARRANTY. Empty/omitted = no type filter. When set, type is ignored.
      - in: query
        name: status_ids
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Comma-separated status IDs (OR within). Empty/omitted = no status filter. When set, status_id is ignored.
          title: Status Ids
        required: false
        description: Comma-separated status IDs (OR within). Empty/omitted = no status filter. When set, status_id is ignored.
      - in: query
        name: country_ids
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Comma-separated country IDs (OR within). Empty/omitted = no country filter. When set, country_id is ignored.
          title: Country Ids
        required: false
        description: Comma-separated country IDs (OR within). Empty/omitted = no country filter. When set, country_id is ignored.
      - in: query
        name: requesting_customer_ids
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Comma-separated requesting customer IDs (OR within). Empty/omitted = no filter on this facet. When set, requesting_customer_id is ignored.
          title: Requesting Customer Ids
        required: false
        description: Comma-separated requesting customer IDs (OR within). Empty/omitted = no filter on this facet. When set, requesting_customer_id is ignored.
      - in: query
        name: billing_customer_ids
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Comma-separated billing customer IDs (OR within). Empty/omitted = no filter on this facet. When set, billing_customer_id is ignored.
          title: Billing Customer Ids
        required: false
        description: Comma-separated billing customer IDs (OR within). Empty/omitted = no filter on this facet. When set, billing_customer_id is ignored.
      - in: query
        name: vendor_ids
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Comma-separated vendor IDs (OR within). Empty/omitted = no vendor filter. When set, vendor_id is ignored.
          title: Vendor Ids
        required: false
        description: Comma-separated vendor IDs (OR within). Empty/omitted = no vendor filter. When set, vendor_id is ignored.
      - in: query
        name: project_manager_ids
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Comma-separated project manager user IDs (OR within). Empty/omitted = no filter on this facet. When set, project_manager_id is ignored.
          title: Project Manager Ids
        required: false
        description: Comma-separated project manager user IDs (OR within). Empty/omitted = no filter on this facet. When set, project_manager_id is ignored.
      - in: query
        name: salesperson_ids
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Comma-separated salesperson user IDs (OR within). Empty/omitted = no filter on this facet. When set, salesperson_id is ignored.
          title: Salesperson Ids
        required: false
        description: Comma-separated salesperson user IDs (OR within). Empty/omitted = no filter on this facet. When set, salesperson_id is ignored.
      - in: query
        name: scope
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: '''mine'' or ''all'''
          title: Scope
        required: false
        description: '''mine'' or ''all'''
      - in: query
        name: paginate
        schema:
          default: true
          description: Enable pagination (false returns all results)
          title: Paginate
          type: boolean
        required: false
        description: Enable pagination (false returns all results)
      - in: query
        name: page
        schema:
          default: 1
          description: Page number
          minimum: 1
          title: Page
          type: integer
        required: false
        description: Page number
      - in: query
        name: page_size
        schema:
          default: 50
          description: Number of items per page
          maximum: 1000
          minimum: 1
          title: Page Size
          type: integer
        required: false
        description: Number of items per page
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ProjectResponse'
                title: Response
                type: array
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'Return a paginated list of projects, filterable by query parameters.


        Pure technician users see only projects where they are assigned as a resource

        (via workorder assignments or project resource sets). Admin users bypass this scope.'
      tags:
      - core.projects
      security:
      - APIKeyAuth: []
      - CookieAuth: []
    post:
      operationId: core_endpoints_projects_create_project
      summary: Create Project
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
      description: Create a new project. project_builder_id is optional for natively created projects.
      tags:
      - core.projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/core/v1/projects/search:
    get:
      operationId: core_endpoints_projects_search_projects
      summary: Search Projects
      parameters:
      - in: query
        name: search
        schema:
          default: ''
          title: Search
          type: string
        required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ProjectSearchResult'
                title: Response
                type: array
      description: 'Typed search for the global header search box, projects listed first.


        Returns project rows (matched on project code or an active linked location

        name) followed by SOL rows (matched on SOL number), each group capped at 10.

        Matching is token-prefix and unicode-aware: the term must start the value

        or follow a separator, so ``550`` finds ``VEUS-5502`` but not ``VEUS-3550``.

        A blank ``search``, or one shorter than three characters after stripping

        leading separators, returns an empty list.


        Deliberately requires ``regular_user`` only — the same key that unlocks

        ``get_project`` — so anyone who can search a project can also open it

        (``technician_user`` alone can list but not open, the mismatch behind the

        old "visible in the table, 403 on open" bug). Technician-group members

        holding ``regular_user`` still only see their assigned projects, matching

        the project list scope.'
      tags:
      - core.projects
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/core/v1/projects/{project_id}:
    get:
      operationId: core_endpoints_projects_get_project
      summary: Get Project
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
      description: Retrieve a single project by its numeric ID or UUID.
      tags:
      - core.projects
      security:
      - APIKeyAuth: []
      - CookieAuth: []
    patch:
      operationId: core_endpoints_projects_update_project
      summary: Update Project
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
      description: Partially update a project. The project_builder_id link cannot be removed.
      tags:
      - core.projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdate'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
    delete:
      operationId: core_endpoints_projects_delete_project
      summary: Delete Project
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
      description: Soft-delete a project, marking it as inactive.
      tags:
      - core.projects
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/core/v1/projects/{project_id}/overview:
    get:
      operationId: core_endpoints_projects_get_project_overview
      summary: Get Project Overview
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectOverviewResponse'
      description: 'Decoupled project overview card (meta, scope, deployments, dates).


        Fields already on the base project response (code, country, PM, salesperson,

        status, LPS standard, description, customers) are intentionally omitted —

        read those from ``GET /core/v1/projects/{id}``.'
      tags:
      - core.projects
      security:
      - APIKeyAuth: []
      - CookieAuth: []
    patch:
      operationId: core_endpoints_projects_update_project_overview
      summary: Update Project Overview
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectOverviewResponse'
      description: 'Update overview fields across Core (description, LPS) and legacy tables.


        Does not reuse the legacy ``update_overview_info``; writes each backing

        table directly via ORM in a single transaction.'
      tags:
      - core.projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectOverviewEdit'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/core/v1/projects/{project_id}/overview/financials:
    get:
      operationId: core_endpoints_projects_get_project_overview_financials
      summary: Get Project Overview Financials
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectOverviewFinancialsResponse'
      description: Decoupled project financial overview (CO/charged/PO values, offer status).
      tags:
      - core.projects
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/core/v1/projects/{project_id}/status-history:
    get:
      operationId: core_endpoints_projects_get_project_status_history
      summary: Get Project Status History
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ProjectStatusHistoryEntry'
                title: Response
                type: array
      description: 'Chronological history of a project''s status transitions (oldest first).


        Each entry records the status moved from/to, the trigger (``change_reason``),

        an optional note, when it happened, and who caused it. History accrues from

        when tracking was introduced — projects with no recorded transitions yet

        return an empty list.'
      tags:
      - core.projects
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/core/v1/projects/{project_id}/validate:
    get:
      operationId: core_endpoints_projects_validate_project
      summary: Validate Project
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectValidateResponse'
      description: Validate project configuration and return a list of warning codes.
      tags:
      - core.projects
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/core/v1/projects/{project_id}/refresh-google-drive:
    post:
      operationId: core_endpoints_projects_refresh_project_google_drive
      summary: Refresh Project Google Drive
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
      description: 'Provision Google Drive folders for a project if the ROOT link is not yet set.


        Skips silently when the ROOT link already exists. Uses the Pipedrive deal URL

        when available, then falls back to auto-discovery if it is missing or invalid.'
      tags:
      - core.projects
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/core/v1/projects/{project_id}/complete:
    post:
      operationId: core_endpoints_projects_mark_project_completed
      summary: Mark Project Completed
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
      description: 'Manually transition a project from Closure to Completed.


        The cascade only advances projects up to Closure (all SOLs Completed or

        Cancelled). Moving to Completed is an explicit close-out action — there

        is no automatic trigger.'
      tags:
      - core.projects
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/core/v1/projects/{project_id}/status-override:
    post:
      operationId: core_endpoints_projects_override_project_status
      summary: Override Project Status
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
      description: 'Manually set a project''s status, bypassing the stage gates.


        Privileged override gated behind the ``force_complete_project`` permission.

        Any status except Cancelled can be set, in either direction, including

        reopening a Completed project. Rules, audit trail, and the deliberate

        no-side-effects contract live in ``ProjectManager.override_status``. The

        automatic status rules (SOL cascade, nightly reconciler) stay active and

        may later move the status again.'
      tags:
      - core.projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectStatusOverride'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/core/v1/projects/{project_id}/pre-job-received:
    put:
      operationId: core_endpoints_projects_update_project_pre_job_received
      summary: Update Project Pre Job Received
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
      description: 'Set or clear the customer pre-job questionnaire ''received'' timestamp.


        This is the Core replacement for the legacy ``PUT /projects/{id}/user-status``

        pre-job workflow path. Only the *null-ness* of ``payload.pre_job_received_at``

        is read — it signals intent; the timestamp itself is stamped **server-side**

        (``timezone.now()``) to stay robust against client clock skew:


        - ``null -> non-null`` (customer **submit**): stamps the timestamp, sends the

        pre-job submission notification, and re-runs the Pipedrive status cascade

        (advancing the project to Planning when probability is 100).

        - ``non-null -> null`` (staff **reopen**): clears the timestamp; no email,

        no cascade.

        - already-received re-submit: keeps the existing timestamp; no side effects.'
      tags:
      - core.projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectPreJobReceivedUpdate'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
components:
  schemas:
    ErrorCode:
      description: Error codes for API errors.
      enum:
      - validation
      - server
      - auth
      - unknown
      - external
      - generic
      title: ErrorCode
      type: string
    ProjectLocationSummary:
      additionalProperties: false
      description: Summary of sites (locations) linked to a project for list/detail payloads.
      properties:
        primary_name:
          anyOf:
          - type: string
          - type: 'null'
          description: Display name of the first linked site when ordered by project_location id ascending
          title: Primary Name
        total_count:
          description: Number of active project–site links
          minimum: 0
          title: Total Count
          type: integer
        all_names:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: All site names when total_count > 1; omitted or null when absent or unnecessary
          title: All Names
      required:
      - total_count
      title: ProjectLocationSummary
      type: object
    ProjectOverviewReportRecipient:
      additionalProperties: false
      description: Report recipient (customer contact) shown on the project overview.
      properties:
        name:
          anyOf:
          - type: string
          - type: 'null'
          description: Contact name
          title: Name
        email:
          anyOf:
          - type: string
          - type: 'null'
          description: Contact email
          title: Email
      title: ProjectOverviewReportRecipient
      type: object
    UserObject:
      additionalProperties: false
      description: Nested user object for responses (no timestamps).
      properties:
        id:
          title: Id
          type: integer
        username:
          title: Username
          type: string
        email:
          anyOf:
          - type: string
          - type: 'null'
          title: Email
        first_name:
          anyOf:
          - type: string
          - type: 'null'
          title: First Name
        last_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Name
      required:
      - id
      - username
      title: UserObject
      type: object
    CustomerObject:
      additionalProperties: false
      description: Nested customer object for responses (no timestamps).
      properties:
        id:
          title: Id
          type: integer
        number:
          anyOf:
          - type: string
          - type: 'null'
          title: Number
        display_name:
          title: Display Name
          type: string
        netsuite_customer_id:
          anyOf:
          - type: integer
          - type: 'null'
          description: NetSuite customer ID
          title: Netsuite Customer Id
        currency:
          anyOf:
          - $ref: '#/components/schemas/CurrencyIdCodeObject'
          - type: 'null'
          description: Customer currency (id and code only)
      required:
      - id
      - display_name
      title: CustomerObject
      type: object
    ProjectCreate:
      additionalProperties: false
      description: Schema for creating a Project.
      properties:
        code:
          description: Unique project code
          minLength: 1
          title: Code
          type: string
        type:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Project type: REGULAR, DEMO, RND, or ACADEMY. Defaults to REGULAR when omitted. WARRANTY and INTERNAL cannot be set via the API.'
          title: Type
        description:
          anyOf:
          - type: string
          - type: 'null'
          description: Project description
          title: Description
        requesting_customer_id:
          anyOf:
          - type: integer
          - type: 'null'
          description: Requesting customer ID
          title: Requesting Customer Id
        billing_customer_id:
          anyOf:
          - type: integer
          - type: 'null'
          description: Billing customer ID
          title: Billing Customer Id
        vendor_id:
          anyOf:
          - type: integer
          - type: 'null'
          description: Vendor ID
          title: Vendor Id
        country_id:
          anyOf:
          - type: integer
          - type: 'null'
          description: Country ID
          title: Country Id
        timezone_id:
          anyOf:
          - type: integer
          - type: 'null'
          description: Timezone ID
          title: Timezone Id
        status_id:
          anyOf:
          - type: integer
          - type: 'null'
          description: Project status ID
          title: Status Id
        project_manager_id:
          anyOf:
          - type: integer
          - type: 'null'
          description: Project manager user ID
          title: Project Manager Id
        salesperson_id:
          anyOf:
          - type: integer
          - type: 'null'
          description: Salesperson user ID
          title: Salesperson Id
        pipedrive_id:
          anyOf:
          - type: integer
          - type: 'null'
          description: Pipedrive deal ID
          title: Pipedrive Id
        pipedrive_probability:
          anyOf:
          - maximum: 100
            minimum: 0
            type: integer
          - type: 'null'
          description: 'Deal probability (0-100). Sending it here is a manual override, exactly as it is on PATCH: the value is marked sticky so the Pipedrive deals-refresh poll no longer overwrites it. Unlike PATCH this does not re-run the status cascade, because a project that has just been created has no internally-approved commercial offer and so cannot advance past Upcoming whatever the probability says. Omit it to leave Pipedrive in control.'
          title: Pipedrive Probability
        project_builder_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          description: Project builder project UUID (legacy) - optional for natively created projects
          title: Project Builder Id
        planned_start_date:
          anyOf:
          - type: string
          - type: 'null'
          description: Planned project start date
          title: Planned Start Date
        planned_end_date:
          anyOf:
          - type: string
          - type: 'null'
