  /api/projects/{project_id}/dispatch/admin-workorder:
    post:
      operationId: dispatch_api_board_workorders_create_admin_workorder
      summary: Create an ADMIN workorder assigned to a single technician
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
