openapi: 3.2.0
info:
  title: Operations Hub Dispatch.board Workorders API
  version: 0.1.1
  description: ''
servers: []
tags:
- name: dispatch.board-workorders
paths:
  /api/dispatch/v1/projects/{project_id}/dispatch/assign:
    post:
      operationId: assign_workorder_v1
      summary: Assign workorder to resources
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
      description: 'Assign a workorder to a resource set and set planned datetimes.


        Finds the ProjectResourceSet that contains the given resource_ids,

        ensures a WorkorderResourceSet links the workorder to it, and sets

        Workorder.planned_start_datetime / planned_end_datetime.'
      tags:
      - dispatch.board-workorders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignWorkorderPayload'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/dispatch/v1/projects/{project_id}/dispatch/assign-bulk:
    post:
      operationId: assign_workorders_bulk_v1
      summary: Bulk assign workorders to resources
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
      description: Assign multiple workorders to resources and set planned datetimes.
      tags:
      - dispatch.board-workorders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkAssignWorkordersPayload'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/dispatch/v1/projects/{project_id}/dispatch/unassign:
    post:
      operationId: unassign_workorder_v1
      summary: Unassign workorder from resources
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
      description: Remove all resource assignments and clear planned datetimes for a workorder.
      tags:
      - dispatch.board-workorders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnassignWorkorderPayload'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/dispatch/v1/projects/{project_id}/dispatch/workorders/{workorder_id}:
    delete:
      operationId: delete_admin_workorder_v1
      summary: Soft-delete an administrative workorder
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: integer
        required: true
      - in: path
        name: workorder_id
        schema:
          title: Workorder Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
      description: 'Soft-delete a dispatcher-created ADMIN workorder (and its dispatch links).


        Only administrative work (ADMIN/OFFICE) may be deleted from the board — field

        service work is driven by the service order and must not be removed here.'
      tags:
      - dispatch.board-workorders
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/dispatch/v1/projects/{project_id}/dispatch/admin-workorder/{workorder_id}:
    patch:
      operationId: update_admin_workorder_v1
      summary: Edit an existing administrative workorder's name/duration
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: integer
        required: true
      - in: path
        name: workorder_id
        schema:
          title: Workorder Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateAdminWorkorderResponse'
      description: 'DISP-2892: the drawer''s edit-mode pencil icon for an ADMIN workorder.


        Name and duration only -- assignee is fixed after creation (no endpoint

        for it exists), and activities are edited individually via

        ``update_workorder_activity`` below.'
      tags:
      - dispatch.board-workorders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAdminWorkorderPayload'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/dispatch/v1/projects/{project_id}/dispatch/workorders/{workorder_id}/turbine:
    post:
      operationId: set_workorder_turbine_v1
      summary: Set the turbine for a scope-dispatched workorder
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: integer
        required: true
      - in: path
        name: workorder_id
        schema:
          title: Workorder Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
      description: 'Bind a turbine to a scope-dispatched (DISP-2259) workorder + its SOL,

        once the crew knows which asset they''re actually working on. No-op if

        already set to the same turbine; rejects overwriting a different one.'
      tags:
      - dispatch.board-workorders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetWorkorderTurbinePayload'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/dispatch/v1/projects/{project_id}/dispatch/admin-workorder:
    post:
      operationId: create_admin_workorder_v1
      summary: Create an ADMIN workorder assigned to a single technician
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAdminWorkorderResponse'
      description: 'Create a standalone ADMIN workorder pinned to one individual technician.


        The workorder is scoped to ``project_id`` and inherits the project''s

        ``requesting_customer`` (so it is visible under the customer-scoped RLS

        policy and returned by ``board-data``). It is created with

        ``type=ADMIN`` / ``status=NOT_STARTED`` via the canonical

        ``WorkorderManager.gql_create`` path, then linked to the project resource

        set the technician belongs to and pinned to that individual — reusing the

        same assignment machinery as ``/assign`` so the board routes it into the

        member''s person lane.


        The manager creates, links, and pins the workorder inside one

        transaction: if the resource-set or assignee step fails, the workorder

        must not be left committed without its dispatch links (mirrors the

        atomic pattern in ``_assign_workorders_bulk_sync``).'
      tags:
      - dispatch.board-workorders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdminWorkorderPayload'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/dispatch/v1/projects/{project_id}/dispatch/workorders/{workorder_id}/activities:
    post:
      operationId: add_workorder_activity_v1
      summary: Add an activity to an existing administrative workorder
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: integer
        required: true
      - in: path
        name: workorder_id
        schema:
          title: Workorder Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddWorkorderActivityResponse'
      description: 'Add one WorkorderActivity to an already-created ADMIN workorder

        (DISP-2379) -- lets a dispatcher extend scope after creation, the same

        way activities picked at create time work.'
      tags:
      - dispatch.board-workorders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminActivityInput'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/dispatch/v1/projects/{project_id}/dispatch/workorders/{workorder_id}/activities/{activity_id}:
    patch:
      operationId: update_workorder_activity_v1
      summary: Edit an activity on an existing administrative workorder
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: integer
        required: true
      - in: path
        name: workorder_id
        schema:
          title: Workorder Id
          type: integer
        required: true
      - in: path
        name: activity_id
        schema:
          title: Activity Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateWorkorderActivityResponse'
      description: 'DISP-2892: the drawer''s edit-mode counterpart to

        ``add_workorder_activity`` -- same remaining-budget rule, but excluding

        this activity''s own current duration from the "other activities" total.'
      tags:
      - dispatch.board-workorders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkorderActivityPayload'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
    delete:
      operationId: delete_workorder_activity_v1
      summary: Remove an activity from an existing administrative workorder
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: integer
        required: true
      - in: path
        name: workorder_id
        schema:
          title: Workorder Id
          type: integer
        required: true
      - in: path
        name: activity_id
        schema:
          title: Activity Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
      description: 'Soft-delete one WorkorderActivity from an ADMIN workorder (FEAT-2554

        follow-up) -- the undo of ``add_workorder_activity`` above.


        Refuses to remove the workorder''s last remaining activity: that would

        recreate the exact "inert on mobile" state DISP-2379 exists to prevent.'
      tags:
      - dispatch.board-workorders
      security:
      - APIKeyAuth: []
      - CookieAuth: []
