components:
  schemas:
    UpdateAdminWorkorderPayload:
      additionalProperties: false
      description: 'Payload for editing an existing ADMIN workorder''s name/duration

        (DISP-2892).


        ``duration_minutes`` only moves ``planned_end_datetime`` --

        ``planned_start_datetime`` (and therefore the board''s lane placement)

        never changes from an edit; that''s what "Move to next day" (DISP-3391)

        is for. Assignee/activities are edited through their own endpoints.'
      properties:
        name:
          title: Name
          type: string
        duration_minutes:
          minimum: 5
          title: Duration Minutes
          type: integer
      required:
      - name
      - duration_minutes
      title: UpdateAdminWorkorderPayload
      type: object
    CreateAdminWorkorderPayload:
      additionalProperties: false
      description: 'Payload for creating an ADMIN workorder pinned to a single technician.


        An admin workorder is standalone work (no service order line) scoped to the

        currently-open project: it inherits the project''s ``requesting_customer`` so

        the row is visible under the customer-scoped RLS policy and returned by the

        project ``board-data`` query. ``assignee_resource_id`` pins the WO to one

        individual so the board routes it into that member''s person lane; the

        resource must belong to an active project resource set of this project.


        ``activities`` requires at least one entry -- AeroTask''s start/finish/

        update flow acts on WorkorderActivity rows, not bare workorders, so an

        ADMIN WO with none is inert on mobile (DISP-2379). FEAT-2554 dropped the

        free-text whole-WO ``description`` in favour of the Activities section

        (which now always carries real, timed activities) and caps their combined

        duration at the workorder''s own -- both enforced below.


        ``auto_carry_over`` is opt-in (DISP-3391): while the workorder is

        incomplete, the hourly carry-over task keeps shifting its planned window

        onto the site''s current day.'
      properties:
        name:
          title: Name
          type: string
        assignee_resource_id:
          title: Assignee Resource Id
          type: integer
        planned_start_datetime:
          format: date-time
          title: Planned Start Datetime
          type: string
        planned_end_datetime:
          format: date-time
          title: Planned End Datetime
          type: string
        activities:
          items:
            $ref: '#/components/schemas/AdminActivityInput'
          title: Activities
          type: array
        auto_carry_over:
          default: false
          title: Auto Carry Over
          type: boolean
      required:
      - name
      - assignee_resource_id
      - planned_start_datetime
      - planned_end_datetime
      - activities
      title: CreateAdminWorkorderPayload
      type: object
    UpdateAdminWorkorderResponse:
      additionalProperties: false
      properties:
        id:
          title: Id
          type: integer
        name:
          title: Name
          type: string
        planned_start_datetime:
          format: date-time
          title: Planned Start Datetime
          type: string
        planned_end_datetime:
          format: date-time
          title: Planned End Datetime
          type: string
      required:
      - id
      - name
      - planned_start_datetime
      - planned_end_datetime
      title: UpdateAdminWorkorderResponse
      type: object
    AssignWorkorderPayload:
      additionalProperties: false
      description: 'Payload for assigning a workorder to resources on a datetime.


        ``assignee_resource_id`` optionally pins the workorder to a single

        individual within the set (ADMIN WOs only); recorded as a

        ``WorkorderResource`` row and must be one of ``resource_ids``.'
      properties:
        workorder_id:
          title: Workorder Id
          type: integer
        resource_ids:
          items:
            type: integer
          title: Resource Ids
          type: array
        planned_start_datetime:
          format: date-time
          title: Planned Start Datetime
          type: string
        planned_end_datetime:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Planned End Datetime
        assignee_resource_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Assignee Resource Id
      required:
      - workorder_id
      - resource_ids
      - planned_start_datetime
      title: AssignWorkorderPayload
      type: object
    UpdateWorkorderActivityPayload:
      additionalProperties: false
      description: 'Payload for editing one activity on an existing ADMIN workorder

        (DISP-2892) -- name, duration, and the image-required toggle.'
      properties:
        description:
          title: Description
          type: string
        estimated_duration_minutes:
          anyOf:
          - minimum: 1
            type: integer
          - type: 'null'
          title: Estimated Duration Minutes
        image_required:
          default: false
          title: Image Required
