      description: 'Soft-delete one WorkorderActivity from an ADMIN workorder (FEAT-2554

        follow-up) -- the undo of ``add_workorder_activity`` above.


        Refuses to remove the workorder''s last remaining activity: that would

        recreate the exact "inert on mobile" state DISP-2379 exists to prevent.'
      tags:
