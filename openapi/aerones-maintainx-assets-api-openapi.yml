openapi: 3.2.0
info:
  title: Operations Hub Maintainx.assets API
  version: 0.1.1
  description: ''
servers: []
tags:
- name: maintainx.assets
paths:
  /api/maintainx/v1/assets:
    get:
      operationId: list_maintainx_assets
      summary: List MaintainX Assets
      parameters:
      - in: query
        name: sort
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Sort by field (prefix with - for descending)
          title: Sort
        required: false
        description: Sort by field (prefix with - for descending)
      - in: query
        name: external_id
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Filter by MaintainX asset ID
          title: External Id
        required: false
        description: Filter by MaintainX asset ID
      - in: query
        name: external_organization_id
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Filter by MaintainX organization ID
          title: External Organization Id
        required: false
        description: Filter by MaintainX organization ID
      - in: query
        name: robot_set_id
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Filter by linked core RobotSet ID
          title: Robot Set Id
        required: false
        description: Filter by linked core RobotSet ID
      - in: query
        name: paginate
        schema:
          default: true
          description: Enable pagination (false returns all results)
          title: Paginate
          type: boolean
        required: false
        description: Enable pagination (false returns all results)
      - in: query
        name: page
        schema:
          default: 1
          description: Page number
          minimum: 1
          title: Page
          type: integer
        required: false
        description: Page number
      - in: query
        name: page_size
        schema:
          default: 50
          description: Number of items per page
          maximum: 1000
          minimum: 1
          title: Page Size
          type: integer
        required: false
        description: Number of items per page
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AssetResponse'
                title: Response
                type: array
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: List all items with optional search, sorting, and filtering.
      tags:
      - maintainx.assets
      security:
      - APIKeyAuth: []
      - CookieAuth: []
components:
  schemas:
    Error:
      additionalProperties: false
      description: Error response schema.
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          title: Message
          type: string
      required:
      - code
      - message
      title: Error
      type: object
    AssetResponse:
      additionalProperties: false
      description: Row in the MaintainX assets list endpoint.
      properties:
        updated_at:
          description: Last update timestamp
          format: date-time
          title: Updated At
          type: string
        id:
          description: Internal Asset PK
          title: Id
          type: integer
        external_id:
          description: MaintainX asset ID
          title: External Id
          type: integer
        external_organization_id:
          description: MaintainX organization ID
          title: External Organization Id
          type: integer
        robot_set_id:
          description: Linked core RobotSet ID
          title: Robot Set Id
          type: integer
      required:
      - updated_at
      - id
      - external_id
      - external_organization_id
      - robot_set_id
      title: AssetResponse
      type: object
    ErrorCode:
      description: Error codes for API errors.
      enum:
      - validation
      - server
      - auth
      - unknown
      - external
      - generic
      title: ErrorCode
      type: string
  securitySchemes:
    APIKeyAuth:
      type: http
      scheme: bearer
    CookieAuth:
      type: apiKey
      in: cookie
      name: opshub_prod_sessionid
    AuthBearer:
      type: http
      scheme: bearer
