openapi: 3.2.0
info:
  title: Operations Hub Core.manufacturers API
  version: 0.1.1
  description: ''
servers: []
tags:
- name: core.manufacturers
paths:
  /api/core/v1/manufacturers:
    get:
      operationId: list_manufacturers
      summary: List Manufacturers
      parameters:
      - in: query
        name: search
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Search by name (case-insensitive)
          title: Search
        required: false
        description: Search by name (case-insensitive)
      - in: query
        name: sort
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Sort by field (prefix with - for descending)
          title: Sort
        required: false
        description: Sort by field (prefix with - for descending)
      - in: query
        name: has_models
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Filter manufacturers that have at least one turbine or component model
          title: Has Models
        required: false
        description: Filter manufacturers that have at least one turbine or component model
      - in: query
        name: paginate
        schema:
          default: true
          description: Enable pagination (false returns all results)
          title: Paginate
          type: boolean
        required: false
        description: Enable pagination (false returns all results)
      - in: query
        name: page
        schema:
          default: 1
          description: Page number
          minimum: 1
          title: Page
          type: integer
        required: false
        description: Page number
      - in: query
        name: page_size
        schema:
          default: 50
          description: Number of items per page
          maximum: 1000
          minimum: 1
          title: Page Size
          type: integer
        required: false
        description: Number of items per page
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ManufacturerResponse'
                title: Response
                type: array
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: List all items with optional search, sorting, and pagination.
      tags:
      - core.manufacturers
      security:
      - APIKeyAuth: []
      - CookieAuth: []
    post:
      operationId: create_manufacturer
      summary: Create Manufacturer
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManufacturerResponse'
      description: Create a new item.
      tags:
      - core.manufacturers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManufacturerCreate'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/core/v1/manufacturers/{id}:
    get:
      operationId: get_manufacturer
      summary: Get Manufacturer
      parameters:
      - in: path
        name: id
        schema:
          title: Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManufacturerResponse'
      description: Get a single item by ID.
      tags:
      - core.manufacturers
      security:
      - APIKeyAuth: []
      - CookieAuth: []
    patch:
      operationId: update_manufacturer
      summary: Update Manufacturer
      parameters:
      - in: path
        name: id
        schema:
          title: Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManufacturerResponse'
      description: Update an item.
      tags:
      - core.manufacturers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManufacturerUpdate'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
    delete:
      operationId: delete_manufacturer
      summary: Delete Manufacturer
      parameters:
      - in: path
        name: id
        schema:
          title: Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
      description: Soft delete an item.
      tags:
      - core.manufacturers
      security:
      - APIKeyAuth: []
      - CookieAuth: []
components:
  schemas:
    ErrorCode:
      description: Error codes for API errors.
      enum:
      - validation
      - server
      - auth
      - unknown
      - external
      - generic
      title: ErrorCode
      type: string
    ManufacturerCreate:
      additionalProperties: false
      description: Schema for creating a Manufacturer.
      properties:
        name:
          description: Entity name
          minLength: 1
          title: Name
          type: string
      required:
      - name
      title: ManufacturerCreate
      type: object
    ManufacturerResponse:
      additionalProperties: false
      description: Schema for Manufacturer response.
      properties:
        updated_at:
          description: Last update timestamp
          format: date-time
          title: Updated At
          type: string
        id:
          description: Entity ID
          title: Id
          type: integer
        name:
          description: Entity name
          title: Name
          type: string
      required:
      - updated_at
      - id
      - name
      title: ManufacturerResponse
      type: object
    Error:
      additionalProperties: false
      description: Error response schema.
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          title: Message
          type: string
      required:
      - code
      - message
      title: Error
      type: object
    ManufacturerUpdate:
      additionalProperties: false
      description: Schema for updating a Manufacturer.
      properties:
        name:
          description: Entity name
          minLength: 1
          title: Name
          type: string
      title: ManufacturerUpdate
      type: object
    Success:
      additionalProperties: false
      description: 'Schema returned for successful operations.


        The `success` field is always ``true`` in this schema. Failed operations are

        represented by the :class:`Error` schema instead, so a ``false`` value does

        not occur in practice. The field is included for consistency across responses

        and to make the contract explicit for clients.'
      properties:
        success:
          default: true
          description: Always true for this schema. Errors are represented by a separate Error schema, so false is never returned.
          title: Success
          type: boolean
      title: Success
      type: object
  securitySchemes:
    APIKeyAuth:
      type: http
      scheme: bearer
    CookieAuth:
      type: apiKey
      in: cookie
      name: opshub_prod_sessionid
    AuthBearer:
      type: http
      scheme: bearer
