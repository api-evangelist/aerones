openapi: 3.2.0
info:
  title: Operations Hub Projects.set Requests API
  version: 0.1.1
  description: ''
servers: []
tags:
- name: projects.set-requests
paths:
  /api/projects/{project_id}/set-requests/set-options:
    get:
      operationId: projects_api_set_request_get_set_options
      summary: Get Set Options
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  type: object
                title: Response
                type: array
      description: Robot sets pickable for a new Set Request.
      tags:
      - projects.set-requests
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/set-requests/item-categories:
    get:
      operationId: projects_api_set_request_list_set_request_item_categories
      summary: List Set Request Item Categories
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemCategoryListResponse'
      description: The ItemCategory lookup the FE renders as the line-category dropdown.
      tags:
      - projects.set-requests
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/set-requests/items:
    get:
      operationId: projects_api_set_request_list_set_request_items
      summary: List Set Request Items
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: query
        name: category_id
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Category Id
        required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemListResponse'
      description: Catalog of selectable descriptions for the item dropdowns.
      tags:
      - projects.set-requests
      security:
      - APIKeyAuth: []
      - CookieAuth: []
    post:
      operationId: projects_api_set_request_create_set_request_item
      summary: Create Set Request Item
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemResponse'
      description: Add a user-defined entry to the shared item catalog (idempotent on duplicate).
      tags:
      - projects.set-requests
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemCreate'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/set-requests/items/{item_id}:
    patch:
      operationId: projects_api_set_request_update_set_request_item
      summary: Update Set Request Item
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: item_id
        schema:
          title: Item Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemResponse'
      description: Rename a catalog entry. Cascades the rename to existing SR rows.
      tags:
      - projects.set-requests
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemUpdate'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
    delete:
      operationId: projects_api_set_request_delete_set_request_item
      summary: Delete Set Request Item
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: item_id
        schema:
          title: Item Id
          type: integer
        required: true
      responses:
        '204':
          description: No Content
      description: Soft-delete a catalog entry. Existing SR rows keep their text.
      tags:
      - projects.set-requests
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/set-requests/offer-pairs:
    get:
      operationId: projects_api_set_request_get_offer_pairs
      summary: Get Offer Pairs
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferPairsResponse'
      description: 'Every (location, service) pair on the latest commercial offer.


        Each pair becomes one row in the SR create modal''s combined picker.'
      tags:
      - projects.set-requests
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/set-requests/inherit-candidates:
    get:
      operationId: projects_api_set_request_get_inherit_candidates
      summary: Get Inherit Candidates
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: query
        name: robot_set_id
        schema:
          title: Robot Set Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SetRequestInheritCandidate'
                title: Response
                type: array
      description: 'Prior PICKED_UP SRs for this robot set, across all projects.


        ``project_id`` anchors routing/permissions only — a set''s last picked-up

        SR usually lives on the project it just left.'
      tags:
      - projects.set-requests
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/set-requests/prefill-options:
    get:
      operationId: projects_api_set_request_get_prefill_options
      summary: Get Prefill Options
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: query
        name: pprs_id
        schema:
          title: Pprs Id
          type: integer
        required: true
      - in: query
        name: service_id
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Service Id
        required: false
      - in: query
        name: region
        schema:
          anyOf:
          - enum:
            - EU
            - NA
            type: string
          - type: 'null'
          title: Region
        required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetRequestPrefillOptionsResponse'
      description: Suggested consumables + summary for the create modal.
      tags:
      - projects.set-requests
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - items:
                  type: integer
                type: array
              - type: 'null'
              title: Service Ids
        required: false
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/set-requests:
    post:
      operationId: projects_api_set_request_create_set_request
      summary: Create Set Request
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetRequestResponse'
      description: Create a DRAFT Set Request bound to a planning PPRS.
      tags:
      - projects.set-requests
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetRequestCreate'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
    get:
      operationId: projects_api_set_request_list_set_requests
      summary: List Set Requests
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: query
        name: paginate
        schema:
          default: true
          description: Enable pagination (false returns all results)
          title: Paginate
          type: boolean
        required: false
        description: Enable pagination (false returns all results)
      - in: query
        name: page
        schema:
          default: 1
          description: Page number
          minimum: 1
          title: Page
          type: integer
        required: false
        description: Page number
      - in: query
        name: page_size
        schema:
          default: 50
          description: Number of items per page
          maximum: 1000
          minimum: 1
          title: Page Size
          type: integer
        required: false
        description: Number of items per page
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SetRequestResponse'
                title: Response
                type: array
      tags:
      - projects.set-requests
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/set-requests/{set_request_id}:
    get:
      operationId: projects_api_set_request_get_set_request
      summary: Get Set Request
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: set_request_id
        schema:
          title: Set Request Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetRequestResponse'
      tags:
      - projects.set-requests
      security:
      - APIKeyAuth: []
      - CookieAuth: []
    patch:
      operationId: projects_api_set_request_update_set_request
      summary: Update Set Request
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: set_request_id
        schema:
          title: Set Request Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetRequestResponse'
      description: 'Edit a Set Request.


        Field-aware status gate: notes / kind / items are editable only in

        DRAFT / SUBMITTED / REJECTED, while the mobilization date

        (``needed_by_date``) stays editable in every live status up to

        mobilization — all except the terminal PICKED_UP / CANCELLED.'
      tags:
      - projects.set-requests
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetRequestUpdate'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/set-requests/{set_request_id}/events:
    get:
      operationId: projects_api_set_request_list_set_request_events
      summary: List Set Request Events
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: set_request_id
        schema:
          title: Set Request Id
          type: integer
        required: true
      - in: query
        name: paginate
        schema:
          default: true
          description: Enable pagination (false returns all results)
          title: Paginate
          type: boolean
        required: false
        description: Enable pagination (false returns all results)
      - in: query
        name: page
        schema:
          default: 1
          description: Page number
          minimum: 1
          title: Page
          type: integer
        required: false
        description: Page number
      - in: query
        name: page_size
        schema:
          default: 50
          description: Number of items per page
          maximum: 1000
          minimum: 1
          title: Page Size
          type: integer
        required: false
        description: Number of items per page
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SetRequestEventResponse'
                title: Response
                type: array
      description: Merged status-change + activity timeline.
      tags:
      - projects.set-requests
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/set-requests/{set_request_id}/notes:
    post:
      operationId: projects_api_set_request_create_set_request_note
      summary: Create Set Request Note
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: set_request_id
        schema:
          title: Set Request Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetRequestEventResponse'
      description: Append a free-form note (with optional @-mentions) to a SR's timeline.
      tags:
      - projects.set-requests
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetRequestNoteCreate'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/set-requests/{set_request_id}/mention-candidates:
    get:
      operationId: projects_api_set_request_list_set_request_mention_candidates
      summary: List Set Request Mention Candidates
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: set_request_id
        schema:
          title: Set Request Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MentionCandidateListResponse'
      description: Users available for @-mention on a SR note.
      tags:
      - projects.set-requests
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/set-requests/{set_request_id}/submit:
    post:
      operationId: projects_api_set_request_submit_set_request
      summary: Submit Set Request
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: set_request_id
        schema:
          title: Set Request Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetRequestResponse'
      description: DRAFT -> SUBMITTED.
      tags:
      - projects.set-requests
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/set-requests/{set_request_id}/approve-current:
    post:
      operationId: projects_api_set_request_approve_current_set
      summary: Approve Current Set
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: set_request_id
        schema:
          title: Set Request Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetRequestResponse'
      description: Planner approves the currently-bound robot set.
      tags:
      - projects.set-requests
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetRequestApproveCurrent'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/set-requests/{set_request_id}/change-set-and-approve:
    post:
      operationId: projects_api_set_request_change_set_and_approve
      summary: Change Set And Approve
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: set_request_id
        schema:
          title: Set Request Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetRequestResponse'
      description: Planner swaps the ROBOT PPRSI to a different robot set and approves.
      tags:
      - projects.set-requests
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetRequestChangeAndApprove'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/set-requests/{set_request_id}/reject:
    post:
      operationId: projects_api_set_request_reject_set_request
      summary: Reject Set Request
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: set_request_id
        schema:
          title: Set Request Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetRequestResponse'
      description: SUBMITTED -> REJECTED. Planner rejects with a mandatory reason.
      tags:
      - projects.set-requests
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetRequestReject'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/set-requests/{set_request_id}/cancel:
    post:
      operationId: projects_api_set_request_cancel_set_request
      summary: Cancel Set Request
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: set_request_id
        schema:
          title: Set Request Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetRequestResponse'
      description: Any non-terminal -> CANCELLED. Idempotent.
      tags:
      - projects.set-requests
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/set-requests/{set_request_id}/mark-ready:
    post:
      operationId: projects_api_set_request_mark_set_request_ready
      summary: Mark Set Request Ready
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: set_request_id
        schema:
          title: Set Request Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetRequestResponse'
      description: MRO confirms (or undoes) the 'set built' readiness gate.
      tags:
      - projects.set-requests
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/SetRequestReadinessToggle'
              - type: 'null'
        required: false
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/set-requests/{set_request_id}/confirm-it:
    post:
      operationId: projects_api_set_request_confirm_set_request_it
      summary: Confirm Set Request It
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: set_request_id
        schema:
          title: Set Request Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetRequestResponse'
      description: IT confirms (or undoes) Starlink/setup done. Captured, never blocks pickup.
      tags:
      - projects.set-requests
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/SetRequestReadinessToggle'
              - type: 'null'
        required: false
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/set-requests/{set_request_id}/confirm-ppe:
    post:
      operationId: projects_api_set_request_confirm_set_request_ppe
      summary: Confirm Set Request Ppe
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: set_request_id
        schema:
          title: Set Request Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetRequestResponse'
      description: PPE coordinator confirms (or undoes) that the set PPE is in the bus.
      tags:
      - projects.set-requests
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/SetRequestReadinessToggle'
              - type: 'null'
        required: false
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/set-requests/{set_request_id}/mark-picked-up:
    post:
      operationId: projects_api_set_request_mark_set_request_picked_up
      summary: Mark Set Request Picked Up
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: set_request_id
        schema:
          title: Set Request Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetRequestResponse'
      description: READY -> PICKED_UP. The set-pickup permission holder (MRO) confirms it.
      tags:
      - projects.set-requests
      security:
      - APIKeyAuth: []
      - CookieAuth: []
components:
  schemas:
    SetRequestCreate:
      additionalProperties: false
      properties:
        robot_pprsi_id:
          description: The ROBOT PPRSI (planned robot line) this Set Request is for. The PPRS is derived from it, so a PPRS with several sets can carry one Set Request per set.
          title: Robot Pprsi Id
          type: integer
        service_ids:
          items:
            type: integer
          title: Service Ids
          type: array
        kind:
          default: STANDARD
          enum:
          - STANDARD
          - EXISTING_SET
          title: Kind
          type: string
        region:
          anyOf:
          - enum:
            - EU
            - NA
            type: string
          - type: 'null'
          description: Standard-set region. Defaults server-side from the project location's country when omitted.
          title: Region
        inherit_from_set_request_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Inherit From Set Request Id
        notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Notes
        needed_by_date:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          description: Date the set must be ready on-site (mobilization date). Server defaults to the selected robot PPRSI's planned start date when omitted, and rejects the request when neither is available.
          title: Needed By Date
        items:
          items:
            $ref: '#/components/schemas/SetRequestItemInput'
          title: Items
          type: array
      required:
      - robot_pprsi_id
      title: SetRequestCreate
      type: object
    ItemCreate:
      additionalProperties: false
      properties:
        description:
          maxLength: 255
          minLength: 1
          title: Description
          type: string
        category_id:
          description: ItemCategory id (PPE / Consumable / …).
          title: Category Id
          type: integer
      required:
      - description
      - category_id
      title: ItemCreate
      type: object
    SetRequestInheritCandidate:
      additionalProperties: false
      description: 'A prior PICKED_UP SR (any project) whose lines can seed a new

        EXISTING_SET request for the same robot set.'
      properties:
        id:
          title: Id
          type: integer
        display_id:
          title: Display Id
          type: string
        project_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Project Code
        robot_set_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Robot Set Name
        dates_from:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          title: Dates From
        dates_to:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          title: Dates To
