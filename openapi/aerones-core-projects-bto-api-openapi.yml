openapi: 3.2.0
info:
  title: Operations Hub Core.projects.bto API
  version: 0.1.1
  description: ''
servers: []
tags:
- name: core.projects.bto
paths:
  /api/core/v1/projects/{project_id}/bto/travel-orders:
    get:
      operationId: list_bto_travel_orders
      summary: List Bto Travel Orders
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/BusinessTravelOrderListSchema'
                title: Response
                type: array
      description: List all travel orders for a project.
      tags:
      - core.projects.bto
      security:
      - APIKeyAuth: []
      - CookieAuth: []
    post:
      operationId: create_bto_travel_order
      summary: Create Bto Travel Order
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/BusinessTravelOrderListSchema'
                title: Response
                type: array
      description: Create a travel order and return the refreshed list (legacy contract).
      tags:
      - core.projects.bto
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessTravelOrderCreateSchema'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/core/v1/projects/{project_id}/bto/travel-orders/{order_id}:
    get:
      operationId: get_bto_travel_order
      summary: Get Bto Travel Order
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: order_id
        schema:
          title: Order Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessTravelOrderDetailSchema'
      description: Get a single travel order's details.
      tags:
      - core.projects.bto
      security:
      - APIKeyAuth: []
      - CookieAuth: []
    patch:
      operationId: update_bto_travel_order
      summary: Update Bto Travel Order
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: order_id
        schema:
          title: Order Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessTravelOrderDetailSchema'
      description: Update an existing travel order.
      tags:
      - core.projects.bto
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessTravelOrderUpdateSchema'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
    delete:
      operationId: delete_bto_travel_order
      summary: Delete Bto Travel Order
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: order_id
        schema:
          title: Order Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
      description: Soft delete a travel order.
      tags:
      - core.projects.bto
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/core/v1/projects/{project_id}/bto/travel-orders/{order_id}/refresh:
    post:
      operationId: refresh_bto_travel_order
      summary: Refresh Bto Travel Order
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: order_id
        schema:
          title: Order Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessTravelOrderDetailSchema'
      description: Refresh planned dates + unit counts from their Core sources.
      tags:
      - core.projects.bto
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/core/v1/projects/{project_id}/bto/travel-orders/{order_id}/send-emails:
    post:
      operationId: send_bto_travel_order_emails
      summary: Send Bto Travel Order Emails
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: order_id
        schema:
          title: Order Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessTravelOrderDetailSchema'
      description: Send BTO notification emails and mark the travel order as sent.
      tags:
      - core.projects.bto
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/core/v1/projects/{project_id}/bto/travel-orders/{order_id}/questions:
    get:
      operationId: get_bto_travel_order_questions
      summary: Get Bto Travel Order Questions
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: order_id
        schema:
          title: Order Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessTravelOrderQuestionsSchema'
      description: Get the travel order questionnaire.
      tags:
      - core.projects.bto
      security:
      - APIKeyAuth: []
      - CookieAuth: []
    put:
      operationId: update_bto_travel_order_questions
      summary: Update Bto Travel Order Questions
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: order_id
        schema:
          title: Order Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessTravelOrderQuestionsSchema'
      description: Update the travel order questionnaire.
      tags:
      - core.projects.bto
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessTravelOrderQuestionsSchema'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
components:
  schemas:
    BusinessTravelOrderQuestionsSchema:
      additionalProperties: false
      description: Schema for BTO questionnaire (both read and write operations).
      properties:
        general:
          $ref: '#/components/schemas/BusinessTravelOrderQuestionsGeneralSchema'
          description: General questions applicable to any business travel order
        iin_ons:
          anyOf:
          - $ref: '#/components/schemas/BusinessTravelOrderIINONSQuestionsSchema'
          - type: 'null'
          description: IIN-ONS specific questions, included only if BTO is for IIN-ONS service
        iin_ofs:
          anyOf:
          - $ref: '#/components/schemas/BusinessTravelOrderIINOFSQuestionsSchema'
          - type: 'null'
          description: IIN-OFS specific questions, included only if BTO is for IIN-OFS service
        ler:
          anyOf:
          - $ref: '#/components/schemas/BusinessTravelOrderLERQuestionsSchema'
          - type: 'null'
          description: LER specific questions, included only if BTO is for LER service
        tcl:
          anyOf:
          - $ref: '#/components/schemas/BusinessTravelOrderTCLQuestionsSchema'
          - type: 'null'
          description: TCL specific questions, included only if BTO is for TCL service
        bcl:
          anyOf:
          - $ref: '#/components/schemas/BusinessTravelOrderBCLQuestionsSchema'
          - type: 'null'
          description: BCL specific questions, included only if BTO is for BCL service
        vin:
          anyOf:
          - $ref: '#/components/schemas/BusinessTravelOrderVINQuestionsSchema'
          - type: 'null'
          description: VIN specific questions, included only if BTO is for VIN service
        lps:
          anyOf:
          - $ref: '#/components/schemas/BusinessTravelOrderLPSQuestionsSchema'
          - type: 'null'
          description: LPS specific questions, included only if BTO is for LPS service
        rat:
          anyOf:
          - $ref: '#/components/schemas/BusinessTravelOrderRATQuestionsSchema'
          - type: 'null'
          description: RAT specific questions, included only if BTO is for RAT service
        ice:
          anyOf:
          - $ref: '#/components/schemas/BusinessTravelOrderICEQuestionsSchema'
          - type: 'null'
          description: ICE specific questions, included only if BTO is for ICE service
      required:
      - general
      title: BusinessTravelOrderQuestionsSchema
      type: object
    BusinessTravelOrderICEQuestionsSchema:
      additionalProperties: false
      description: ICE specific questions.
      properties:
        ensure_internet_cables:
          anyOf:
          - $ref: '#/components/schemas/QuestionField'
          - type: 'null'
          description: Ensure internet cables have the correct connectors.
        confirm_ice_chemicals:
          anyOf:
          - $ref: '#/components/schemas/QuestionField'
          - type: 'null'
          description: Confirm that enough ICE chemicals are in stock.
        verify_spare_motor:
          anyOf:
          - $ref: '#/components/schemas/QuestionField'
          - type: 'null'
          description: Verify that a spare motor is available for the cleaning robot.
        curing_time_source:
          anyOf:
          - $ref: '#/components/schemas/QuestionField'
          - type: 'null'
          description: What is the curing time for the material?
        repeat_photos_understanding:
          anyOf:
          - $ref: '#/components/schemas/QuestionField'
          - type: 'null'
          description: I understand that repeat photos must be taken 24 hours after the curing time.
      title: BusinessTravelOrderICEQuestionsSchema
      type: object
    BusinessTravelOrderCreateSchema:
      additionalProperties: false
      description: Schema for business travel order creation.
      properties:
        service_id:
          description: CORE Service ID
          title: Service Id
          type: integer
        project_location_id:
          description: CORE ProjectLocation ID the service is delivered at
          title: Project Location Id
          type: integer
        project_resource_set_id:
          description: CORE ProjectResourceSet ID to populate team members
          title: Project Resource Set Id
          type: integer
        supervisor_user_id:
          anyOf:
          - type: integer
          - type: 'null'
          description: Django auth User ID for the BTO supervisor
          title: Supervisor User Id
      required:
      - service_id
      - project_location_id
      - project_resource_set_id
      title: BusinessTravelOrderCreateSchema
      type: object
    ContactPerson:
      additionalProperties: false
      description: Schema for contact person.
      properties:
        name:
          anyOf:
          - type: string
          - type: 'null'
          description: Full name of the contact person.
          title: Name
        email:
          anyOf:
          - format: email
            type: string
          - type: 'null'
          description: Valid email address of the contact person.
          title: Email
        phone:
          anyOf:
          - type: string
          - type: 'null'
          title: Phone
        role:
          anyOf:
          - type: string
          - type: 'null'
          description: Role of the contact person (for site contacts)
          title: Role
      title: ContactPerson
      type: object
    BusinessTravelOrderUpdateSchema:
      additionalProperties: false
      description: Schema for business travel order updates.
      properties:
        project_technical_information:
          anyOf:
          - type: string
          - type: 'null'
          description: Link to folder for technical information
          title: Project Technical Information
        project_technical_description:
          anyOf:
          - type: string
          - type: 'null'
          description: Technical description text field
          title: Project Technical Description
        daily_report_folder_link:
          anyOf:
          - type: string
          - type: 'null'
          description: Google Drive daily report folder link
          title: Daily Report Folder Link
        robot_set_id:
          anyOf:
          - type: string
          - type: 'null'
          description: Robot set id in specific project
          title: Robot Set Id
        resource_set_id:
          anyOf:
          - type: integer
          - type: 'null'
          description: Resource set ID from CORE schema
          title: Resource Set Id
        supervisor_user_id:
          anyOf:
          - type: integer
          - type: 'null'
          description: Django auth User ID for the BTO supervisor
          title: Supervisor User Id
      title: BusinessTravelOrderUpdateSchema
      type: object
    BusinessTravelOrderTCLQuestionsSchema:
      additionalProperties: false
      description: TCL specific questions.
      properties:
        water_source_identification:
          anyOf:
          - $ref: '#/components/schemas/QuestionField'
          - type: 'null'
          description: I know where to take the water from.
        chemical_availability:
          anyOf:
          - $ref: '#/components/schemas/QuestionField'
          - type: 'null'
          description: I have the required chemicals with me, and I know exactly which ones they are and how to use them.
        dirtiness_assessment:
          anyOf:
          - $ref: '#/components/schemas/QuestionField'
          - type: 'null'
          description: I know the type and level of dirtiness on the WTG.
        wastewater_disposal_known:
          anyOf:
          - $ref: '#/components/schemas/QuestionField'
          - type: 'null'
          description: If necessary, I know where to dispose of the wastewater.
      title: BusinessTravelOrderTCLQuestionsSchema
      type: object
    TravelOrderStatus:
      description: Travel order status.
      enum:
      - Draft
      - Sent
      title: TravelOrderStatus
      type: string
    BusinessTravelOrderLERQuestionsSchema:
      additionalProperties: false
      description: LER specific questions.
      properties:
        robotic_tools_in_use:
          anyOf:
          - $ref: '#/components/schemas/QuestionField'
          - type: 'null'
          description: How many robotic tools are in use, and what types are they?
        robotic_tool_usage_sequence:
          anyOf:
          - $ref: '#/components/schemas/QuestionField'
          - type: 'null'
          description: What is the sequence of robotic tool usage?
        project_materials:
          anyOf:
          - $ref: '#/components/schemas/QuestionField'
          - type: 'null'
          description: What materials will be used in this project?
        drone_photo_activities:
          anyOf:
          - $ref: '#/components/schemas/QuestionField'
          - type: 'null'
          description: After which activities must photos be taken with a drone?
        ler_meters:
          anyOf:
          - $ref: '#/components/schemas/QuestionField'
          - type: 'null'
          description: How many meters of LER will be performed?
        scope_change_definition:
          anyOf:
          - $ref: '#/components/schemas/QuestionField'
          - type: 'null'
          description: What does "scope change" mean?
        material_curing_time_source:
          anyOf:
          - $ref: '#/components/schemas/QuestionField'
          - type: 'null'
          description: Where can the curing time for each material be found?
      title: BusinessTravelOrderLERQuestionsSchema
      type: object
    BusinessTravelOrderIINOFSQuestionsSchema:
      additionalProperties: false
      description: IIN-OFS specific questions.
      properties:
        specific_customer_requirements:
          anyOf:
          - $ref: '#/components/schemas/QuestionField'
          - type: 'null'
          description: I understand the specific customer requirements for the inspection.
        crawler_operation_requirements:
          anyOf:
          - $ref: '#/components/schemas/QuestionField'
          - type: 'null'
          description: I understand the minimum crawler operation requirements for performing the service.
        crawler_spare_parts_availability:
          anyOf:
          - $ref: '#/components/schemas/QuestionField'
          - type: 'null'
          description: I am aware of the availability of crawler spare parts during the turbine service.
        data_upload_familiarity:
          anyOf:
          - $ref: '#/components/schemas/QuestionField'
          - type: 'null'
          description: I have access to the data upload folders and am familiar with data sorting.
        blade_information_card_familiarity:
          anyOf:
          - $ref: '#/components/schemas/QuestionField'
          - type: 'null'
          description: I am familiar with the blade information card and its purpose.
        data_upload_timing:
          anyOf:
          - $ref: '#/components/schemas/QuestionField'
          - type: 'null'
          description: I understand that data uploads must be completed within 24 hours.
        gas_detector_expiry_awareness:
          anyOf:
          - $ref: '#/components/schemas/QuestionField'
          - type: 'null'
          description: I acknowledge that the gas detector expiry date must not be less than two months.
        quick_spare_parts_awareness:
          anyOf:
          - $ref: '#/components/schemas/QuestionField'
          - type: 'null'
          description: I am aware of the quick availability of critical spare parts at the offshore site
        starlink_offshore_availability:
          anyOf:
          - $ref: '#/components/schemas/QuestionField'
          - type: 'null'
          description: Starlink for offshore use is available in the set.
      title: BusinessTravelOrderIINOFSQuestionsSchema
      type: object
    BusinessTravelOrderVINQuestionsSchema:
      additionalProperties: false
      description: VIN specific questions.
      properties:
        flight_restrictions:
          anyOf:
          - $ref: '#/components/schemas/QuestionField'
          - type: 'null'
          description: Are there any flight restrictions or airports nearby?
        charging_socket_info:
          anyOf:
          - $ref: '#/components/schemas/QuestionField'
          - type: 'null'
          description: Does the tower have a socket for charging batteries, and does it require an adapter?
      title: BusinessTravelOrderVINQuestionsSchema
      type: object
    BusinessTravelOrderLPSQuestionsSchema:
      additionalProperties: false
      description: LPS specific questions.
      properties:
        receptor_types_known:
          anyOf:
          - $ref: '#/components/schemas/QuestionField'
          - type: 'null'
          description: Is the number and location of receptors on the blade known?
        bridge_necessity_known:
          anyOf:
          - $ref: '#/components/schemas/QuestionField'
          - type: 'null'
          description: Is the bridge necessary, and in what cases is it used?
        blade_troubleshooting_known:
          anyOf:
          - $ref: '#/components/schemas/QuestionField'
          - type: 'null'
          description: Do you know how to troubleshoot a blade?
        service_provided_known:
          anyOf:
          - $ref: '#/components/schemas/QuestionField'
          - type: 'null'
          description: Do you know what service are you providing?
        full_loop_measurements_required:
          anyOf:
          - $ref: '#/components/schemas/QuestionField'
          - type: 'null'
          description: Does the client require full loop measurements or blade-only measurements?
      title: BusinessTravelOrderLPSQuestionsSchema
      type: object
    BusinessTravelOrderListSchema:
      additionalProperties: false
      description: Schema for business travel order list response.
      properties:
        id:
          description: BTO database ID
          title: Id
          type: integer
        start_date:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          description: Planned start date
          title: Start Date
        end_date:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          description: Planned end date
          title: End Date
        robot_set:
          anyOf:
          - type: string
          - type: 'null'
          description: Robot set information
          title: Robot Set
        service_by_robotic_set:
          description: Service code that will be handled by robotic set
          title: Service By Robotic Set
          type: string
        status:
          description: Delivery status of BTO emails
          title: Status
          type: string
      required:
      - id
      - service_by_robotic_set
      - status
      title: BusinessTravelOrderListSchema
      type: object
    TeamMember:
      description: Schema for Aerones team member.
      properties:
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        email:
          anyOf:
          - format: email
            type: string
          - type: 'null'
          title: Email
        phone:
          anyOf:
          - type: string
          - type: 'null'
          title: Phone
        role:
          anyOf:
          - type: string
          - type: 'null'
          title: Role
        qualifications:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: List of qualifications for the team member.
          title: Qualifications
      title: TeamMember
      type: object
    BusinessTravelOrderDetailSchema:
      description: 'Schema for business travel order details.


        Business travel order is sent by specific set on specific service.'
      properties:
        project_technical_information:
          anyOf:
          - type: string
          - type: 'null'
          description: Link to folder for technical information
          title: Project Technical Information
        project_technical_description:
          anyOf:
          - type: string
          - type: 'null'
          description: Technical description text field
          title: Project Technical Description
        daily_report_folder_link:
          anyOf:
          - type: string
          - type: 'null'
          description: Google Drive daily report folder link
          title: Daily Report Folder Link
        robot_set_id:
          anyOf:
          - type: string
          - type: 'null'
          description: Robot set id in specific project
          title: Robot Set Id
        resource_set_id:
          anyOf:
          - type: integer
          - type: 'null'
          description: Resource set ID from CORE schema
          title: Resource Set Id
        id:
          description: BTO database ID
          title: Id
          type: integer
        team_members:
          anyOf:
          - items:
              $ref: '#/components/schemas/TeamMember'
            type: array
          - type: 'null'
          description: List of team members assigned to the BTO and receiving emails
          title: Team Members
        robot_set:
          anyOf:
          - type: string
          - type: 'null'
          description: Robot set name (code)
          title: Robot Set
        units_total:
          anyOf:
          - type: integer
          - type: 'null'
          description: Total units, prefilled from assets but editable
          title: Units Total
        units_turbines:
          anyOf:
          - type: integer
          - type: 'null'
          description: Total turbines
          title: Units Turbines
        units_blades:
          anyOf:
          - type: integer
          - type: 'null'
          description: Total blades
          title: Units Blades
        planned_start_date:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          description: Planned project start date
          title: Planned Start Date
        planned_end_date:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          description: Planned project end date
          title: Planned End Date
        actual_start_date:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          description: Actual start date
          title: Actual Start Date
        actual_end_date:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          description: Actual end date
          title: Actual End Date
        dedicated_client_scope_change:
          anyOf:
          - type: string
          - type: 'null'
          description: Dedicated client for scope change (LER projects only)
          title: Dedicated Client Scope Change
        reinspection:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Reinspection information
          title: Reinspection
        status:
          $ref: '#/components/schemas/TravelOrderStatus'
          description: Delivery status of BTO emails
        prejob_pdf:
          description: Pre-job PDF link
          title: Prejob Pdf
          type: string
        questionnaire_filled:
          default: 0
          description: BTO questionnaire filled by team lead 0-100
          title: Questionnaire Filled
          type: integer
        service_category_by_robotic_set:
          description: Code of service category.
          title: Service Category By Robotic Set
          type: string
        service_name_by_robotic_set:
          description: Service name
          title: Service Name By Robotic Set
          type: string
        service_by_robotic_set:
          description: Service code by robotic set
          title: Service By Robotic Set
          type: string
        site_contact_persons:
          default: []
          description: List of site contact persons
          items:
            $ref: '#/components/schemas/ContactPerson'
          title: Site Contact Persons
          type: array
        site_name:
          anyOf:
          - type: string
          - type: 'null'
          description: Site name
          title: Site Name
        site_address:
          anyOf:
          - type: string
          - type: 'null'
          description: Site address
          title: Site Address
        site_latitude:
          anyOf:
          - type: number
          - type: 'null'
          description: Site latitude
          title: Site Latitude
        site_longitude:
          anyOf:
          - type: number
          - type: 'null'
          description: Site longitude
          title: Site Longitude
        site_country:
          anyOf:
          - type: string
          - type: 'null'
          description: Site country, two letter ISO code
          title: Site Country
        om_building_address:
          anyOf:
          - type: string
          - type: 'null'
          description: O&M building address
          title: Om Building Address
        om_building_latitude:
          anyOf:
          - type: number
          - type: 'null'
          description: O&M building latitude
          title: Om Building Latitude
        om_building_longitude:
          anyOf:
          - type: number
          - type: 'null'
          description: O&M building longitude
          title: Om Building Longitude
        can_compensate_on_sundays:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Whether work on Sundays can be compensated, taken from site safety form
