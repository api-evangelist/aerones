openapi: 3.2.0
info:
  title: Operations Hub Netsuite API
  version: 0.1.1
  description: ''
servers: []
tags:
- name: netsuite
paths:
  /api/netsuite/subsidiaries:
    get:
      operationId: integrations_netsuite_api_get_subsidiaries
      summary: Get Subsidiaries
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Subsidiary'
                title: Response
                type: array
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'Get all Aerones billing entities from NetSuite, each annotated with the

        customer countries it is the billing default for.'
      tags:
      - netsuite
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/netsuite/refresh-master-data:
    post:
      operationId: integrations_netsuite_api_refresh_master_data
      summary: Refresh Master Data
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'Refresh master data from NetSuite.


        This syncs:

        - Units of measure to ServicePricingUnit

        - Service items with their unit relations'
      tags:
      - netsuite
      security:
      - APIKeyAuth: []
      - CookieAuth: []
components:
  schemas:
    Subsidiary:
      additionalProperties: false
      description: Aerones billing entity.
      properties:
        id:
          title: Id
          type: integer
        name:
          title: Name
          type: string
        country:
          anyOf:
          - type: string
          - type: 'null'
          title: Country
        default_for_country_codes:
          default: []
          items:
            type: string
          title: Default For Country Codes
          type: array
        is_default_fallback:
          default: false
          title: Is Default Fallback
          type: boolean
      required:
      - id
      - name
      title: Subsidiary
      type: object
    Error:
      additionalProperties: false
      description: Error response schema.
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          title: Message
          type: string
      required:
      - code
      - message
      title: Error
      type: object
    ErrorCode:
      description: Error codes for API errors.
      enum:
      - validation
      - server
      - auth
      - unknown
      - external
      - generic
      title: ErrorCode
      type: string
    Success:
      additionalProperties: false
      description: 'Schema returned for successful operations.


        The `success` field is always ``true`` in this schema. Failed operations are

        represented by the :class:`Error` schema instead, so a ``false`` value does

        not occur in practice. The field is included for consistency across responses

        and to make the contract explicit for clients.'
      properties:
        success:
          default: true
          description: Always true for this schema. Errors are represented by a separate Error schema, so false is never returned.
          title: Success
          type: boolean
      title: Success
      type: object
  securitySchemes:
    APIKeyAuth:
      type: http
      scheme: bearer
    CookieAuth:
      type: apiKey
      in: cookie
      name: opshub_prod_sessionid
    AuthBearer:
      type: http
      scheme: bearer
x-provenance:
  method: harvested
  publisher: Aerones
  source: https://operations.aerones.com/api/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
