openapi: 3.2.0
info:
  title: Operations Hub Accounting.service Charges API
  version: 0.1.1
  description: ''
servers: []
tags:
- name: accounting.service-charges
paths:
  /api/accounting/v2/service-charges:
    get:
      operationId: list_service_charges
      summary: List Service Charges
      parameters:
      - in: query
        name: search
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Search (case-insensitive)
          title: Search
        required: false
        description: Search (case-insensitive)
      - in: query
        name: sort
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Sort by field (prefix with - for descending)
          title: Sort
        required: false
        description: Sort by field (prefix with - for descending)
      - in: query
        name: project_id
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Filter by project ID
          title: Project Id
        required: false
        description: Filter by project ID
      - in: query
        name: sales_order_id
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Filter by sales order ID
          title: Sales Order Id
        required: false
        description: Filter by sales order ID
      - in: query
        name: billing_statement_id
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Filter by billing statement ID
          title: Billing Statement Id
        required: false
        description: Filter by billing statement ID
      - in: query
        name: source_system
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by source system
          title: Source System
        required: false
        description: Filter by source system
      - in: query
        name: paginate
        schema:
          default: true
          description: Enable pagination (false returns all results)
          title: Paginate
          type: boolean
        required: false
        description: Enable pagination (false returns all results)
      - in: query
        name: page
        schema:
          default: 1
          description: Page number
          minimum: 1
          title: Page
          type: integer
        required: false
        description: Page number
      - in: query
        name: page_size
        schema:
          default: 50
          description: Number of items per page
          maximum: 1000
          minimum: 1
          title: Page Size
          type: integer
        required: false
        description: Number of items per page
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ServiceChargeResponse'
                title: Response
                type: array
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: List all items with optional search, sorting, and pagination.
      tags:
      - accounting.service-charges
      security:
      - APIKeyAuth: []
      - CookieAuth: []
    post:
      operationId: create_service_charge
      summary: Create Service Charge
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceChargeResponse'
      description: Create a new item.
      tags:
      - accounting.service-charges
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceChargeCreate'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/accounting/v2/service-charges/{id}:
    get:
      operationId: get_service_charge
      summary: Get Service Charge
      parameters:
      - in: path
        name: id
        schema:
          title: Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceChargeResponse'
      description: Get a single item by ID.
      tags:
      - accounting.service-charges
      security:
      - APIKeyAuth: []
      - CookieAuth: []
    patch:
      operationId: update_service_charge
      summary: Update Service Charge
      parameters:
      - in: path
        name: id
        schema:
          title: Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceChargeResponse'
      description: Update an item.
      tags:
      - accounting.service-charges
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceChargeUpdate'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
    delete:
      operationId: delete_service_charge
      summary: Delete Service Charge
      parameters:
      - in: path
        name: id
        schema:
          title: Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
      description: Soft delete an item.
      tags:
      - accounting.service-charges
      security:
      - APIKeyAuth: []
      - CookieAuth: []
