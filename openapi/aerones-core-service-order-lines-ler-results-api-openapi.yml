openapi: 3.2.0
info:
  title: Operations Hub Core.service Order Lines.ler Results API
  version: 0.1.1
  description: ''
servers: []
tags:
- name: core.service-order-lines.ler-results
paths:
  /api/core/v1/service-order-lines/{sol_id}/ler-results:
    get:
      operationId: get_ler_results_context
      summary: Per-blade LER Service Results capture context
      parameters:
      - in: path
        name: sol_id
        schema:
          title: Sol Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LerResultsContextResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - core.service-order-lines.ler-results
      security:
      - APIKeyAuth: []
      - CookieAuth: []
    put:
      operationId: upsert_ler_results
      summary: Upsert per-blade LER results for a SOL
      parameters:
      - in: path
        name: sol_id
        schema:
          title: Sol Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LerResultsUpsertResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'Upsert one LER row per blade, dropping an unset ``expected_updated_at``.


        Distinguishes "the client sent no concurrency token" from "the client

        sent null": ``model_dump`` fills the field from its default either way, so

        ``model_fields_set`` is the only place that difference survives, and it

        matters - an explicit null asserts "I expect no row yet" (a conflict if

        one exists), while an absent field opts out of the check entirely so

        older/other clients keep working.'
      tags:
      - core.service-order-lines.ler-results
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LerResultsUpsertBody'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/core/v1/service-order-lines/{sol_id}/ler-results/layout:
    put:
      operationId: update_ler_layout
      summary: Write the LER grid layout onto blades of a SOL
      parameters:
      - in: path
        name: sol_id
        schema:
          title: Sol Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LerLayoutResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - core.service-order-lines.ler-results
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LerLayoutBody'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/core/v1/service-order-lines/{sol_id}/ler-results/image-placement:
    put:
      operationId: update_ler_image_placement
      summary: Place LER images on the grid
      parameters:
      - in: path
        name: sol_id
        schema:
          title: Sol Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LerImagePlacementResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - core.service-order-lines.ler-results
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LerImagePlacementBody'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/core/v1/service-order-lines/{sol_id}/ler-results/phase-composites:
    post:
      operationId: create_ler_phase_composite
      summary: Compose one LER phase column into a single image
      parameters:
      - in: path
        name: sol_id
        schema:
          title: Sol Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LerPhaseCompositeResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'Compose one phase column, synchronously — no Celery task.


        ``def``, not ``async def``: this is blocking GCS IO plus Pillow, and

        ``backend-code-rules.md`` § ``async-scaffolding`` says new code that fights

        async is written sync. The four LER endpoints above are async and stay

        async; this one does not join them.'
      tags:
      - core.service-order-lines.ler-results
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LerPhaseCompositeBody'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/core/v1/service-order-lines/{sol_id}/ler-results/phase-composites/discard:
    post:
      operationId: discard_ler_phase_composite_changes
      summary: Discard the changes made to a composed LER phase column
      parameters:
      - in: path
        name: sol_id
        schema:
          title: Sol Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LerPhaseCompositeDiscardResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'Sync for the reason compose is: the manager is one locked transaction (``async-scaffolding``).'
      tags:
      - core.service-order-lines.ler-results
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LerPhaseCompositeDiscardBody'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
components:
  schemas:
    LerRepairInfo:
      additionalProperties: false
      description: 'Per-blade repair dimensions. All editable by DataOps; length may be

        prefilled from AeroTask ("Meters performed (m)" × 1000).'
      properties:
        length_mm:
          anyOf:
          - type: number
          - type: 'null'
          title: Length Mm
        width_mm:
          anyOf:
          - type: number
          - type: 'null'
          title: Width Mm
        lep_thickness_um:
          anyOf:
          - type: number
          - type: 'null'
          title: Lep Thickness Um
      title: LerRepairInfo
      type: object
    LerPhaseCompositeDiscardBlocker:
      additionalProperties: false
      description: Why a stale column cannot return to its composed state; ``position`` is a row KEY.
      properties:
        kind:
          title: Kind
          type: string
        position:
          anyOf:
          - type: string
          - type: 'null'
          title: Position
      required:
      - kind
      title: LerPhaseCompositeDiscardBlocker
      type: object
    LerStepPhoto:
      additionalProperties: false
      description: 'A repair-step photo: an AeroTask attachment (``activity``) or a line upload (``file``).'
      properties:
        source:
          title: Source
          type: string
        file_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: File Id
        attachment_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Attachment Id
        workorder_activity_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Workorder Activity Id
      required:
      - source
      title: LerStepPhoto
      type: object
    LerPhaseCompositeChange:
      additionalProperties: false
      description: 'One row of the difference between a composed column and the grid now.


        ``kind`` is a ``LerCompositeChangeKind`` value (SOURCE_REPLACED,

        FRAMING_CHANGED, POSITION_ADDED, POSITION_REMOVED, MOVED). ``detail`` is the

        sentence the rebuild dialog prints beside the row''s label, and is absent

        where the kind says everything.


        ``from_position`` accompanies MOVED and is the row the photo came from, as a

        KEY. The label belongs to the blade''s own grid, so the dialog resolves it

        the way every other address on this screen is resolved; a key baked into

        ``detail`` would print ``moved from POS_3`` at the operator.'
      properties:
        position:
          title: Position
          type: string
        kind:
          title: Kind
          type: string
        detail:
          anyOf:
          - type: string
          - type: 'null'
          title: Detail
        from_position:
          anyOf:
          - type: string
          - type: 'null'
          title: From Position
      required:
      - position
      - kind
      title: LerPhaseCompositeChange
      type: object
    LerResultsUpsertBlade:
      additionalProperties: false
      properties:
        work_order_id:
          anyOf:
          - type: integer
          - type: 'null'
          description: Workorder this blade's repair was executed under. Must be one of the SOL's own workorders (see the context's `workorders` list).
          title: Work Order Id
        service_date:
          anyOf:
          - type: string
          - type: 'null'
          description: ISO date (YYYY-MM-DD) the service was performed.
          title: Service Date
        data_operator_id:
          anyOf:
          - type: integer
          - type: 'null'
          description: auth User id of the DataOps operator who verified this blade.
          title: Data Operator Id
        data_operator_name:
          anyOf:
          - type: string
          - type: 'null'
          description: 'The operator''s email, resolved server-side because the header is read-only: the client renders a name, never a picker.'
          title: Data Operator Name
        blade_id:
          description: TurbineComponent.id of the blade being saved.
          title: Blade Id
          type: integer
        expected_updated_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: 'Optimistic-concurrency token: the `updated_at` of the row this draft was built from, or null when the client believes no row exists yet. If it disagrees with the stored row the write is refused with HTTP 409 (STALE_WRITE) instead of overwriting work the client never saw — which for this endpoint would also delete the other operator''s material photos.'
          title: Expected Updated At
        remark:
          anyOf:
          - type: string
          - type: 'null'
          title: Remark
        repair:
          allOf:
          - $ref: '#/components/schemas/LerRepairInfo'
        materials:
          items:
            $ref: '#/components/schemas/LerMaterial'
          title: Materials
          type: array
        layout:
          allOf:
          - $ref: '#/components/schemas/LerLayout'
          description: The blade's grid. Empty means 'no opinion' and keeps the stored layout; the layout endpoint is the surface that edits it across blades.
        damages:
          anyOf:
          - items:
              $ref: '#/components/schemas/LerDamage'
            type: array
          - type: 'null'
          description: The blade's whole damage list on a `damage_steps` line, in print order; null keeps what is stored. A `phase_grid` line refuses it.
          title: Damages
      required:
      - blade_id
      title: LerResultsUpsertBlade
      type: object
    ErrorCode:
      description: Error codes for API errors.
      enum:
      - validation
      - server
      - auth
      - unknown
      - external
      - generic
      title: ErrorCode
      type: string
    LerMaterialPhoto:
      additionalProperties: false
      description: 'One label photo of a material row, referenced from AeroTask.


        ``attachment_id`` is the id AS STORED, never coerced: an integer

        ``core.file.id`` and a UUID legacy storage id share the key, and the client

        picks the download route from its shape. ``workorder_activity_id`` is the

        activity the field was read from, which the integer route needs to build a

        URL at all.


        One entry per ``kind`` — the slot holds a single image. ``extra`` is how

        many more attachments that field carried, so a technician who dropped

        fifteen pictures into one label field is visible as a number instead of a

        wall of thumbnails.'
      properties:
        kind:
          title: Kind
          type: string
        attachment_id:
          title: Attachment Id
          type: string
        workorder_activity_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Workorder Activity Id
        extra:
          default: 0
          title: Extra
          type: integer
      required:
      - kind
      - attachment_id
      title: LerMaterialPhoto
      type: object
    Error:
      additionalProperties: false
      description: Error response schema.
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          title: Message
          type: string
      required:
      - code
      - message
      title: Error
      type: object
    LerImagePlacementBody:
      additionalProperties: false
      properties:
        placements:
          description: Placements to apply, all in one transaction.
          items:
            $ref: '#/components/schemas/LerImagePlacement'
          maxItems: 288
          title: Placements
          type: array
      required:
      - placements
      title: LerImagePlacementBody
      type: object
    LerResultsUpsertResponse:
      additionalProperties: false
      description: PUT response = the upsert count + the refreshed capture context.
      properties:
        service_order_line_id:
          title: Service Order Line Id
          type: integer
        capture_kind:
          default: phase_grid
          description: '`phase_grid` (robot LER: the stitched image grid) or `damage_steps` (LER-RAT-4-5: a list of damages with photographed repair steps).'
          title: Capture Kind
          type: string
        turbine:
          anyOf:
          - $ref: '#/components/schemas/LpsResultsTurbineObject'
          - type: 'null'
        blade_scope_notice:
          anyOf:
          - type: string
          - type: 'null'
          description: Finished sentence to show above the blade tabs when the panel is offering more blades than the line is linked to, or null when it is not. Composed here rather than assembled by the client, the same way report gap markers are.
          title: Blade Scope Notice
        blades:
          items:
            $ref: '#/components/schemas/LerResultsBlade'
          title: Blades
          type: array
        workorders:
          description: Workorders of this SOL, for the service-header select.
          items:
            $ref: '#/components/schemas/LerWorkorderOption'
          title: Workorders
          type: array
        material_type_buckets:
          description: The exact `material_type` vocabulary the upsert validates against. Returned so clients can verify their own list matches instead of learning about drift from a 422.
          items:
            type: string
          title: Material Type Buckets
          type: array
        material_type_options:
          description: Materials derived from the SOL's service items and its workorder activities. Empty is normal — the FE falls back to its bucket list and the control stays free-text either way.
          items:
            $ref: '#/components/schemas/LerMaterialTypeOption'
          title: Material Type Options
          type: array
        repair_defaults:
          description: Per-LEP-material implied repair width / thickness. Empty until the LER Tribe supplies the numbers; empty means 'do not prefill', never 'prefill with zero'.
          items:
            $ref: '#/components/schemas/LerRepairDefaults'
          title: Repair Defaults
          type: array
        vis_photos:
          description: VIS photos flagged include_in_report, already resolved onto grid cells. The primary image source; the uploader is the fallback.
          items:
            $ref: '#/components/schemas/LerVisPhoto'
          title: Vis Photos
          type: array
        vis_unmapped_photos:
          description: Flagged VIS photos whose blade / side / step could not be resolved to a grid cell. Never silently dropped.
          items:
            $ref: '#/components/schemas/LerVisUnmappedPhoto'
          title: Vis Unmapped Photos
          type: array
        phase_composites:
          description: Phase columns composed into one stored image, with whether each still matches the grid. A stale one does not print.
          items:
            $ref: '#/components/schemas/LerPhaseComposite'
          title: Phase Composites
          type: array
        overflow_cells:
          description: Cells holding more than one image, so the surplus is visible.
          items:
            $ref: '#/components/schemas/LerOverflowCell'
          title: Overflow Cells
          type: array
        scope_fields:
          description: 'Report block B, turbine half (Wind Park, Turbine Manufacturer, Hub height, Turbine Model, Nominal Power, Commissioning year). Once per response: LER is a per-blade service and the turbine is its shared context.'
          items:
            $ref: '#/components/schemas/LerReportField'
          title: Scope Fields
          type: array
        upserted:
          description: How many blades were written.
          title: Upserted
          type: integer
      required:
      - service_order_line_id
      - upserted
      title: LerResultsUpsertResponse
      type: object
    LerReportField:
      additionalProperties: false
      description: 'One cell of the read-only report mirror (block B, Scope Of The Service).


        A cell carries either ``value`` or ``missing``, never neither: a blank cell

        in a mirror of a customer deliverable reads as a zero, and making the gaps

        visible to DataOps is the reason the block exists.


        ``value`` is already the string the report prints. ``number`` is for a value

        the client re-formats itself, so the conversion stays one function on the

        client; no field of this block needs it today.'
      properties:
        key:
          title: Key
          type: string
        label:
          title: Label
          type: string
        unit:
          anyOf:
          - type: string
          - type: 'null'
          description: Unit of the FIELD, never part of the value (the report prints MW for nominal power, which the database does not store).
          title: Unit
        value:
          anyOf:
          - type: string
          - type: 'null'
          title: Value
        number:
          anyOf:
          - type: number
          - type: 'null'
          title: Number
        missing:
          anyOf:
          - $ref: '#/components/schemas/LerReportMissing'
          - type: 'null'
      required:
      - key
      - label
      title: LerReportField
      type: object
    LerReportMissing:
      additionalProperties: false
      description: 'Why a read-only report cell is empty: what it means, where, whose data.


        Three parts on purpose. ``hint`` is the finished sentence the operator reads

        first; ``field`` is the exact database address a developer needs once the UI

        wording and the column have drifted apart; ``owner`` is who owes the value.

        All three are composed on the backend, next to the code that decided the

        value is absent, so the UI never assembles a sentence out of a key.'
      properties:
        hint:
          description: Plain-language sentence for the operator.
          title: Hint
          type: string
        field:
          description: Exact database address, for a developer.
          title: Field
          type: string
        owner:
          description: Who owes this value.
          title: Owner
          type: string
      required:
      - hint
      - field
      - owner
      title: LerReportMissing
      type: object
    LerResultsBlade:
      additionalProperties: false
      properties:
        work_order_id:
          anyOf:
          - type: integer
          - type: 'null'
          description: Workorder this blade's repair was executed under. Must be one of the SOL's own workorders (see the context's `workorders` list).
          title: Work Order Id
        service_date:
          anyOf:
          - type: string
          - type: 'null'
          description: ISO date (YYYY-MM-DD) the service was performed.
          title: Service Date
        data_operator_id:
          anyOf:
          - type: integer
          - type: 'null'
          description: auth User id of the DataOps operator who verified this blade.
          title: Data Operator Id
        data_operator_name:
          anyOf:
          - type: string
          - type: 'null'
          description: 'The operator''s email, resolved server-side because the header is read-only: the client renders a name, never a picker.'
          title: Data Operator Name
        blade:
          $ref: '#/components/schemas/LerResultsBladeObject'
        result_id:
          anyOf:
          - type: integer
          - type: 'null'
          description: Saved LER ServiceResult id, when one exists.
          title: Result Id
        updated_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: Last-write timestamp of the saved ServiceResult; null for AEROTASK/EMPTY blades. Lets the client detect a stale draft.
          title: Updated At
        source:
          description: SAVED = data comes from a stored ServiceResult; AEROTASK = no saved row yet, fields prefilled from technician activity custom_fields; EMPTY = nothing found.
          title: Source
          type: string
        remark:
          anyOf:
          - type: string
          - type: 'null'
          title: Remark
        repair:
          allOf:
          - $ref: '#/components/schemas/LerRepairInfo'
        materials:
          items:
            $ref: '#/components/schemas/LerMaterial'
          title: Materials
          type: array
        layout:
          allOf:
          - $ref: '#/components/schemas/LerLayout'
          description: The blade's grid. Defaults for a row saved before layouts existed, always widened by keys the blade's images already use.
        blade_fields:
          description: 'Report block B, blade half (Blade Model, Blade Length). In the blade''s own record, not at the root: a report section prints ONE blade and has to be self-contained.'
          items:
            $ref: '#/components/schemas/LerReportField'
          title: Blade Fields
          type: array
        damages:
          description: 'The blade''s repairs on a `damage_steps` line: saved, else the AeroTask prefill. Always empty on a `phase_grid` line.'
          items:
            $ref: '#/components/schemas/LerDamage'
          title: Damages
          type: array
      required:
      - blade
      - source
      title: LerResultsBlade
      type: object
    LerPhaseCompositeDiscardBody:
      additionalProperties: false
      description: POST ``/service-order-lines/{sol_id}/ler-results/phase-composites/discard``.
      properties:
        blade_id:
          title: Blade Id
          type: integer
        side:
          description: PRESSURE_SIDE / SUCTION_SIDE.
          title: Side
          type: string
        phase:
          title: Phase
          type: string
        expected_recipe_hash:
          description: The hash of the composite to return to; a mismatch is 409 STALE_WRITE.
          title: Expected Recipe Hash
          type: string
        expected_current_recipe_hash:
          description: The column's current_recipe_hash the listed changes were read from; a grid edit since then is 409 STALE_WRITE.
          title: Expected Current Recipe Hash
          type: string
      required:
      - blade_id
      - side
      - phase
      - expected_recipe_hash
      - expected_current_recipe_hash
      title: LerPhaseCompositeDiscardBody
      type: object
    LerRepairDefaults:
      additionalProperties: false
      description: 'Repair dimensions implied by one LEP product.


        A LIST entry carrying its own ``material`` field rather than a map keyed by

        the product name: the frontend''s response interceptor camel-cases every

        object KEY it walks, so a name-keyed map would arrive under a mangled key

        and never match. (Same reason the dispatching backlog returns facet counts

        as ``{key, count}`` rows.)'
      properties:
        material:
          title: Material
          type: string
        width_mm:
          anyOf:
          - type: number
          - type: 'null'
          title: Width Mm
        lep_thickness_um:
          anyOf:
          - type: number
          - type: 'null'
          title: Lep Thickness Um
      required:
      - material
      title: LerRepairDefaults
      type: object
    LpsResultsTurbineObject:
      additionalProperties: false
      properties:
        id:
          title: Id
          type: integer
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        manufacturer_turbine_model_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Manufacturer Turbine Model Id
      required:
      - id
      title: LpsResultsTurbineObject
      type: object
    LerPhaseComposite:
      additionalProperties: false
      description: 'A phase column that has been composed into a single stored image.


        The FILE is not repeated here — it is already in the SOL''s file list, and

        returning it twice would create two places for one truth. ``recipe_hash``

        IS here: it is not part of the file, it is the fingerprint this response was

        computed against, and a rebuild has to echo it back as

        ``expected_recipe_hash``. Reading it out of the file''s

        ``additional_information`` instead would make the client depend on a storage

        format this API deliberately hides.


        ``is_fresh`` is recomputed from the RESOLVED grid on every read, not from

        the placements as they were stored: VIS auto-fill moves an unpinned photo at

        read time with no operator save at all. A stale composite does not print;

        the column falls back to its individual frames until it is rebuilt.'
      properties:
        file_id:
          title: File Id
          type: integer
        blade_id:
          title: Blade Id
          type: integer
        side:
          title: Side
          type: string
        phase:
          title: Phase
          type: string
        recipe_hash:
          anyOf:
          - type: string
          - type: 'null'
          title: Recipe Hash
        is_fresh:
          title: Is Fresh
          type: boolean
        current_recipe_hash:
          anyOf:
          - type: string
          - type: 'null'
          description: Hash of the column as the grid reads now; a discard echoes it back.
          title: Current Recipe Hash
        blank_positions:
          description: Position keys this composed image prints as blank frames.
          items:
            type: string
          title: Blank Positions
          type: array
        changes:
          description: What moved since it was composed; empty when is_fresh.
          items:
            $ref: '#/components/schemas/LerPhaseCompositeChange'
          title: Changes
          type: array
        discard_blocker:
          anyOf:
          - $ref: '#/components/schemas/LerPhaseCompositeDiscardBlocker'
