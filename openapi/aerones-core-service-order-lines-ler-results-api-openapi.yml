          type: string
        source:
          title: Source
          type: string
        coating_system:
          anyOf:
          - type: string
          - type: 'null'
          title: Coating System
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
      required:
      - value
      - label
      - bucket
      - source
