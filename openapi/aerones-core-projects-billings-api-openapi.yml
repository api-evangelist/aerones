openapi: 3.2.0
info:
  title: Operations Hub Core.projects.billings API
  version: 0.1.1
  description: ''
servers: []
tags:
- name: core.projects.billings
paths:
  /api/core/v1/projects/{project_id}/billings:
    get:
      operationId: list_project_billings
      summary: List Billings for Project
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: query
        name: search
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Search by name (case-insensitive)
          title: Search
        required: false
        description: Search by name (case-insensitive)
      - in: query
        name: sort
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Sort by field (prefix with - for descending)
          title: Sort
        required: false
        description: Sort by field (prefix with - for descending)
      - in: query
        name: paginate
        schema:
          default: true
          description: Enable pagination (false returns all results)
          title: Paginate
          type: boolean
        required: false
        description: Enable pagination (false returns all results)
      - in: query
        name: page
        schema:
          default: 1
          description: Page number
          minimum: 1
          title: Page
          type: integer
        required: false
        description: Page number
      - in: query
        name: page_size
        schema:
          default: 50
          description: Number of items per page
          maximum: 1000
          minimum: 1
          title: Page Size
          type: integer
        required: false
        description: Number of items per page
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ProjectBillingResponse'
                title: Response
                type: array
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: List all child items for a parent with pagination, search, and sorting.
      tags:
      - core.projects.billings
      security:
      - APIKeyAuth: []
      - CookieAuth: []
    post:
      operationId: create_project_billing
      summary: Create Billing
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectBillingResponse'
      description: Create a new child item for the parent.
      tags:
      - core.projects.billings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectBillingCreate'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/core/v1/projects/{project_id}/billings/{billing_id}:
    get:
      operationId: get_project_billing
      summary: Get Billing
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: billing_id
        schema:
          title: Billing Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectBillingResponse'
      description: Get a single child item.
      tags:
      - core.projects.billings
      security:
      - APIKeyAuth: []
      - CookieAuth: []
    patch:
      operationId: update_project_billing
      summary: Update Billing
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: billing_id
        schema:
          title: Billing Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectBillingResponse'
      description: Update a child item.
      tags:
      - core.projects.billings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectBillingUpdate'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
    delete:
      operationId: delete_project_billing
      summary: Delete Billing
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: billing_id
        schema:
          title: Billing Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
      description: Soft delete a child item.
      tags:
      - core.projects.billings
      security:
      - APIKeyAuth: []
      - CookieAuth: []
