    ProjectScopeChangeRequestUpdate:
      additionalProperties: false
      description: 'Fields editable on a request that still awaits its first (QC) review.


        The endpoint 422s on any other status — later review stages, APPROVED

        (the cascade ran) and REJECTED (terminal) are immutable; correcting

        those means reject + recreate. The source SOL and type are deliberately

        not editable: re-pointing the request at a different line is a new

        request. ``replacement_service_id`` and ``additional_workorders`` live

        in ``custom_fields`` on the row; they are top-level here so the

        editable surface stays an explicit whitelist.'
      properties:
        description:
          anyOf:
          - type: string
          - type: 'null'
          description: Change description
          title: Description
        replacement_service_id:
          anyOf:
          - type: integer
          - type: 'null'
          description: New replacement service (stored as custom_fields.replacement_service_id). Must be an LER service. When it changes, additional_workorders must be re-submitted in the same call — the previously selected service items belong to the old replacement service.
          title: Replacement Service Id
        additional_workorders:
          anyOf:
          - items:
              $ref: '#/components/schemas/ScopeChangeAdditionalWorkorder'
            type: array
          - type: 'null'
          description: Replaces the persisted additional_workorders plan; validated against the (possibly new) replacement service. Pass an empty list to clear the plan.
          title: Additional Workorders
        evidence_file_ids:
          anyOf:
          - items:
              type: integer
            type: array
          - type: 'null'
          description: 'Replaces the linked evidence set. Ids are diffed against the current set: newly added ids get a FileEntityLink row (pre-upload the binaries via POST /api/core/v1/files), removed ids get their link soft-deleted. The AeroTask minimum-evidence rule applies at create time only — the QC reviewer editing a request may remove all images.'
          title: Evidence File Ids
        initial_evaluation_condition:
          anyOf:
          - $ref: '#/components/schemas/ScopeChangeInitialEvaluationCondition'
          - type: 'null'
          description: Replaces the stored initial-evaluation condition section (custom_fields.initial_evaluation_condition). Pass null to clear it; omit to leave it unchanged. Its image_file_ids are diffed into FileEntityLink rows like evidence_file_ids.
        current_condition:
          anyOf:
          - $ref: '#/components/schemas/ScopeChangeCurrentCondition'
          - type: 'null'
          description: Replaces the stored current-condition section (custom_fields.current_condition). Pass null to clear it; omit to leave it unchanged. Its image_file_ids are diffed into FileEntityLink rows like evidence_file_ids.
      title: ProjectScopeChangeRequestUpdate
      type: object
    ScopeChangeAdditionalWorkorder:
      additionalProperties: false
      description: 'One replacement-service ServiceItem to generate on the new SOL.


        Each entry includes a ServiceItem id and optionally a narrowed list of

        turbine components. ``service_item_id`` and ``turbine_component_ids``

        live on the same level so there''s no duplicated/parallel structure to

        keep in sync.'
      properties:
        service_item_id:
          description: Replacement-service ServiceItem ID to generate as a NOT_STARTED workorder on the new SOL.
          title: Service Item Id
          type: integer
        turbine_component_ids:
          description: TurbineComponent IDs that should receive a workorder for this ServiceItem. Each id must belong to the source SOL's turbine and match the ServiceItem's component type. Empty list = default selection (every matching component).
          items:
            type: integer
          title: Turbine Component Ids
          type: array
      required:
      - service_item_id
      title: ScopeChangeAdditionalWorkorder
      type: object
