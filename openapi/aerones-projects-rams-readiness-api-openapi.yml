openapi: 3.2.0
info:
  title: Operations Hub Projects.rams Readiness API
  version: 0.1.1
  description: ''
servers: []
tags:
- name: projects.rams-readiness
paths:
  /api/rams-readiness/deployments:
    get:
      operationId: projects_api_rams_readiness_get_rams_readiness
      summary: Get Rams Readiness
      parameters:
      - in: query
        name: window_days
        schema:
          default: 30
          title: Window Days
          type: integer
        required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RamsReadinessResponse'
      description: 'Deployments mobilising within ``window_days`` and their RAMS readiness.


        ``window_days`` is clamped to ``1..MAX_WINDOW_DAYS`` so a hand-typed query

        string cannot ask for an unbounded scan; the applied value comes back on

        ``window_days``, which is what the dashboard titles its tiles from.'
      tags:
      - projects.rams-readiness
      security:
      - APIKeyAuth: []
      - CookieAuth: []
components:
  schemas:
    RamsReadinessRow:
