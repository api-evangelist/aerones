openapi: 3.2.0
info:
  title: Operations Hub Commercial Offers API
  version: 0.1.1
  description: ''
servers: []
tags:
- name: commercial-offers
paths:
  /api/commercial-offers:
    get:
      operationId: projects_api_commercial_offers_list_commercial_offers
      summary: List Commercial Offers
      parameters:
      - in: query
        name: page
        schema:
          default: 1
          minimum: 1
          title: Page
          type: integer
        required: false
      - in: query
        name: page_size
        schema:
          default: 50
          maximum: 200
          minimum: 1
          title: Page Size
          type: integer
        required: false
      - in: query
        name: include_approved
        schema:
          default: false
          title: Include Approved
          type: boolean
        required: false
      - in: query
        name: required_approver_role
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Required Approver Role
        required: false
      - in: query
        name: ordering
        schema:
          anyOf:
          - type: string
          - type: 'null'
          default: -id
          title: Ordering
        required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CommercialOfferRow'
                title: Response
                type: array
      description: Return a paginated list of commercial offers filtered by status.
      tags:
      - commercial-offers
      security:
      - APIKeyAuth: []
      - CookieAuth: []
