        discount:
          anyOf:
          - type: number
          - type: string
          - type: 'null'
          title: Discount
        status:
          title: Status
          type: string
        creator_email:
          anyOf:
          - type: string
          - type: 'null'
          title: Creator Email
        reviewer_email:
          anyOf:
