openapi: 3.2.0
info:
  title: Operations Hub Projects.rams Templates API
  version: 0.1.1
  description: ''
servers: []
tags:
- name: projects.rams-templates
paths:
  /api/rams-templates:
    get:
      operationId: projects_api_rams_templates_list_rams_templates
      summary: List Rams Templates
      parameters:
      - in: query
        name: service_family_id
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Service Family Id
        required: false
      - in: query
        name: service_id
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Service Id
        required: false
      - in: query
        name: customer_id
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Customer Id
        required: false
      - in: query
        name: country_id
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Country Id
        required: false
      - in: query
        name: region_id
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Region Id
        required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/RamsTemplateResponse'
                title: Response
                type: array
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: List RAMS templates for the HSE template admin UI.
      tags:
      - projects.rams-templates
      security:
      - APIKeyAuth: []
      - CookieAuth: []
    post:
      operationId: projects_api_rams_templates_create_rams_template
      summary: Create Rams Template
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RamsTemplateResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Create a new RAMS template. At least one scope dimension is required.
      tags:
      - projects.rams-templates
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RamsTemplateCreateBody'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/rams-templates/convert-to-pdf:
    post:
      operationId: projects_api_rams_templates_convert_template_docx_to_pdf
      summary: Convert Template Docx To Pdf
      parameters: []
      responses:
        '200':
          description: OK
      description: Convert a template-preview DOCX upload to PDF and stream it back.
      tags:
      - projects.rams-templates
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                file:
                  format: binary
                  title: File
                  type: string
              required:
              - file
              title: FileParams
              type: object
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/rams-templates/bulk-edit:
    post:
      operationId: projects_api_rams_templates_bulk_edit_rams_templates
      summary: Bulk Edit Rams Templates
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RamsTemplateBulkEditResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'Apply one content change to every listed template.


        Only what the body names is overwritten, and only on templates — RAMS

        documents already generated keep the snapshot they were created with.

        Declared above the ``/{template_id}`` routes so the path is not swallowed as

        an id, same as ``/convert-to-pdf``.'
      tags:
      - projects.rams-templates
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RamsTemplateBulkEditBody'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/rams-templates/bulk-delete:
    post:
      operationId: projects_api_rams_templates_bulk_delete_rams_templates
      summary: Bulk Delete Rams Templates
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RamsTemplateBulkDeleteResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'Soft-delete a selection of templates.


        RAMS documents already made from them keep their snapshot. ``dry_run``

        answers the same question without writing, which is what the confirmation

        step shows. Declared above the ``/{template_id}`` routes.'
      tags:
      - projects.rams-templates
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RamsTemplateBulkDeleteBody'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/rams-templates/resolved:
    get:
      operationId: projects_api_rams_templates_resolve_rams_template_content
      summary: Resolve Rams Template Content
      parameters:
      - in: query
        name: service_id
        schema:
          title: Service Id
          type: integer
        required: true
      - in: query
        name: region
        schema:
          default: ''
          title: Region
          type: string
        required: false
      - in: query
        name: country_id
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Country Id
        required: false
      - in: query
        name: country_code
        schema:
          default: ''
          title: Country Code
          type: string
        required: false
      - in: query
        name: customer_id
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Customer Id
        required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RamsTemplateResolvedResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'Resolve the most-specific template (a service-scoped row beats the family

        row; then customer > country > region) a PM should start a new RAMS document

        from. No manager gate — read-only, used at document creation. The template

        family comes off ``Service.service_family`` and the optional service scope is

        the service itself — nothing is read out of the code. A service with no

        family is not RAMS-eligible. Accepts a country_code (the project context

        carries the code, not the core id). The geographic region is derived from

        that country; the RAMS `region` string is only a fallback for callers that

        pass no country.'
      tags:
      - projects.rams-templates
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/rams-templates/{template_id}:
    get:
      operationId: projects_api_rams_templates_get_rams_template
      summary: Get Rams Template
      parameters:
      - in: path
        name: template_id
        schema:
          title: Template Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RamsTemplateResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'Return a single template plus its uploaded images.


        No manager gate, and soft-deleted rows still resolve: every RAMS document

        viewer (PMs included) fetches its linked template as the drift/PPE

        baseline, which must survive HSE retiring the template. Mutations below

        stay HSE-only.'
      tags:
      - projects.rams-templates
      security:
      - APIKeyAuth: []
      - CookieAuth: []
    patch:
      operationId: projects_api_rams_templates_update_rams_template
      summary: Update Rams Template
      parameters:
      - in: path
        name: template_id
        schema:
          title: Template Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RamsTemplateResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'Update template content and/or scope. The service family and the optional

        service narrowing are immutable post-create — they identify *what* the

        template is for; duplicate it to target a different one.'
      tags:
      - projects.rams-templates
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RamsTemplateUpdateBody'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
    delete:
      operationId: projects_api_rams_templates_delete_rams_template
      summary: Delete Rams Template
      parameters:
      - in: path
        name: template_id
        schema:
          title: Template Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: Response
                type: object
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Soft-delete a template. Existing RAMS documents are unaffected.
      tags:
      - projects.rams-templates
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/rams-templates/{template_id}/images:
    post:
      operationId: projects_api_rams_templates_upload_rams_template_image
      summary: Upload Rams Template Image
      parameters:
      - in: path
        name: template_id
        schema:
          title: Template Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RamsTemplateImageResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'Upload an HSE default image for a specific template slot.


        The bytes go to GCS through the shared ``core.File`` uploader in bare mode

        (no ``FileEntityLink``) — the template-side link is this ``RamsTemplateImage``

        row, which carries the slot/label placement metadata.'
      tags:
      - projects.rams-templates
      requestBody:
        content:
          multipart/form-data:
            schema:
              title: MultiPartBodyParams
              type: object
              properties:
                slot:
                  title: Slot
                  type: string
                label:
                  default: ''
                  title: Label
                  type: string
                file:
                  format: binary
                  title: File
                  type: string
              required:
              - slot
              - file
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/rams-templates/{template_id}/images/{image_id}:
    delete:
      operationId: projects_api_rams_templates_delete_rams_template_image
      summary: Delete Rams Template Image
      parameters:
      - in: path
        name: template_id
        schema:
          title: Template Id
          type: integer
        required: true
      - in: path
        name: image_id
        schema:
          title: Image Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: Response
                type: object
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Soft-delete an HSE-uploaded default image.
      tags:
      - projects.rams-templates
      security:
      - APIKeyAuth: []
      - CookieAuth: []
components:
  schemas:
    RamsTemplateBulkDeleteResultItem:
      additionalProperties: false
      description: One template's outcome in a bulk delete.
      properties:
        id:
          title: Id
          type: integer
        status:
          $ref: '#/components/schemas/BulkDeleteStatus'
        document_count:
          default: 0
          title: Document Count
          type: integer
        error:
          default: ''
          title: Error
          type: string
      required:
      - id
      - status
      title: RamsTemplateBulkDeleteResultItem
      type: object
    RamsTemplateResponse:
      additionalProperties: false
      description: Serialised RAMS template.
      properties:
        id:
          title: Id
          type: integer
        service_family_id:
          title: Service Family Id
          type: integer
        service_family_code:
          title: Service Family Code
          type: string
        service_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Service Id
        service_code:
          default: ''
          title: Service Code
          type: string
        region_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Region Id
        region_name:
          default: ''
          title: Region Name
          type: string
        country_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Country Id
        country_name:
          default: ''
          title: Country Name
          type: string
        customer_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Customer Id
        customer_name:
          default: ''
          title: Customer Name
          type: string
        form_data:
          title: Form Data
          type: object
        layout:
          title: Layout
          type: object
        images:
          items:
            $ref: '#/components/schemas/RamsTemplateImageResponse'
          title: Images
          type: array
        updated_at:
          title: Updated At
          type: string
      required:
      - id
      - service_family_id
      - service_family_code
      - form_data
      - updated_at
      title: RamsTemplateResponse
      type: object
    RamsTemplateScopeBody:
      additionalProperties: false
      description: New scope for a template (region / country / customer).
      properties:
        region_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Region Id
        country_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Country Id
        customer_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Customer Id
      title: RamsTemplateScopeBody
      type: object
    RamsTemplateFieldUpdateBody:
      additionalProperties: false
      description: 'One field to set on every listed template.


        ``path`` addresses a leaf in ``form_data`` in the stored snake_case: a plain

        field such as ``personnel.contractor``, or a table column such as

        ``general_details.weather_table.cannot_work``. A column needs ``match``, the

        row-identity values that find the same row in every template.'
      properties:
        path:
          title: Path
          type: string
        value:
          title: Value
          type: string
        match:
          additionalProperties:
            type: string
          title: Match
          type: object
      required:
      - path
      - value
      title: RamsTemplateFieldUpdateBody
      type: object
    RamsTemplateBulkEditBody:
      additionalProperties: false
      description: 'Body for applying one content change to a whole selection of templates.


        ``field_updates`` sets individual fields and leaves their siblings alone;

        ``form_data`` replaces whole table sections. At least one must be non-empty.'
      properties:
        template_ids:
          items:
            type: integer
          title: Template Ids
          type: array
        form_data:
          title: Form Data
          type: object
        field_updates:
          items:
            $ref: '#/components/schemas/RamsTemplateFieldUpdateBody'
          title: Field Updates
          type: array
      required:
      - template_ids
      title: RamsTemplateBulkEditBody
      type: object
    RamsTemplateBulkDeleteResponse:
      additionalProperties: false
      description: Per-template report of a bulk delete, or of what one would do.
      properties:
        delete_count:
          title: Delete Count
          type: integer
        failed_count:
          title: Failed Count
          type: integer
        results:
          items:
            $ref: '#/components/schemas/RamsTemplateBulkDeleteResultItem'
          title: Results
          type: array
      required:
      - delete_count
      - failed_count
      - results
      title: RamsTemplateBulkDeleteResponse
      type: object
    RamsTemplateBulkEditResponse:
      additionalProperties: false
      description: Per-template report of a bulk edit, so a partial failure stays visible.
      properties:
        updated_count:
          title: Updated Count
          type: integer
        failed_count:
          title: Failed Count
          type: integer
        results:
          items:
            $ref: '#/components/schemas/RamsTemplateBulkEditResultItem'
          title: Results
          type: array
      required:
      - updated_count
      - failed_count
      - results
      title: RamsTemplateBulkEditResponse
      type: object
    BulkDeleteStatus:
      description: 'What a bulk delete does to one template.


        ``WILL_DELETE`` only comes back from a dry run and ``DELETED`` only from a

        real one; ``FAILED`` from both.'
      enum:
      - will_delete
      - deleted
      - failed
      title: BulkDeleteStatus
      type: string
    ErrorCode:
      description: Error codes for API errors.
      enum:
      - validation
      - server
      - auth
      - unknown
      - external
      - generic
      title: ErrorCode
      type: string
    RamsTemplateBulkDeleteBody:
      additionalProperties: false
      description: Body for deleting a selection of templates; ``dry_run`` writes nothing.
      properties:
        template_ids:
          items:
            type: integer
          title: Template Ids
          type: array
        dry_run:
          default: false
          title: Dry Run
          type: boolean
      required:
      - template_ids
      title: RamsTemplateBulkDeleteBody
      type: object
    RamsTemplateResolvedResponse:
      additionalProperties: false
      description: Resolved template content for starting a new RAMS document.
      properties:
        found:
          default: false
          title: Found
          type: boolean
        id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Id
        service_family_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Service Family Id
        service_family_code:
          default: ''
          title: Service Family Code
          type: string
        form_data:
          title: Form Data
          type: object
        layout:
          title: Layout
          type: object
      title: RamsTemplateResolvedResponse
      type: object
    RamsTemplateBulkEditResultItem:
      additionalProperties: false
      description: One template's outcome in a bulk edit.
      properties:
        id:
          title: Id
          type: integer
        success:
          title: Success
          type: boolean
        error:
          default: ''
          title: Error
          type: string
      required:
      - id
      - success
      title: RamsTemplateBulkEditResultItem
      type: object
    RamsTemplateImageResponse:
      additionalProperties: false
      description: Serialised HSE-uploaded default image.
      properties:
        id:
          title: Id
          type: integer
        slot:
          title: Slot
          type: string
        label:
          title: Label
          type: string
        file_id:
          title: File Id
          type: integer
        url:
          title: Url
          type: string
      required:
      - id
      - slot
      - label
      - file_id
      - url
      title: RamsTemplateImageResponse
      type: object
    RamsTemplateUpdateBody:
      additionalProperties: false
      description: Body for patching a RAMS template.
      properties:
        form_data:
          anyOf:
          - type: object
          - type: 'null'
          title: Form Data
        layout:
          anyOf:
          - type: object
          - type: 'null'
          title: Layout
        scope:
          anyOf:
          - $ref: '#/components/schemas/RamsTemplateScopeBody'
          - type: 'null'
      title: RamsTemplateUpdateBody
      type: object
    Error:
      additionalProperties: false
      description: Error response schema.
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          title: Message
          type: string
      required:
      - code
      - message
      title: Error
      type: object
    RamsTemplateCreateBody:
      additionalProperties: false
      description: 'Body for creating a new RAMS template.


        ``service_family_id`` (and the optional ``service_id`` narrowing) fix *what*

        the template is for and are immutable afterwards; region / country /

        customer are the editable scope.'
      properties:
        service_family_id:
          title: Service Family Id
          type: integer
        service_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Service Id
        region_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Region Id
        country_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Country Id
        customer_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Customer Id
        form_data:
          title: Form Data
          type: object
        layout:
          title: Layout
          type: object
      required:
      - service_family_id
      title: RamsTemplateCreateBody
      type: object
  securitySchemes:
    APIKeyAuth:
      type: http
      scheme: bearer
    CookieAuth:
      type: apiKey
      in: cookie
      name: opshub_prod_sessionid
    AuthBearer:
      type: http
      scheme: bearer
