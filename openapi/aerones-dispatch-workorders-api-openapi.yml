      description: 'Cancel a workorder with a recorded reason.


        Sets status to CANCELLED, persists the reason on the workorder, and

        appends a row to WorkorderStatusChangeLog with reason and actor.

        Replaces the soft-delete flow on the admin UI — cancellation keeps the

        workorder visible and audit-traceable instead of hiding it via deleted_at.'
