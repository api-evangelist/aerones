    TeamRequestNoteCreate:
      additionalProperties: false
      description: 'POST .../notes body — free-form note with optional @-mentions.


        ``mentioned_user_ids`` is persisted as a sidecar list on the activity row

        so a later email-notification step can resolve recipients without

        re-parsing the note body. Order-preserving; duplicates are dropped.'
      properties:
        text:
          maxLength: 4000
          minLength: 1
