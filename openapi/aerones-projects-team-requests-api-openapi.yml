    ResolveCertTokenPayload:
      additionalProperties: false
      description: 'Body for POST /team-requests/{id}/resolve-cert-token.


        The doc-controller picks one unresolved token and tells the server what to

        do with it: ``map`` it to an existing Certificate, ``create`` a fresh

        Certificate then map, or ``drop`` it (strip with no new requirement).


        The token is stripped from both pre-job cert answers — the

        ``required_certifications`` list and the free-text

        ``other_certification_details`` — across every site the TR spans. Matching

        nothing is a 422, not a silent success.'
      properties:
        matched_text:
          description: Token to strip from the pre-job cert answers (required_certifications and/or other_certification_details)
          minLength: 1
          title: Matched Text
          type: string
        action:
          description: What to do with the token
          enum:
          - map
          - create
          - drop
          title: Action
          type: string
        certificate_id:
          anyOf:
          - type: integer
          - type: 'null'
          description: Existing Certificate FK — required when action='map'
          title: Certificate Id
        new_certificate:
          anyOf:
          - $ref: '#/components/schemas/CertificateCreate'
          - type: 'null'
          description: Full CertificateCreate payload — required when action='create'
      required:
      - matched_text
      - action
      title: ResolveCertTokenPayload
      type: object
    CertificateCreate:
      additionalProperties: false
      description: Schema for creating a Certificate.
      properties:
        name:
          description: Certificate name
          minLength: 1
          title: Name
          type: string
        code:
          anyOf:
          - type: string
          - type: 'null'
          description: Unique short code
          title: Code
        description:
          anyOf:
          - type: string
          - type: 'null'
          description: Description
          title: Description
        default_validity_months:
          anyOf:
          - type: integer
          - type: 'null'
          description: Default expiry window in months. Omit / null for non-expiring certificates.
          title: Default Validity Months
        is_active:
          default: true
          description: Whether the certificate is active
          title: Is Active
          type: boolean
        country_id:
          anyOf:
          - type: integer
          - type: 'null'
          description: Country the certificate is intrinsic to. Omit for global.
          title: Country Id
        category_id:
          anyOf:
          - type: integer
          - type: 'null'
          description: Category FK
          title: Category Id
        source:
          anyOf:
          - type: string
          - type: 'null'
          description: Origin system (e.g. "bamboohr")
          title: Source
      required:
      - name
      title: CertificateCreate
      type: object
  securitySchemes:
    APIKeyAuth:
      type: http
      scheme: bearer
    CookieAuth:
      type: apiKey
      in: cookie
      name: opshub_prod_sessionid
    AuthBearer:
      type: http
      scheme: bearer
