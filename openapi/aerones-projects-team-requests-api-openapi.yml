    TeamRequestEventResponse:
      additionalProperties: false
      description: 'One row in the unified TR timeline.


        Carries the union of status-change and activity fields; the

        ``event_type`` discriminator tells the frontend how to render it

        (``STATUS_CHANGE`` vs an activity type like ``NOTE_ADDED``).


        ``id`` is unique within the response across both backing tables —

        activity ids are offset by 1e9 so the frontend can use it as a stable

        React key.'
      properties:
        id:
          title: Id
          type: integer
        event_type:
          title: Event Type
          type: string
        description:
          title: Description
          type: string
        resource_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Resource Id
        resource_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Resource Name
        old_status:
          anyOf:
          - type: string
          - type: 'null'
          title: Old Status
        new_status:
          anyOf:
          - type: string
          - type: 'null'
          title: New Status
        created_at:
          format: date-time
          title: Created At
          type: string
        created_by_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Created By Name
        created_by_email:
          anyOf:
          - type: string
          - type: 'null'
          title: Created By Email
        mentioned_user_ids:
          items:
            type: integer
          title: Mentioned User Ids
          type: array
      required:
      - id
      - event_type
      - description
      - created_at
      title: TeamRequestEventResponse
      type: object
