          description: Full site set for the TR (DRAFT only). The primary project_location (tied to the PPRS) is always kept; any other ids become the additional sites. Editing re-derives the required certificates from the new site set.
          title: Project Location Ids
        service_id:
          anyOf:
          - type: integer
          - type: 'null'
          description: Legacy single-service param (DRAFT only). Merged into ``service_ids`` when that is not supplied. Prefer ``service_ids``.
          title: Service Id
        service_ids:
          anyOf:
          - items:
              type: integer
            type: array
          - type: 'null'
          description: 'Full service set for the TR (DRAFT only). Replaces the current services wholesale: each id must be priced on the project''s latest offer; an empty list clears them. The first id becomes the primary ``service``.'
          title: Service Ids
