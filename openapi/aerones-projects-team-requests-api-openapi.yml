          - type: 'null'
          description: 'Effective mobilization date: the linked Set Request''s needed_by_date when one exists on this TR''s PPRS, else the TR''s own value set before any Set Request (the TR-first flow).'
          title: Mobilization Date
        mobilization_date_editable:
          default: false
          description: True when the mobilization date can be set on the TR itself — no Set Request is linked yet and the TR is not cancelled. Once a Set Request exists it owns the date and this is False (read-only).
