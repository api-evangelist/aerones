openapi: 3.2.0
info:
  title: Operations Hub Projects.team Requests API
  version: 0.1.1
  description: ''
servers: []
tags:
- name: projects.team-requests
paths:
  /api/projects/{project_id}/team-requests:
    post:
      operationId: projects_api_team_request_create_team_request
      summary: Create Team Request
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamRequestResponse'
      description: Create a DRAFT TR with N slots; first slot is the lead.
      tags:
      - projects.team-requests
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamRequestCreate'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
    get:
      operationId: projects_api_team_request_list_team_requests
      summary: List Team Requests
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: query
        name: paginate
        schema:
          default: true
          description: Enable pagination (false returns all results)
          title: Paginate
          type: boolean
        required: false
        description: Enable pagination (false returns all results)
      - in: query
        name: page
        schema:
          default: 1
          description: Page number
          minimum: 1
          title: Page
          type: integer
        required: false
        description: Page number
      - in: query
        name: page_size
        schema:
          default: 50
          description: Number of items per page
          maximum: 1000
          minimum: 1
          title: Page Size
          type: integer
        required: false
        description: Number of items per page
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TeamRequestResponse'
                title: Response
                type: array
      tags:
      - projects.team-requests
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/team-requests/site-options:
    get:
      operationId: projects_api_team_request_get_site_options
      summary: Get Site Options
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: query
        name: project_location_id
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Project Location Id
        required: false
      - in: query
        name: project_location_ids
        schema:
          anyOf:
          - items:
              type: integer
            type: array
          - type: 'null'
          title: Project Location Ids
        required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteOptionsResponse'
      description: 'Services + cert preview for the project''s commercial-offer scope.


        Without any site param: every service priced on the latest offer (the

        FE create modal renders these as the Service dropdown). With sites:

        narrows services to those ``ProjectLocation`` rows and previews the

        deduped *union* of required certs across them. ``project_location_ids``

        is the multi-select form; ``project_location_id`` is kept for back-compat.


        Registered before ``/{team_request_id}`` so the literal path segment

        wins the route match.'
      tags:
      - projects.team-requests
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/team-requests/set-options:
    get:
      operationId: projects_api_team_request_get_set_options
      summary: Get Set Options
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetOptionsResponse'
      description: 'Robot sets pickable for a new TR.


        Registered before ``/{team_request_id}`` so the literal path segment

        isn''t parsed as an integer id by django-ninja''s route matcher.'
      tags:
      - projects.team-requests
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/team-requests/offer-pairs:
    get:
      operationId: projects_api_team_request_get_team_request_offer_pairs
      summary: Get Team Request Offer Pairs
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferPairsResponse'
      description: '(Location, Service) pairs from the project''s latest commercial offer.


        Backs the combined "Location · Service" field on the TR create modal,

        mirroring the Set Request picker. Registered before ``/{team_request_id}``

        so the literal path segment wins the route match.'
      tags:
      - projects.team-requests
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/team-requests/{team_request_id}:
    get:
      operationId: projects_api_team_request_get_team_request
      summary: Get Team Request
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: team_request_id
        schema:
          title: Team Request Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamRequestResponse'
      tags:
      - projects.team-requests
      security:
      - APIKeyAuth: []
      - CookieAuth: []
    patch:
      operationId: projects_api_team_request_update_team_request
      summary: Update Team Request
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: team_request_id
        schema:
          title: Team Request Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamRequestResponse'
      description: Edit notes (any non-terminal status); people_count and certs (DRAFT only).
      tags:
      - projects.team-requests
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamRequestUpdate'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/team-requests/{team_request_id}/cert-drift:
    get:
      operationId: projects_api_team_request_get_cert_drift
      summary: Get Cert Drift
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: team_request_id
        schema:
          title: Team Request Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertDriftResponse'
      description: Diff TR's required-cert snapshot vs pre-job's current set.
      tags:
      - projects.team-requests
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/team-requests/{team_request_id}/apply-cert-drift:
    post:
      operationId: projects_api_team_request_apply_cert_drift
      summary: Apply Cert Drift
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: team_request_id
        schema:
          title: Team Request Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamRequestResponse'
      description: Re-sync TR snapshot + slot certs from pre-job. DRAFT / SUBMITTED only.
      tags:
      - projects.team-requests
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/team-requests/{team_request_id}/resolve-cert-token:
    post:
      operationId: projects_api_team_request_resolve_team_request_cert_token
      summary: Resolve Team Request Cert Token
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: team_request_id
        schema:
          title: Team Request Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertDriftResponse'
      description: 'Resolve a customer-typed cert token from pre-job: map / create / drop.


        Doc-control gated — same permission as send-to-planner, since both

        govern what reaches the planner''s queue with finalised requirements.'
      tags:
      - projects.team-requests
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveCertTokenPayload'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/team-requests/{team_request_id}/submit:
    post:
      operationId: projects_api_team_request_submit_team_request
      summary: Submit Team Request
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: team_request_id
        schema:
          title: Team Request Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamRequestResponse'
      description: DRAFT → SUBMITTED. Notifies Document Controllers after commit.
      tags:
      - projects.team-requests
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/team-requests/{team_request_id}/send-to-planner:
    post:
      operationId: projects_api_team_request_send_team_request_to_planner
      summary: Send Team Request To Planner
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: team_request_id
        schema:
          title: Team Request Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamRequestResponse'
      description: SUBMITTED → SENT_TO_PLANNER. Notifies Planners + WMS after commit.
      tags:
      - projects.team-requests
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/team-requests/{team_request_id}/cancel:
    post:
      operationId: projects_api_team_request_cancel_team_request
      summary: Cancel Team Request
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: team_request_id
        schema:
          title: Team Request Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamRequestResponse'
      description: Any non-terminal → CANCELLED. Soft-deletes active slots. Idempotent.
      tags:
      - projects.team-requests
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/team-requests/{team_request_id}/duplicate:
    post:
      operationId: projects_api_team_request_duplicate_team_request
      summary: Duplicate Team Request
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: team_request_id
        schema:
          title: Team Request Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamRequestResponse'
      description: Clone TR + slots into a new DRAFT. Rejects CANCELLED source.
      tags:
      - projects.team-requests
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/TeamRequestDuplicate'
              - type: 'null'
        required: false
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/team-requests/{team_request_id}/notes:
    post:
      operationId: projects_api_team_request_create_team_request_note
      summary: Create Team Request Note
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: team_request_id
        schema:
          title: Team Request Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamRequestEventResponse'
      description: 'Append a free-form note (with optional @-mentions) to a TR''s timeline.


        Each mentioned user (excluding the actor) is emailed via the

        ``builder.team_request.note-mention`` template. Email failures are

        swallowed per-recipient so one bad address can''t drop the rest of the

        batch or fail the API call.'
      tags:
      - projects.team-requests
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamRequestNoteCreate'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/team-requests/{team_request_id}/events:
    get:
      operationId: projects_api_team_request_list_team_request_events
      summary: List Team Request Events
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: team_request_id
        schema:
          title: Team Request Id
          type: integer
        required: true
      - in: query
        name: paginate
        schema:
          default: true
          description: Enable pagination (false returns all results)
          title: Paginate
          type: boolean
        required: false
        description: Enable pagination (false returns all results)
      - in: query
        name: page
        schema:
          default: 1
          description: Page number
          minimum: 1
          title: Page
          type: integer
        required: false
        description: Page number
      - in: query
        name: page_size
        schema:
          default: 50
          description: Number of items per page
          maximum: 1000
          minimum: 1
          title: Page Size
          type: integer
        required: false
        description: Number of items per page
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TeamRequestEventResponse'
                title: Response
                type: array
      description: 'Merged timeline: status changes + activity rows, newest first.


        Returns a UNION''d values() queryset; ``@paginate`` does LIMIT/OFFSET +

        COUNT(*) in Postgres. ``TeamRequestEventResponse`` reshapes each row

        via its before-validator.'
      tags:
      - projects.team-requests
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/team-requests/{team_request_id}/mention-candidates:
    get:
      operationId: projects_api_team_request_list_team_request_mention_candidates
      summary: List Team Request Mention Candidates
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: team_request_id
        schema:
          title: Team Request Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MentionCandidateListResponse'
      description: 'Users available for @-mention on a TR note.


        Returns every active user. The previous narrowing to doc-controllers +

        planner-notification recipients made the @-picker useless in practice

        — the only person with both perms in a given org is often the

        operator themselves, so @-mentions degraded to self-mentions. The FE

        Mentions component filters by typed prefix; the API is intentionally

        permissive.'
      tags:
      - projects.team-requests
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/team-requests/{team_request_id}/slots/{slot_id}:
    patch:
      operationId: projects_api_team_request_slots_update_team_request_slot
      summary: Update Team Request Slot
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: team_request_id
        schema:
          title: Team Request Id
          type: integer
        required: true
      - in: path
        name: slot_id
        schema:
          title: Slot Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamRequestResponse'
      description: 'Patch a single slot''s certs and/or promote it to lead.


        - ``required_certificate_ids``: when provided, replaces the slot''s set.

        - ``is_lead=True``: transfers leadership to this slot (auto-demotes the

        previous lead). ``is_lead=False`` is rejected — leadership only moves

        via promotion of another slot.

        - DRAFT: any user with project access; SUBMITTED: doc-control only.'
      tags:
      - projects.team-requests
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamRequestSlotUpdate'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/team-requests/{team_request_id}/slots/{slot_id}/approve:
    post:
      operationId: projects_api_team_request_slots_approve_team_request_slot
      summary: Approve Team Request Slot
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: team_request_id
        schema:
          title: Team Request Id
          type: integer
        required: true
      - in: path
        name: slot_id
        schema:
          title: Slot Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamRequestResponse'
      description: Planner approves the WMS-proposed person on this slot.
      tags:
      - projects.team-requests
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/team-requests/{team_request_id}/slots/{slot_id}/verify:
    post:
      operationId: projects_api_team_request_slots_verify_team_request_slot
      summary: Verify Team Request Slot
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: team_request_id
        schema:
          title: Team Request Id
          type: integer
        required: true
      - in: path
        name: slot_id
        schema:
          title: Slot Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamRequestResponse'
      description: Document Controller marks the slot's bound PPRSI as APPROVED.
      tags:
      - projects.team-requests
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/team-requests/{team_request_id}/slots/{slot_id}/reject:
    post:
      operationId: projects_api_team_request_slots_reject_team_request_slot
      summary: Reject Team Request Slot
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: team_request_id
        schema:
          title: Team Request Id
          type: integer
        required: true
      - in: path
        name: slot_id
        schema:
          title: Slot Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamRequestResponse'
      description: Document Controller rejects the slot's bound PPRSI.
      tags:
      - projects.team-requests
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SlotRejectPayload'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/team-requests/{team_request_id}/slots/{slot_id}/unreject:
    post:
      operationId: projects_api_team_request_slots_unreject_team_request_slot
      summary: Unreject Team Request Slot
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: team_request_id
        schema:
          title: Team Request Id
          type: integer
        required: true
      - in: path
        name: slot_id
        schema:
          title: Slot Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamRequestResponse'
      description: Document Controller clears a rejection, returning the PPRSI to PLANNED.
      tags:
      - projects.team-requests
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/team-requests/{team_request_id}/slots/{slot_id}/unverify:
    post:
      operationId: projects_api_team_request_slots_unverify_team_request_slot
      summary: Unverify Team Request Slot
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: string
        required: true
      - in: path
        name: team_request_id
        schema:
          title: Team Request Id
          type: integer
        required: true
      - in: path
        name: slot_id
        schema:
          title: Slot Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamRequestResponse'
      description: Document Controller resets the slot's bound PPRSI back to PLANNED.
      tags:
      - projects.team-requests
      security:
      - APIKeyAuth: []
      - CookieAuth: []
components:
  schemas:
    CertificateInfo:
      additionalProperties: false
      description: A pre-job-resolved cert (a ``Certificate`` row matched by name).
      properties:
        id:
          title: Id
          type: integer
        name:
          title: Name
          type: string
      required:
      - id
      - name
      title: CertificateInfo
      type: object
    SiteServiceOption:
      additionalProperties: false
      description: One service priced on the project's latest commercial offer.
      properties:
        id:
          title: Id
          type: integer
        code:
          title: Code
          type: string
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
      required:
      - id
      - code
      title: SiteServiceOption
      type: object
    TeamRequestSlotUpdate:
      additionalProperties: false
      description: Per-slot PATCH payload. Cert-set replace + lead-transfer.
      properties:
        required_certificate_ids:
          anyOf:
          - items:
              type: integer
            type: array
          - type: 'null'
          title: Required Certificate Ids
        is_lead:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Lead
      title: TeamRequestSlotUpdate
      type: object
    TeamRequestCreate:
      additionalProperties: false
      properties:
        pprs_id:
          description: PPRS the TR is bound to.
          title: Pprs Id
          type: integer
        people_count:
          maximum: 10
          minimum: 1
          title: People Count
          type: integer
        notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Notes
        required_certificate_ids:
          anyOf:
          - items:
              type: integer
            type: array
          - type: 'null'
          title: Required Certificate Ids
        service_id:
          anyOf:
          - type: integer
          - type: 'null'
          description: Legacy single-service param, kept for back-compat. Merged into ``service_ids`` when that is not supplied. Prefer ``service_ids``.
          title: Service Id
        service_ids:
          anyOf:
          - items:
              type: integer
            type: array
          - type: 'null'
          description: Commercial-offer-scoped services this TR's set will perform (multi-select). FE picks from /site-options (all services in the project's commercial offer). Empty / omitted means no service binding yet. Server validates each id is in scope. The first id is kept as the primary ``service`` for single-service consumers.
          title: Service Ids
        project_location_id:
          anyOf:
          - type: integer
          - type: 'null'
          description: Fallback site to use when the PPRS row has a NULL project_location (Wrike sync couldn't match the windpark). Server validates the PL is on the same project, then backfills the PPRS so subsequent TR/SR against it auto-resolve. Ignored when the PPRS already has a site.
          title: Project Location Id
        project_location_ids:
          anyOf:
          - items:
              type: integer
            type: array
          - type: 'null'
          description: Sites this TR spans (multi-select). The first id is the fallback for a PPRS with no site (same semantics as project_location_id); the resolved primary plus every other id form the TR's site set. Required certificates are the deduped union across all of them. When omitted the TR is single-site (project_location_id / PPRS).
          title: Project Location Ids
      required:
      - pprs_id
      - people_count
      title: TeamRequestCreate
      type: object
