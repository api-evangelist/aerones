    SiteOptionsResponse:
      additionalProperties: false
      description: 'Services + cert preview for a project''s commercial-offer scope.


        Services are sourced from ``ProjectOfferItem`` rows on the project''s

        latest ``ProjectOffer``. With ``project_location_id`` the endpoint also

        returns the pre-job cert resolution for that location: resolved

        ``certificates`` (matched to a Certificate row) and

        ``unresolved_certification_tokens`` (names that didn''t match + free

        text from ``other_certification_details``). The FE renders unresolved

        tokens as a warning + deep-link to pre-job; the doc-control approval

        edge is blocked while any remain.'
      properties:
        services:
          items:
            $ref: '#/components/schemas/SiteServiceOption'
          title: Services
          type: array
        certificates:
          items:
            $ref: '#/components/schemas/CertificateInfo'
          title: Certificates
          type: array
        unresolved_certification_tokens:
          items:
            type: string
          title: Unresolved Certification Tokens
          type: array
      title: SiteOptionsResponse
      type: object
