    SalesOrderLineCreate:
      additionalProperties: false
      description: Schema for creating a SalesOrderLine.
      properties:
        sales_order_id:
          description: Parent sales order ID
          title: Sales Order Id
          type: integer
        netsuite_line_id:
          anyOf:
          - type: integer
          - type: 'null'
          description: NetSuite line ID
          title: Netsuite Line Id
        service_code:
          anyOf:
          - type: string
          - type: 'null'
          description: Service code
          title: Service Code
        price:
          anyOf:
          - type: number
          - type: string
          - type: 'null'
          description: Unit price
          title: Price
        quantity:
          anyOf:
          - type: number
          - type: string
          - type: 'null'
          description: Quantity
          title: Quantity
        amount:
          anyOf:
          - type: number
          - type: string
          - type: 'null'
          description: Total amount
          title: Amount
