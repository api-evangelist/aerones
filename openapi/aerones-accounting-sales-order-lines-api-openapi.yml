openapi: 3.2.0
info:
  title: Operations Hub Accounting.sales Order Lines API
  version: 0.1.1
  description: ''
servers: []
tags:
- name: accounting.sales-order-lines
paths:
  /api/accounting/v2/sales-order-lines:
    get:
      operationId: list_sales_order_lines
      summary: List Sales Order Lines
      parameters:
      - in: query
        name: search
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Search (case-insensitive)
          title: Search
        required: false
        description: Search (case-insensitive)
      - in: query
        name: sort
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Sort by field (prefix with - for descending)
          title: Sort
        required: false
        description: Sort by field (prefix with - for descending)
      - in: query
        name: sales_order_id
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Filter by sales order ID
          title: Sales Order Id
        required: false
        description: Filter by sales order ID
      - in: query
        name: paginate
        schema:
          default: true
          description: Enable pagination (false returns all results)
          title: Paginate
          type: boolean
        required: false
        description: Enable pagination (false returns all results)
      - in: query
        name: page
        schema:
          default: 1
          description: Page number
          minimum: 1
          title: Page
          type: integer
        required: false
        description: Page number
      - in: query
        name: page_size
        schema:
          default: 50
          description: Number of items per page
          maximum: 1000
          minimum: 1
          title: Page Size
          type: integer
        required: false
        description: Number of items per page
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SalesOrderLineResponse'
                title: Response
                type: array
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: List all items with optional search, sorting, and filtering.
      tags:
      - accounting.sales-order-lines
      security:
      - APIKeyAuth: []
      - CookieAuth: []
components:
  schemas:
    SalesOrderLineResponse:
      additionalProperties: false
      description: Schema for SalesOrderLine response.
      properties:
        id:
          description: Line ID
          title: Id
          type: integer
        sales_order_id:
          description: Parent sales order ID
          title: Sales Order Id
          type: integer
        netsuite_line_id:
          anyOf:
          - type: integer
          - type: 'null'
          description: NetSuite line ID
          title: Netsuite Line Id
        service_code:
          anyOf:
          - type: string
          - type: 'null'
          description: Service code
          title: Service Code
        price:
          anyOf:
          - type: number
          - type: string
          - type: 'null'
          description: Unit price
          title: Price
        quantity:
          anyOf:
          - type: number
          - type: string
          - type: 'null'
          description: Quantity
          title: Quantity
        amount:
          anyOf:
          - type: number
          - type: string
          - type: 'null'
          description: Total amount
          title: Amount
        updated_at:
          description: Last update timestamp
          format: date-time
          title: Updated At
          type: string
      required:
      - id
      - sales_order_id
      - updated_at
      title: SalesOrderLineResponse
      type: object
    Error:
      additionalProperties: false
      description: Error response schema.
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          title: Message
          type: string
      required:
      - code
      - message
      title: Error
      type: object
    ErrorCode:
      description: Error codes for API errors.
      enum:
      - validation
      - server
      - auth
      - unknown
      - external
      - generic
      title: ErrorCode
      type: string
  securitySchemes:
    APIKeyAuth:
      type: http
      scheme: bearer
    CookieAuth:
      type: apiKey
      in: cookie
      name: opshub_prod_sessionid
    AuthBearer:
      type: http
      scheme: bearer
