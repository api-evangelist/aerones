    Success:
      additionalProperties: false
      description: 'Schema returned for successful operations.


        The `success` field is always ``true`` in this schema. Failed operations are

        represented by the :class:`Error` schema instead, so a ``false`` value does

        not occur in practice. The field is included for consistency across responses

        and to make the contract explicit for clients.'
      properties:
        success:
          default: true
          description: Always true for this schema. Errors are represented by a separate Error schema, so false is never returned.
          title: Success
          type: boolean
      title: Success
      type: object
    SalesOrderLineUpdate:
      additionalProperties: false
      description: Schema for updating a SalesOrderLine.
      properties:
        netsuite_line_id:
          anyOf:
          - type: integer
          - type: 'null'
          description: NetSuite line ID
          title: Netsuite Line Id
        service_code:
          anyOf:
          - type: string
          - type: 'null'
          description: Service code
          title: Service Code
        price:
          anyOf:
          - type: number
          - type: string
          - type: 'null'
          description: Unit price
          title: Price
        quantity:
          anyOf:
          - type: number
          - type: string
          - type: 'null'
          description: Quantity
          title: Quantity
        amount:
          anyOf:
