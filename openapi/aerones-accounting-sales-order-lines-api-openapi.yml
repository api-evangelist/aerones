      enum:
      - validation
      - server
      - auth
      - unknown
      - external
      - generic
      title: ErrorCode
      type: string
    SalesOrderLineResponse:
      additionalProperties: false
      description: Schema for SalesOrderLine response.
      properties:
        id:
          description: Line ID
          title: Id
          type: integer
        sales_order_id:
          description: Parent sales order ID
          title: Sales Order Id
          type: integer
        netsuite_line_id:
          anyOf:
          - type: integer
          - type: 'null'
          description: NetSuite line ID
          title: Netsuite Line Id
        service_code:
          anyOf:
          - type: string
          - type: 'null'
