          type: integer
        required: true
      - in: query
        name: since
        schema:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          title: Since
        required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TeamMessageResponse'
                title: Response
                type: array
      description: Team messages for the project, oldest first (DISP-2288).
      tags:
