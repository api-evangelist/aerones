          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceKpiResponse'
      description: 'Remove this project''s KPI override for a service (DISP-2988), reverting

        the board back to `Service.default_kpi_minutes` (or a `ServiceComponent`

        override, if one applies to the bucket).'
      tags:
      - dispatch.board-annotations
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/dispatch/team-messages:
    post:
      operationId: dispatch_api_board_annotations_create_team_message
      summary: Send a dispatcher message to a team
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMessageResponse'
      description: 'Create a dated free-form note from the dispatcher to one team

        (DISP-2288). Answered once from AeroTask via the ``respondToTeamMessage``

        GraphQL mutation -- this endpoint only creates the message.'
      tags:
      - dispatch.board-annotations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTeamMessagePayload'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
    get:
      operationId: dispatch_api_board_annotations_list_team_messages
      summary: List dispatcher messages to teams for a project
      parameters:
      - in: path
        name: project_id
        schema:
