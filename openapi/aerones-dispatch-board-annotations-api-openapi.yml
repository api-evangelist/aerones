openapi: 3.2.0
info:
  title: Operations Hub Dispatch.board Annotations API
  version: 0.1.1
  description: ''
servers: []
tags:
- name: dispatch.board-annotations
paths:
  /api/dispatch/v1/projects/{project_id}/dispatch/day-commentary:
    post:
      operationId: create_day_commentary_v1
      summary: Add a dispatcher's day-commentary note to a project
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayCommentaryResponse'
      description: 'Record a free-form dispatcher note about one day on a project

        (DISP-2285). Internal-only: no GraphQL field exposes this, so it never

        reaches AeroTask.'
      tags:
      - dispatch.board-annotations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DayCommentaryPayload'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
    get:
      operationId: list_day_commentary_v1
      summary: List a project's day-commentary notes for one day
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: integer
        required: true
      - in: query
        name: date
        schema:
          format: date
          title: Date
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/DayCommentaryResponse'
                title: Response
                type: array
      tags:
      - dispatch.board-annotations
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/dispatch/v1/projects/{project_id}/dispatch/service-kpis:
    get:
      operationId: list_service_kpis_v1
      summary: List KPI (benchmark duration) settings for every service used on a project
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ServiceKpiResponse'
                title: Response
                type: array
      description: 'Every service this project''s scope references, with its effective KPI

        duration -- this project''s own override (DISP-2988) if one is set, else

        the flat `Service.default_kpi_minutes` (DISP-2925). Feeds the board''s

        "Service KPIs" settings pane.'
      tags:
      - dispatch.board-annotations
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/dispatch/v1/projects/{project_id}/dispatch/service-kpis/{service_id}:
    put:
      operationId: set_service_kpi_v1
      summary: Set a project's KPI override for one service
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: integer
        required: true
      - in: path
        name: service_id
        schema:
          title: Service Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceKpiResponse'
      description: 'Set (or replace) this project''s KPI duration override for a service

        (DISP-2988) -- the value the dispatching board uses instead of the flat

        `Service.default_kpi_minutes` for every scope-based dispatch of this

        service on this project.'
      tags:
      - dispatch.board-annotations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetServiceKpiPayload'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
    delete:
      operationId: delete_service_kpi_v1
      summary: Clear a project's KPI override for one service, reverting to the global default
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: integer
        required: true
      - in: path
        name: service_id
        schema:
          title: Service Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceKpiResponse'
      description: 'Remove this project''s KPI override for a service (DISP-2988), reverting

        the board back to `Service.default_kpi_minutes` (or a `ServiceComponent`

        override, if one applies to the bucket).'
      tags:
      - dispatch.board-annotations
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/dispatch/v1/projects/{project_id}/dispatch/team-messages:
    post:
      operationId: create_team_message_v1
      summary: Send a dispatcher message to a team
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMessageResponse'
      description: 'Create a dated free-form note from the dispatcher to one team

        (DISP-2288). Answered once from AeroTask via the ``respondToTeamMessage``

        GraphQL mutation -- this endpoint only creates the message.'
      tags:
      - dispatch.board-annotations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTeamMessagePayload'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
    get:
      operationId: list_team_messages_v1
      summary: List dispatcher messages to teams for a project
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: integer
        required: true
      - in: query
        name: since
        schema:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          title: Since
        required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TeamMessageResponse'
                title: Response
                type: array
      description: Team messages for the project, oldest first (DISP-2288).
      tags:
      - dispatch.board-annotations
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/dispatch/day-commentary:
    post:
      operationId: dispatch_api_board_annotations_create_day_commentary
      summary: Add a dispatcher's day-commentary note to a project
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayCommentaryResponse'
      description: 'Record a free-form dispatcher note about one day on a project

        (DISP-2285). Internal-only: no GraphQL field exposes this, so it never

        reaches AeroTask.'
      tags:
      - dispatch.board-annotations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DayCommentaryPayload'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
    get:
      operationId: dispatch_api_board_annotations_list_day_commentary
      summary: List a project's day-commentary notes for one day
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: integer
        required: true
      - in: query
        name: date
        schema:
          format: date
          title: Date
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/DayCommentaryResponse'
                title: Response
                type: array
      tags:
      - dispatch.board-annotations
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/dispatch/service-kpis:
    get:
      operationId: dispatch_api_board_annotations_list_service_kpis
      summary: List KPI (benchmark duration) settings for every service used on a project
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ServiceKpiResponse'
                title: Response
                type: array
      description: 'Every service this project''s scope references, with its effective KPI

        duration -- this project''s own override (DISP-2988) if one is set, else

        the flat `Service.default_kpi_minutes` (DISP-2925). Feeds the board''s

        "Service KPIs" settings pane.'
      tags:
      - dispatch.board-annotations
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/projects/{project_id}/dispatch/service-kpis/{service_id}:
    put:
      operationId: dispatch_api_board_annotations_set_service_kpi
      summary: Set a project's KPI override for one service
      parameters:
      - in: path
        name: project_id
        schema:
          title: Project Id
          type: integer
        required: true
      - in: path
        name: service_id
        schema:
          title: Service Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceKpiResponse'
      description: 'Set (or replace) this project''s KPI duration override for a service

        (DISP-2988) -- the value the dispatching board uses instead of the flat

        `Service.default_kpi_minutes` for every scope-based dispatch of this

        service on this project.'
      tags:
      - dispatch.board-annotations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetServiceKpiPayload'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
    delete:
      operationId: dispatch_api_board_annotations_delete_service_kpi
      summary: Clear a project's KPI override for one service, reverting to the global default
      parameters:
      - in: path
