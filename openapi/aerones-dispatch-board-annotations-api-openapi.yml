      security:
      - APIKeyAuth: []
      - CookieAuth: []
components:
  schemas:
    TeamMessageResponse:
      additionalProperties: false
      description: A team message with its current (possibly still-pending) reaction.
      properties:
        id:
          title: Id
          type: integer
        project_resource_set_id:
          title: Project Resource Set Id
          type: integer
        date:
          format: date
          title: Date
          type: string
        text:
          title: Text
          type: string
        reaction:
          title: Reaction
          type: string
        reaction_comment:
          anyOf:
          - type: string
          - type: 'null'
          title: Reaction Comment
        reacted_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Reacted At
        sent_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Sent By
        sent_at:
          format: date-time
          title: Sent At
          type: string
        attachments:
          items:
            $ref: '#/components/schemas/TeamMessageAttachmentResponse'
          title: Attachments
          type: array
      required:
      - id
      - project_resource_set_id
      - date
      - text
      - reaction
      - sent_at
      - attachments
      title: TeamMessageResponse
      type: object
    TeamMessageAttachmentResponse:
      additionalProperties: false
      description: One image attached to a team message.
      properties:
        id:
          title: Id
          type: integer
        url:
          anyOf:
          - type: string
          - type: 'null'
          title: Url
      required:
      - id
      title: TeamMessageAttachmentResponse
      type: object
    CreateTeamMessagePayload:
      additionalProperties: false
      description: 'Payload for a dispatcher message to a team, dated today or later

        (DISP-2288). Images are pre-uploaded via ``POST /core/v1/files/`` (bare);

        their ids are passed here to be linked in the same transaction.'
      properties:
        project_resource_set_id:
          title: Project Resource Set Id
          type: integer
        date:
          format: date
          title: Date
          type: string
        text:
          title: Text
          type: string
        image_file_ids:
          items:
            type: integer
          title: Image File Ids
          type: array
      required:
      - project_resource_set_id
      - date
      - text
      title: CreateTeamMessagePayload
      type: object
    SetServiceKpiPayload:
      additionalProperties: false
      description: Payload to set a project's KPI override for one service (DISP-2988).
      properties:
        kpi_minutes:
          title: Kpi Minutes
          type: integer
      required:
      - kpi_minutes
      title: SetServiceKpiPayload
      type: object
    ServiceKpiResponse:
      additionalProperties: false
      description: 'One service''s KPI (benchmark duration) setting for a project (DISP-2988).


        `kpi_minutes` is what the dispatching board actually uses for this

        service on this project today -- the project override when

        `has_override` is true, else the flat `Service.default_kpi_minutes`.'
      properties:
        service_id:
          title: Service Id
          type: integer
        service_code:
          title: Service Code
          type: string
        kpi_minutes:
          title: Kpi Minutes
          type: integer
        default_kpi_minutes:
          title: Default Kpi Minutes
          type: integer
        has_override:
          title: Has Override
          type: boolean
      required:
      - service_id
      - service_code
      - kpi_minutes
      - default_kpi_minutes
      - has_override
      title: ServiceKpiResponse
      type: object
    DayCommentaryResponse:
      additionalProperties: false
      description: One day-commentary entry.
      properties:
        id:
          title: Id
          type: integer
        date:
          format: date
          title: Date
          type: string
        category:
          anyOf:
          - type: string
          - type: 'null'
          title: Category
        text:
          title: Text
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        created_by_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Created By Name
      required:
      - id
      - date
      - text
      - created_at
      title: DayCommentaryResponse
      type: object
    DayCommentaryPayload:
      additionalProperties: false
      description: Payload for a dispatcher's free-form note about one day (DISP-2285).
      properties:
        date:
          format: date
          title: Date
          type: string
        category:
          anyOf:
          - type: string
          - type: 'null'
          title: Category
        text:
          title: Text
          type: string
      required:
      - date
      - text
      title: DayCommentaryPayload
      type: object
  securitySchemes:
    APIKeyAuth:
      type: http
      scheme: bearer
    CookieAuth:
      type: apiKey
      in: cookie
      name: opshub_prod_sessionid
    AuthBearer:
      type: http
      scheme: bearer
