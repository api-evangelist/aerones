      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountingOverviewSummary'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'Get aggregated summary of accounting overview data with the same filtering as /overview/.


        Args:

        request: The HTTP request object.

        params: Query parameters for filtering (same as overview endpoint except pagination).


        Returns aggregated data:

        - client_count: Total number of unique clients

        - project_count: Total number of projects (same as total-count in /overview/)

        - total_revenue_eur/usd/aud: Summed revenue by currency

        - added_to_invoice_revenue_eur/usd/aud: Summed added to invoice revenue by currency

        - actual_planned_revenue_eur/usd/aud: Summed planned revenue by currency

        - fixed_planned_revenue_eur/usd/aud: Summed fixed planned revenue by currency


        Supports the same filtering as /overview/:

        - search: Search by project code (partial matching)

        - clients: Filter by client names (comma-separated)

        - pm: Filter by project managers (comma-separated)

        - region: Filter by regions (comma-separated)

        - country: Filter by countries (comma-separated)

        - start_date/end_date: Date range filtering

        - project_status: Filter by core project status (comma-separated)

        - service_code: Filter by billable service code (comma-separated)

        - Revenue range filters (min/max): total_revenue, added_to_invoice_revenue, actual_planned_revenue, fixed_planned_revenue (all with _eur/_usd/_aud variants)

        - Quantity range filters (min/max): total_quantity, actual_planned_quantity

        - Closure date filters: closure_start_date, closure_end_date'
      tags:
      - Accounting
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/accounting/overview/filters:
    get:
      operationId: accounting_api_v2_get_accounting_overview_filters
      summary: Get Accounting Overview Filters
      parameters:
      - in: query
        name: start_date
        schema:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          description: Start date for filtering charges
          title: Start Date
        required: false
        description: Start date for filtering charges
      - in: query
        name: end_date
        schema:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          description: End date for filtering charges
          title: End Date
        required: false
        description: End date for filtering charges
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountingOverviewFilters'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'Get available filter values for accounting overview data.


        Args:

        request: The HTTP request object.

        params: Query parameters for date range filtering (optional).


        Returns unique values for filtering:

        - clients: List of all unique client names

        - pm: List of all unique project managers

        - regions: List of all unique regions (continents)

        - countries: List of all unique countries

        - project_status: List of all unique core project statuses

        - service_code: List of all unique billable service codes


        Supports optional date range filtering:

        - start_date/end_date: Limit results to projects within date range'
      tags:
      - Accounting
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/accounting/overview/export:
    get:
      operationId: accounting_api_v2_export_accounting_overview_to_excel
