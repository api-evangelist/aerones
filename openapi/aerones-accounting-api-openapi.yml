components:
  schemas:
    Client:
      additionalProperties: false
      description: Schema for client.
      properties:
        id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Id
        name:
          anyOf:
          - type: string
          - type: 'null'
          description: Client name.
          title: Name
      title: Client
      type: object
    ErrorCode:
      description: Error codes for API errors.
      enum:
      - validation
      - server
      - auth
      - unknown
      - external
      - generic
      title: ErrorCode
      type: string
    ChargeBulkReview:
      additionalProperties: false
      description: 'Input for bulk PM/customer review-status transitions.


        Exactly one of `ids` or `email_send_log_id` must be set. `ids` names the

        charges directly; `email_send_log_id` resolves to every charge linked to

        that sent email (`EmailSendLogCharge`).'
      properties:
        ids:
          anyOf:
          - items:
              type: integer
            minItems: 1
            type: array
          - type: 'null'
          description: List of charge IDs to transition
          title: Ids
        email_send_log_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          description: Transition every charge linked to this sent email
          title: Email Send Log Id
      title: ChargeBulkReview
      type: object
    MissingChargesTrackerResponse:
      additionalProperties: false
      description: Response for missing charges tracker endpoint.
      properties:
        total_missing_records:
          description: Total number of robot sets with missing data
          title: Total Missing Records
          type: integer
        projects_affected:
          description: Number of unique projects affected
          title: Projects Affected
          type: integer
        critical_count:
          description: Number of records with 3+ days delay
          title: Critical Count
          type: integer
        total_suggested_amount:
          default: 0.0
          description: Sum of suggested amounts across all missing records in project currency
          title: Total Suggested Amount
          type: number
        total_suggested_amount_eur:
          default: 0.0
          description: Sum of suggested amounts converted to EUR
          title: Total Suggested Amount Eur
          type: number
        total_suggested_amount_usd:
          default: 0.0
          description: Sum of suggested amounts converted to USD
          title: Total Suggested Amount Usd
          type: number
        total_suggested_amount_aud:
          default: 0.0
          description: Sum of suggested amounts converted to AUD
          title: Total Suggested Amount Aud
          type: number
        daily_reports_missing:
          description: Legacy metric, kept for compatibility (always 0)
          title: Daily Reports Missing
          type: integer
        available_project_codes:
          description: List of available project codes after filters
          items:
            type: string
          title: Available Project Codes
          type: array
        available_set_names:
          description: List of available set names after filters
          items:
            type: string
          title: Available Set Names
          type: array
        available_project_managers:
          description: List of available project managers for filtering
          items:
            type: string
          title: Available Project Managers
          type: array
        affected_projects:
          description: List of affected projects after filters
          items:
            $ref: '#/components/schemas/MissingChargesAffectedProject'
          title: Affected Projects
          type: array
        available_reasons:
          description: List of all available reason badges for filtering
          items:
            $ref: '#/components/schemas/MissingDataReasonBadge'
          title: Available Reasons
          type: array
        items:
          description: List of robot sets with missing data
          items:
            $ref: '#/components/schemas/RobotSetMissingData'
          title: Items
          type: array
        last_synced_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: Timestamp of last cache sync (None if using live data)
          title: Last Synced At
        platform_projects_not_found:
          description: Project codes not found in Platform API
          items:
            type: string
          title: Platform Projects Not Found
          type: array
        projects_mapped:
          default: 0
          description: Projects mapped to internal IDs
          title: Projects Mapped
          type: integer
        projects_total:
          default: 0
          description: Total projects observed in the data set
          title: Projects Total
          type: integer
        workload_fetch_failed_count:
          default: 0
          description: Number of projects where workload fetch failed
          title: Workload Fetch Failed Count
          type: integer
        workload_auth_missing:
          default: false
          description: True if workload fetch skipped due to missing auth
          title: Workload Auth Missing
          type: boolean
        projects_missing_in_db:
          description: Project codes missing in internal Projects table
          items:
            type: string
          title: Projects Missing In Db
          type: array
        planned_projects_discovered:
          default: 0
          description: Number of project codes discovered from planned resource sets
          title: Planned Projects Discovered
          type: integer
        planned_only_projects:
          default: 0
          description: Projects found via planned resource sets but not in NetSuite charges
          title: Planned Only Projects
          type: integer
      required:
      - total_missing_records
      - projects_affected
      - critical_count
      - daily_reports_missing
      - available_project_codes
      - available_set_names
      - affected_projects
      - available_reasons
      - items
      title: MissingChargesTrackerResponse
      type: object
    AccountingOverviewFilters:
      additionalProperties: false
      description: Filters schema for accounting overview unique values.
      properties:
        clients:
          description: All client names found in accounting overview dataset
          items:
            type: string
          title: Clients
          type: array
        pm:
          description: All project managers found in projects
          items:
            type: string
          title: Pm
          type: array
        regions:
          description: All regions (continents) from projects
          items:
            type: string
          title: Regions
          type: array
        countries:
          description: All countries used in projects
          items:
            type: string
          title: Countries
          type: array
        project_status:
          description: All core project statuses found in projects
          items:
            type: string
          title: Project Status
          type: array
        service_code:
          description: All billable service codes found in charges
          items:
            type: string
          title: Service Code
          type: array
        service_unit_type:
          description: All service unit types found in charges
          items:
            type: string
          title: Service Unit Type
          type: array
        robot_set:
          description: All robot sets found in projects
          items:
            type: string
          title: Robot Set
          type: array
      required:
      - clients
      - pm
      - regions
      - countries
      - project_status
      - service_code
      - service_unit_type
      - robot_set
      title: AccountingOverviewFilters
      type: object
