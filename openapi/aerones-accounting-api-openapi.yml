          title: Code
          type: string
        robot_set_name:
          anyOf:
          - type: string
          - type: 'null'
          description: Name of robot set
          title: Robot Set Name
        client:
          anyOf:
          - $ref: '#/components/schemas/Client'
          - type: 'null'
          description: Client of the project
        country:
          anyOf:
          - $ref: '#/components/schemas/Country'
          - type: 'null'
          description: Country of the project
        total_quantity:
          anyOf:
          - type: integer
          - type: 'null'
          description: Total quantity of unique assets charged
          title: Total Quantity
        blade_count:
          anyOf:
          - type: integer
          - type: 'null'
          description: Count of unique blades (turbine components) charged
          title: Blade Count
        wtg_count:
          anyOf:
          - type: integer
          - type: 'null'
          description: Count of unique WTGs (turbines) charged via WTG-level scope items
