        total_revenue_eur:
          anyOf:
          - type: number
          - type: 'null'
          description: Total revenue in EUR
          title: Total Revenue Eur
        total_revenue_usd:
          anyOf:
          - type: number
          - type: 'null'
          description: Total revenue in USD
          title: Total Revenue Usd
        total_revenue_aud:
          anyOf:
          - type: number
          - type: 'null'
          description: Total revenue in AUD
          title: Total Revenue Aud
        added_to_invoice_revenue:
          anyOf:
          - type: number
          - type: 'null'
          description: Total added to invoice revenue in project's currency
