        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'Get missing charges tracker data for all projects.


        Returns projects with missing charge entries,

        organized by robot set with delay calculations.


        By default reads from cache (fast). Set use_cache=false to fetch live data.


        Data sources:

        - Cache: Local database table (fast, updated hourly)

        - Live: Platform API + NetSuite API (slow, real-time)


        Args:

        request: HTTP request object.

        params: Query parameters including pagination, search, filters.


        Query params:

        - page: Page number (default 1).

        - page_size: Items per page (default 10).

        - search: Search term for project code or set name (optional).

        - reason_filter: Filter by reason type: ''charge-entry'' or ''sales-order-missing'' (optional).

        - use_cache: If True (default), read from cache. If False, fetch live data.


        Returns:

        MissingChargesTrackerResponse with summary stats and paginated items.'
      tags:
      - Accounting
      security:
      - APIKeyAuth: []
      - CookieAuth: []
