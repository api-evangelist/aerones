      description: 'Get accounting overview of revenue with filtering and pagination.


        Args:

        request: The HTTP request object.

        params: Query parameters for filtering and pagination.


        Supports filtering by:

        - search: Search by project code (partial matching)

        - clients: Filter by client names (comma-separated)

        - pm: Filter by project managers (comma-separated)

        - region: Filter by regions (comma-separated)

        - country: Filter by countries (comma-separated)

        - start_date/end_date: Date range filtering

        - project_status: Filter by core project status (comma-separated)

        - service_code: Filter by billable service code (comma-separated)

        - Revenue range filters (min/max): total_revenue, added_to_invoice_revenue, actual_planned_revenue (all with _eur/_usd/_aud variants)

        - Quantity range filters (min/max): total_quantity, actual_planned_quantity


        Pagination is handled automatically with page/page_size parameters.

        Response headers include Page, Page-Size, and Total-Count.'
