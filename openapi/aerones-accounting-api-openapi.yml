        suggested_amount_eur:
          anyOf:
          - type: number
          - type: 'null'
          description: Approximate revenue converted to EUR
          title: Suggested Amount Eur
        suggested_amount_usd:
          anyOf:
          - type: number
          - type: 'null'
          description: Approximate revenue converted to USD
          title: Suggested Amount Usd
        suggested_amount_aud:
          anyOf:
          - type: number
          - type: 'null'
          description: Approximate revenue converted to AUD
          title: Suggested Amount Aud
      required:
      - project_code
      - project_id
      - set_name
      - set_id
      - work_date
      - delay_days
      - reasons
