openapi: 3.2.0
info:
  title: Operations Hub Services API
  version: 0.1.1
  description: ''
servers: []
tags:
- name: Services
paths:
  /api/services/pre-job/questions/{service_code}:
    get:
      operationId: services_api_get_pre_job_questions
      summary: Get Pre Job Questions
      parameters:
      - in: path
        name: service_code
        schema:
          title: Service Code
          type: string
        required: true
      - in: query
        name: addons
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Additional service codes that can/or are added to the service.
          title: Addons
        required: false
        description: Additional service codes that can/or are added to the service.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ServicePreJobQuestionDefinition'
                title: Response
                type: array
      description: Retrieve pre-job questions for a specific service code and optional addons.
      tags:
      - Services
      deprecated: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
components:
  schemas:
    ServicePreJobQuestionType:
      description: Allowed type of the pre job question.
      enum:
      - text
      - select
      - multiselect
      - boolean
      - file
      - number
      title: ServicePreJobQuestionType
      type: string
    ServicePreJobQuestionDefinition:
      additionalProperties: false
      description: Single definition of a pre job question that can be attached to service.
      properties:
        key:
          description: Unique key for the question. This key is used to store the question answer, when referencing it in a project service questionnaire.
          title: Key
          type: string
        title:
          description: Human readable title of the question.
          title: Title
          type: string
        type:
          $ref: '#/components/schemas/ServicePreJobQuestionType'
          description: Type of the value in the answer of the question.
        required:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Is the question required to be answered.
          title: Required
        choices:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          default: []
          description: List of possible choices for the question. Only used when type is select or multiselect.
          title: Choices
        tooltip:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional tooltip text to provide additional information about the question.
          title: Tooltip
        unit:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional unit for number type questions (e.g., kg, m, etc.).
          title: Unit
      required:
      - key
      - title
      - type
      title: ServicePreJobQuestionDefinition
      type: object
  securitySchemes:
    APIKeyAuth:
      type: http
      scheme: bearer
    CookieAuth:
      type: apiKey
      in: cookie
      name: opshub_prod_sessionid
    AuthBearer:
      type: http
      scheme: bearer
