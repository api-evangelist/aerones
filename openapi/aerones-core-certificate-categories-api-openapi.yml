openapi: 3.2.0
info:
  title: Operations Hub Core.certificate Categories API
  version: 0.1.1
  description: ''
servers: []
tags:
- name: core.certificate-categories
paths:
  /api/core/v1/certificate-categories:
    get:
      operationId: list_certificatecategorys
      summary: List CertificateCategorys
      parameters:
      - in: query
        name: search
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Search by name (case-insensitive)
          title: Search
        required: false
        description: Search by name (case-insensitive)
      - in: query
        name: sort
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Sort by field (prefix with - for descending)
          title: Sort
        required: false
        description: Sort by field (prefix with - for descending)
      - in: query
        name: paginate
        schema:
          default: true
          description: Enable pagination (false returns all results)
          title: Paginate
          type: boolean
        required: false
        description: Enable pagination (false returns all results)
      - in: query
        name: page
        schema:
          default: 1
          description: Page number
          minimum: 1
          title: Page
          type: integer
        required: false
        description: Page number
      - in: query
        name: page_size
        schema:
          default: 50
          description: Number of items per page
          maximum: 1000
          minimum: 1
          title: Page Size
          type: integer
        required: false
        description: Number of items per page
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CertificateCategoryResponse'
                title: Response
                type: array
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: List all items with optional search, sorting, and pagination.
      tags:
      - core.certificate-categories
      security:
      - APIKeyAuth: []
      - CookieAuth: []
    post:
      operationId: create_certificatecategory
      summary: Create CertificateCategory
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateCategoryResponse'
      description: Create a new item.
      tags:
      - core.certificate-categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CertificateCategoryCreate'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/core/v1/certificate-categories/{id}:
    get:
      operationId: get_certificatecategory
      summary: Get CertificateCategory
      parameters:
      - in: path
        name: id
        schema:
          title: Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateCategoryResponse'
      description: Get a single item by ID.
      tags:
      - core.certificate-categories
      security:
      - APIKeyAuth: []
      - CookieAuth: []
    patch:
      operationId: update_certificatecategory
      summary: Update CertificateCategory
      parameters:
      - in: path
        name: id
        schema:
          title: Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateCategoryResponse'
      description: Update an item.
      tags:
      - core.certificate-categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CertificateCategoryUpdate'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
    delete:
      operationId: delete_certificatecategory
      summary: Delete CertificateCategory
      parameters:
      - in: path
        name: id
        schema:
          title: Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
      description: Soft delete an item.
      tags:
      - core.certificate-categories
      security:
      - APIKeyAuth: []
      - CookieAuth: []
components:
  schemas:
    ErrorCode:
      description: Error codes for API errors.
      enum:
      - validation
      - server
      - auth
      - unknown
      - external
      - generic
      title: ErrorCode
      type: string
    CertificateCategoryResponse:
      additionalProperties: false
      description: Schema for CertificateCategory response.
      properties:
        updated_at:
          description: Last update timestamp
          format: date-time
          title: Updated At
          type: string
        id:
          title: Id
          type: integer
        name:
          title: Name
          type: string
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        color:
          anyOf:
          - type: string
          - type: 'null'
          title: Color
        sort_order:
          title: Sort Order
          type: integer
      required:
      - updated_at
      - id
      - name
      - sort_order
      title: CertificateCategoryResponse
      type: object
    CertificateCategoryUpdate:
      additionalProperties: false
      description: Schema for updating a CertificateCategory (partial).
      properties:
        name:
          anyOf:
          - minLength: 1
            type: string
          - type: 'null'
          title: Name
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        color:
          anyOf:
          - type: string
          - type: 'null'
          title: Color
        sort_order:
          anyOf:
          - type: integer
          - type: 'null'
          title: Sort Order
      title: CertificateCategoryUpdate
      type: object
    CertificateCategoryCreate:
      additionalProperties: false
      description: Schema for creating a CertificateCategory.
      properties:
        name:
          description: Category name
          minLength: 1
          title: Name
          type: string
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        color:
          anyOf:
          - type: string
          - type: 'null'
          description: Display color
          title: Color
        sort_order:
          default: 0
          description: Display sort order
          title: Sort Order
          type: integer
      required:
      - name
      title: CertificateCategoryCreate
      type: object
    Error:
      additionalProperties: false
      description: Error response schema.
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          title: Message
          type: string
      required:
      - code
      - message
      title: Error
      type: object
    Success:
      additionalProperties: false
      description: 'Schema returned for successful operations.


        The `success` field is always ``true`` in this schema. Failed operations are

        represented by the :class:`Error` schema instead, so a ``false`` value does

        not occur in practice. The field is included for consistency across responses

        and to make the contract explicit for clients.'
      properties:
        success:
          default: true
          description: Always true for this schema. Errors are represented by a separate Error schema, so false is never returned.
          title: Success
          type: boolean
      title: Success
      type: object
  securitySchemes:
    APIKeyAuth:
      type: http
      scheme: bearer
    CookieAuth:
      type: apiKey
      in: cookie
      name: opshub_prod_sessionid
    AuthBearer:
      type: http
      scheme: bearer
