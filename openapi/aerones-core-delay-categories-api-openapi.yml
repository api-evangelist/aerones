openapi: 3.2.0
info:
  title: Operations Hub Core.delay Categories API
  version: 0.1.1
  description: ''
servers: []
tags:
- name: core.delay-categories
paths:
  /api/core/v1/delay-categories:
    get:
      operationId: list_delaycategorys
      summary: List DelayCategorys
      parameters:
      - in: query
        name: search
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Search by code (case-insensitive)
          title: Search
        required: false
        description: Search by code (case-insensitive)
      - in: query
        name: sort
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Sort by field (prefix with - for descending)
          title: Sort
        required: false
        description: Sort by field (prefix with - for descending)
      - in: query
        name: enabled
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Filter by enabled status
          title: Enabled
        required: false
        description: Filter by enabled status
      - in: query
        name: paginate
        schema:
          default: true
          description: Enable pagination (false returns all results)
          title: Paginate
          type: boolean
        required: false
        description: Enable pagination (false returns all results)
      - in: query
        name: page
        schema:
          default: 1
          description: Page number
          minimum: 1
          title: Page
          type: integer
        required: false
        description: Page number
      - in: query
        name: page_size
        schema:
          default: 50
          description: Number of items per page
          maximum: 1000
          minimum: 1
          title: Page Size
          type: integer
        required: false
        description: Number of items per page
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/DelayCategoryResponse'
                title: Response
                type: array
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: List all items with optional search, sorting, and pagination.
      tags:
      - core.delay-categories
      security:
      - APIKeyAuth: []
      - CookieAuth: []
    post:
      operationId: create_delaycategory
      summary: Create DelayCategory
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DelayCategoryResponse'
      description: Create a new item.
      tags:
      - core.delay-categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DelayCategoryCreate'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/core/v1/delay-categories/{id}:
    get:
      operationId: get_delaycategory
      summary: Get DelayCategory
      parameters:
      - in: path
        name: id
        schema:
          title: Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DelayCategoryResponse'
      description: Get a single item by ID.
      tags:
      - core.delay-categories
      security:
      - APIKeyAuth: []
      - CookieAuth: []
    patch:
      operationId: update_delaycategory
      summary: Update DelayCategory
      parameters:
      - in: path
        name: id
        schema:
          title: Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DelayCategoryResponse'
      description: Update an item.
      tags:
      - core.delay-categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DelayCategoryUpdate'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
    delete:
      operationId: delete_delaycategory
      summary: Delete DelayCategory
      parameters:
      - in: path
        name: id
        schema:
          title: Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
      description: Soft delete an item.
      tags:
      - core.delay-categories
      security:
      - APIKeyAuth: []
      - CookieAuth: []
components:
  schemas:
    ErrorCode:
      description: Error codes for API errors.
      enum:
      - validation
      - server
      - auth
      - unknown
      - external
      - generic
      title: ErrorCode
      type: string
    DelayCategoryCreate:
      additionalProperties: false
      description: Schema for creating a DelayCategory.
      properties:
        code:
          description: Delay category code
          minLength: 1
          title: Code
          type: string
        description:
          anyOf:
          - type: string
          - type: 'null'
          description: Category description
          title: Description
        enabled:
          default: true
          description: Whether category is enabled
          title: Enabled
          type: boolean
        include_in_client_reports:
          default: true
          description: Include in client reports
          title: Include In Client Reports
          type: boolean
      required:
      - code
      title: DelayCategoryCreate
      type: object
    Error:
      additionalProperties: false
      description: Error response schema.
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          title: Message
          type: string
      required:
      - code
      - message
      title: Error
      type: object
    Success:
      additionalProperties: false
      description: 'Schema returned for successful operations.


        The `success` field is always ``true`` in this schema. Failed operations are

        represented by the :class:`Error` schema instead, so a ``false`` value does

        not occur in practice. The field is included for consistency across responses

        and to make the contract explicit for clients.'
      properties:
        success:
          default: true
          description: Always true for this schema. Errors are represented by a separate Error schema, so false is never returned.
          title: Success
          type: boolean
      title: Success
      type: object
    DelayCategoryResponse:
      additionalProperties: false
      description: Schema for DelayCategory response.
      properties:
        updated_at:
          description: Last update timestamp
          format: date-time
          title: Updated At
          type: string
        id:
          description: Delay category ID
          title: Id
          type: integer
        code:
          description: Delay category code
          title: Code
          type: string
        description:
          anyOf:
          - type: string
          - type: 'null'
          description: Category description
          title: Description
        enabled:
          description: Whether category is enabled
          title: Enabled
          type: boolean
        include_in_client_reports:
          description: Include in client reports
          title: Include In Client Reports
          type: boolean
      required:
      - updated_at
      - id
      - code
      - enabled
      - include_in_client_reports
      title: DelayCategoryResponse
      type: object
    DelayCategoryUpdate:
      additionalProperties: false
      description: Schema for updating a DelayCategory.
      properties:
        code:
          anyOf:
          - minLength: 1
            type: string
          - type: 'null'
          description: Delay category code
          title: Code
        description:
          anyOf:
          - type: string
          - type: 'null'
          description: Category description
          title: Description
        enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Whether category is enabled
          title: Enabled
        include_in_client_reports:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Include in client reports
          title: Include In Client Reports
      title: DelayCategoryUpdate
      type: object
  securitySchemes:
    APIKeyAuth:
      type: http
      scheme: bearer
    CookieAuth:
      type: apiKey
      in: cookie
      name: opshub_prod_sessionid
    AuthBearer:
      type: http
      scheme: bearer
