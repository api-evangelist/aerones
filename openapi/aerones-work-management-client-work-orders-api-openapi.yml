  /api/work-management/client-work-orders/complete:
    post:
      operationId: client_work_management_endpoints_client_work_orders_complete_work_orders
      summary: Complete Work Orders (and cascade linked anomalies)
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompleteWorkOrdersResponse'
      description: 'Atomically complete each work order and advance its linked anomaly.


        Productionises AECP-333 (pairs the portal''s AECP-329 two-call orchestration):

        per work order, in one transaction, set ``status=completed`` (stamping

        ``completed_date``) and — if it has a linked anomaly — advance that anomaly''s

        ``stage`` -> ``RESOLUTION_COMPLETE`` (which recomputes ``resolution_status``

        -> ``RESOLVED``). A WO with no anomaly completes with ``cascade="none"``; if a

        WO''s cascade fails, that WO rolls back (``cascade="failed"``) while the others

        still succeed. Gated on work-management-manage; the cascade is RLS-scoped, so

        it can only advance anomalies the caller''s customer owns.'
      tags:
      - work-management.client-work-orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteWorkOrdersPayload'
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
