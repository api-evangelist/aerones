      description: 'Get available filter values for a project''s deviations.


        Args:

        request: HTTP request object

        project_id: Project UUID

        params: Query parameters with optional start_date and end_date


        Returns:

        ProjectDeviationsFilters with roboticSets and serviceCodes'
      tags:
      - deviations
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/deviations/{project_id}/summary:
    get:
      operationId: deviations_api_get_project_deviations_summary
