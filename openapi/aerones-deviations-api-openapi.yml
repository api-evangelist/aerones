        required: false
        description: Filter by robotic set
      - in: query
        name: service_code
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by service code
          title: Service Code
        required: false
        description: Filter by service code
      - in: query
        name: page
        schema:
          default: 1
          description: Page number for pagination
          title: Page
          type: integer
        required: false
        description: Page number for pagination
      - in: query
        name: page_size
        schema:
          default: 10
          description: Number of items per page
          title: Page Size
          type: integer
        required: false
        description: Number of items per page
      - in: query
        name: format
        schema:
          anyOf:
          - $ref: '#/components/schemas/ExportFormat'
          - type: 'null'
          description: 'Export format: ''csv'' or ''xlsx''. If not provided, returns JSON.'
        required: false
        description: 'Export format: ''csv'' or ''xlsx''. If not provided, returns JSON.'
      responses:
        '200':
          description: OK
