components:
  schemas:
    ErrorCode:
      description: Error codes for API errors.
      enum:
      - validation
      - server
      - auth
      - unknown
      - external
      - generic
      title: ErrorCode
      type: string
    GlobalPeriodTypeEnum:
      description: Global period type enumeration (weekly or monthly).
      enum:
      - weekly
      - monthly
      title: GlobalPeriodTypeEnum
      type: string
    ProjectDeviationsFilters:
      additionalProperties: false
      description: Response schema for GET /deviations/{project_id}/filters.
      properties:
        robotic_sets:
          description: All unique robotic sets
          items:
            type: string
          title: Robotic Sets
          type: array
        service_codes:
          description: All unique service codes
          items:
            type: string
          title: Service Codes
          type: array
      title: ProjectDeviationsFilters
      type: object
    DeviationCategoryEnum:
      description: "Deviation category enumeration.\n\nInternal categories (fault_side = Internal):\n- Set Readiness, Rotation, Missing reports, Low performance,\n  Sales, Planning, Health & Safety\n\nExternal categories (fault_side = External):\n- Customer, Weather, Previous project delay"
      enum:
      - Set Readiness
      - Rotation
      - Missing reports
      - Low performance
      - Sales
      - Planning
      - Health & Safety
      - Customer
      - Weather
      - Previous project delay
      title: DeviationCategoryEnum
      type: string
    FaultSideEnum:
      description: Fault side enumeration.
      enum:
      - Internal
      - External
      title: FaultSideEnum
      type: string
    DeviationCountry:
      additionalProperties: false
      description: Country information for deviations.
      properties:
        code:
          description: Country code in alpha-2
          title: Code
          type: string
        name:
          description: Human readable country name
          title: Name
          type: string
        region:
          anyOf:
          - type: string
          - type: 'null'
          description: Custom region name a country belongs to
          title: Region
      required:
      - code
      - name
      title: DeviationCountry
      type: object
    PeriodTypeEnum:
      description: Period type enumeration.
      enum:
      - daily
      - weekly
      title: PeriodTypeEnum
      type: string
    Error:
      additionalProperties: false
      description: Error response schema.
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          title: Message
          type: string
      required:
      - code
      - message
      title: Error
      type: object
    GlobalDeviationsFilters:
      additionalProperties: false
      description: Response schema for GET /deviations/filters.
      properties:
        project_codes:
          description: All unique project codes
          items:
            type: string
          title: Project Codes
          type: array
        country_codes:
          description: All unique countries with code and name
          items:
            $ref: '#/components/schemas/CountryFilter'
          title: Country Codes
          type: array
        regions:
          description: All unique region names
          items:
            type: string
          title: Regions
          type: array
      title: GlobalDeviationsFilters
      type: object
    GlobalPeriod:
      additionalProperties: false
