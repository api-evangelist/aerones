        required: false
        description: 'Period type: ''daily'' (default) or ''weekly'''
      - in: query
        name: start_date
        schema:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          description: Filter by start date (YYYY-MM-DD)
          title: Start Date
        required: false
        description: Filter by start date (YYYY-MM-DD)
      - in: query
        name: end_date
        schema:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          description: Filter by end date (YYYY-MM-DD)
          title: End Date
        required: false
        description: Filter by end date (YYYY-MM-DD)
      - in: query
        name: robotic_set
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by robotic set
          title: Robotic Set
        required: false
        description: Filter by robotic set
      - in: query
        name: service_code
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by service code
          title: Service Code
        required: false
        description: Filter by service code
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDeviationsSummary'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'Get aggregated summary of a project''s deviations.


        Args:

        request: HTTP request object

        project_id: Project UUID

        params: Query parameters for filtering


        Returns:

        ProjectDeviationsSummary with aggregated financial totals'
      tags:
      - deviations
      security:
      - APIKeyAuth: []
      - CookieAuth: []
