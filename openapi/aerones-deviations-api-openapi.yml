openapi: 3.2.0
info:
  title: Operations Hub Deviations API
  version: 0.1.1
  description: ''
servers: []
tags:
- name: deviations
paths:
  /api/deviations/filters:
    get:
      operationId: deviations_api_get_global_deviations_filters
      summary: Get Global Deviations Filters
      parameters:
      - in: query
        name: start_date
        schema:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          description: Filter by start date (YYYY-MM-DD)
          title: Start Date
        required: false
        description: Filter by start date (YYYY-MM-DD)
      - in: query
        name: end_date
        schema:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          description: Filter by end date (YYYY-MM-DD)
          title: End Date
        required: false
        description: Filter by end date (YYYY-MM-DD)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalDeviationsFilters'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'Get available filter values for global deviations.


        Args:

        request: HTTP request object

        params: Query parameters with optional start_date and end_date


        Returns:

        GlobalDeviationsFilters with projectCodes, countryCodes, and regions'
      tags:
      - deviations
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/deviations/summary:
    get:
      operationId: deviations_api_get_global_deviations_summary
      summary: Get Global Deviations Summary
      parameters:
      - in: query
        name: period_type
        schema:
          allOf:
          - description: Global period type enumeration (weekly or monthly).
            enum:
            - weekly
            - monthly
            title: GlobalPeriodTypeEnum
            type: string
          default: weekly
          description: 'Period type: ''weekly'' (default) or ''monthly'''
        required: false
        description: 'Period type: ''weekly'' (default) or ''monthly'''
      - in: query
        name: start_date
        schema:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          description: Filter by start date (YYYY-MM-DD)
          title: Start Date
        required: false
        description: Filter by start date (YYYY-MM-DD)
      - in: query
        name: end_date
        schema:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          description: Filter by end date (YYYY-MM-DD)
          title: End Date
        required: false
        description: Filter by end date (YYYY-MM-DD)
      - in: query
        name: search
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Partial match search on project code (case-insensitive)
          title: Search
        required: false
        description: Partial match search on project code (case-insensitive)
      - in: query
        name: project_codes
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by exact project codes (comma-separated)
          title: Project Codes
        required: false
        description: Filter by exact project codes (comma-separated)
      - in: query
        name: country_code
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by country codes (comma-separated alpha-2)
          title: Country Code
        required: false
        description: Filter by country codes (comma-separated alpha-2)
      - in: query
        name: region
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by regions (comma-separated)
          title: Region
        required: false
        description: Filter by regions (comma-separated)
      - in: query
        name: filter_currency
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Currency for financial filters (EUR, USD, or AUD)
          title: Filter Currency
        required: false
        description: Currency for financial filters (EUR, USD, or AUD)
      - in: query
        name: fixed_planned_min
        schema:
          anyOf:
          - type: number
          - type: 'null'
          description: Minimum fixed planned value
          title: Fixed Planned Min
        required: false
        description: Minimum fixed planned value
      - in: query
        name: fixed_planned_max
        schema:
          anyOf:
          - type: number
          - type: 'null'
          description: Maximum fixed planned value
          title: Fixed Planned Max
        required: false
        description: Maximum fixed planned value
      - in: query
        name: actual_planned_min
        schema:
          anyOf:
          - type: number
          - type: 'null'
          description: Minimum actual planned value
          title: Actual Planned Min
        required: false
        description: Minimum actual planned value
      - in: query
        name: actual_planned_max
        schema:
          anyOf:
          - type: number
          - type: 'null'
          description: Maximum actual planned value
          title: Actual Planned Max
        required: false
        description: Maximum actual planned value
      - in: query
        name: amount_charged_min
        schema:
          anyOf:
          - type: number
          - type: 'null'
          description: Minimum amount charged
          title: Amount Charged Min
        required: false
        description: Minimum amount charged
      - in: query
        name: amount_charged_max
        schema:
          anyOf:
          - type: number
          - type: 'null'
          description: Maximum amount charged
          title: Amount Charged Max
        required: false
        description: Maximum amount charged
      - in: query
        name: deviation_from_actual_min
        schema:
          anyOf:
          - type: number
          - type: 'null'
          description: Minimum deviation from actual
          title: Deviation From Actual Min
        required: false
        description: Minimum deviation from actual
      - in: query
        name: deviation_from_actual_max
        schema:
          anyOf:
          - type: number
          - type: 'null'
          description: Maximum deviation from actual
          title: Deviation From Actual Max
        required: false
        description: Maximum deviation from actual
      - in: query
        name: deviation_from_fixed_min
        schema:
          anyOf:
          - type: number
          - type: 'null'
          description: Minimum deviation from fixed
          title: Deviation From Fixed Min
        required: false
        description: Minimum deviation from fixed
      - in: query
        name: deviation_from_fixed_max
        schema:
          anyOf:
          - type: number
          - type: 'null'
          description: Maximum deviation from fixed
          title: Deviation From Fixed Max
        required: false
        description: Maximum deviation from fixed
