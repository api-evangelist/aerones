        Args:

        request: HTTP request object

        params: Query parameters for filtering (same as deviations endpoint except pagination)


        Returns:

        GlobalDeviationsSummary with aggregated financial totals'
      tags:
      - deviations
      security:
      - APIKeyAuth: []
      - CookieAuth: []
  /api/deviations/{project_id}/filters:
    get:
