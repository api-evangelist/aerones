                $ref: '#/components/schemas/DeviationsListResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'Get deviation data for a project.


        Args:

        request: HTTP request object

        project_id: Project UUID

        params: Query parameters for filtering, pagination, and export format


        Returns:

        DeviationsListResponse with deviation data, or file response if format specified'
      tags:
      - deviations
      security:
      - APIKeyAuth: []
      - CookieAuth: []
    patch:
      operationId: deviations_api_update_project_deviations
      summary: Update Project Deviations
      parameters:
      - in: path
        name: project_id
        schema:
          format: uuid
          title: Project Id
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviationsPatchResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'Update deviation rows for a project (bulk update).


        Args:

        request: HTTP request object

        project_id: Project UUID

        payload: List of deviation update items


        Returns:

        DeviationsPatchResponse with update results'
      tags:
      - deviations
      requestBody:
        content:
          application/json:
            schema:
              items:
                $ref: '#/components/schemas/DeviationUpdateItem'
              title: Payload
              type: array
        required: true
      security:
      - APIKeyAuth: []
      - CookieAuth: []
