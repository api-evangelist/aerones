openapi: 3.2.0
info:
  title: Operations Hub Core.pipedrive Deals API
  version: 0.1.1
  description: ''
servers: []
tags:
- name: core.pipedrive-deals
paths:
  /api/core/v1/pipedrive-deals:
    get:
      operationId: list_pipedrive_deals
      summary: List Pipedrive Deals
      parameters:
      - in: query
        name: search
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Search by title (case-insensitive)
          title: Search
        required: false
        description: Search by title (case-insensitive)
      - in: query
        name: sort
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Sort by field (prefix with - for descending)
          title: Sort
        required: false
        description: Sort by field (prefix with - for descending)
      - in: query
        name: paginate
        schema:
          default: true
          description: Enable pagination (false returns all results)
          title: Paginate
          type: boolean
        required: false
        description: Enable pagination (false returns all results)
      - in: query
        name: page
        schema:
          default: 1
          description: Page number
          minimum: 1
          title: Page
          type: integer
        required: false
        description: Page number
      - in: query
        name: page_size
        schema:
          default: 50
          description: Number of items per page
          maximum: 1000
          minimum: 1
          title: Page Size
          type: integer
        required: false
        description: Number of items per page
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PipedriveDealResponse'
                title: Response
                type: array
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'List all Pipedrive deals with optional search and sorting.


        Returns deals with parsed titles (project code only).

        Deals without valid project codes are filtered out.'
      tags:
      - core.pipedrive-deals
      security:
      - APIKeyAuth: []
      - CookieAuth: []
components:
  schemas:
    Error:
      additionalProperties: false
      description: Error response schema.
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          title: Message
          type: string
      required:
      - code
      - message
      title: Error
      type: object
    ErrorCode:
      description: Error codes for API errors.
      enum:
      - validation
      - server
      - auth
      - unknown
      - external
      - generic
      title: ErrorCode
      type: string
    PipedriveDealResponse:
      additionalProperties: false
      description: 'Schema for PipedriveDeal response.


        Returns parsed title (project code only, e.g., ''EDFR-5308'' from ''EDFR-5308 IIN x6'').

        Deals without a valid title/project code are filtered out.'
      properties:
        updated_at:
          description: Last update timestamp from Pipedrive
          format: date-time
          title: Updated At
          type: string
        id:
          description: Pipedrive deal ID
          title: Id
          type: string
        title:
          description: Parsed deal title (project code only)
          title: Title
          type: string
      required:
      - updated_at
      - id
      - title
      title: PipedriveDealResponse
      type: object
  securitySchemes:
    APIKeyAuth:
      type: http
      scheme: bearer
    CookieAuth:
      type: apiKey
      in: cookie
      name: opshub_prod_sessionid
    AuthBearer:
      type: http
      scheme: bearer
