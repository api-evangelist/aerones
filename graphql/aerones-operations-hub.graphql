enum ProjectRoster {
  """On the project's resource set right now."""
  LIVE

  """
  On the set, or taken off it within the removal grace -- five days at present. The default for both feeds.
  """
  WITHIN_REMOVAL_GRACE

  """
  On the set at any point, however long ago the person was taken off it. Reaches work on projects they have since left.
  """
  ALL

  """
  The roster is not considered, so a pin alone assigns the workorder. The roster half matches nothing under this, being reached through the roster itself.
  """
  IGNORED
}

